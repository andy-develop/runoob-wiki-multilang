<svg width="720" height="300" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 未来公司：人类负责人 + AI Agent Manager + 三层 Agent -->

  <!-- L1 人类负责人 -->
  <rect x="285" y="8" width="150" height="34" rx="8" fill="#2e5c4e"/>
  <text x="360" y="30" text-anchor="middle" fill="#ffffff" font-size="14" font-family="Arial, sans-serif">人类负责人</text>

  <!-- L2 AI Agent Manager -->
  <line x1="360" y1="42" x2="360" y2="66" stroke="#c6cdbb" stroke-width="1.5"/>
  <rect x="270" y="66" width="180" height="32" rx="8" fill="#c07a2c"/>
  <text x="360" y="87" text-anchor="middle" fill="#ffffff" font-size="13" font-family="Arial, sans-serif">AI Agent Manager</text>

  <!-- L2 到 L3 的连线 -->
  <line x1="360" y1="98" x2="360" y2="112" stroke="#c6cdbb" stroke-width="1.5"/>
  <line x1="160" y1="112" x2="560" y2="112" stroke="#c6cdbb" stroke-width="1.5"/>
  <g stroke="#c6cdbb" stroke-width="1.5">
    <line x1="160" y1="112" x2="160" y2="124"/>
    <line x1="360" y1="112" x2="360" y2="124"/>
    <line x1="560" y1="112" x2="560" y2="124"/>
  </g>

  <!-- L3 三个 Agent -->
  <g fill="#fbfcf9" stroke="#2e5c4e" stroke-width="1">
    <rect x="85" y="124" width="150" height="32" rx="8"/>
    <rect x="285" y="124" width="150" height="32" rx="8"/>
    <rect x="485" y="124" width="150" height="32" rx="8"/>
  </g>
  <g fill="#1e271f" font-size="13" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="160" y="145">产品 Agent</text>
    <text x="360" y="145">Coding Agent</text>
    <text x="560" y="145">Marketing Agent</text>
  </g>

  <!-- L3 到 L4 的连线 -->
  <g stroke="#c6cdbb" stroke-width="1.5">
    <line x1="160" y1="156" x2="160" y2="176"/>
    <line x1="360" y1="156" x2="360" y2="176"/>
    <line x1="560" y1="156" x2="560" y2="176"/>
  </g>

  <!-- L4 -->
  <g fill="#fbfcf9" stroke="#c6cdbb" stroke-width="1">
    <rect x="85" y="176" width="150" height="30" rx="8"/>
    <rect x="285" y="176" width="150" height="30" rx="8"/>
    <rect x="485" y="176" width="150" height="30" rx="8"/>
  </g>
  <g fill="#1e271f" font-size="12.5" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="160" y="195">Research</text>
    <text x="360" y="195">Developer</text>
    <text x="560" y="195">Content</text>
  </g>

  <!-- L4 到 L5 的连线 -->
  <g stroke="#c6cdbb" stroke-width="1.5">
    <line x1="160" y1="206" x2="160" y2="226"/>
    <line x1="360" y1="206" x2="360" y2="226"/>
    <line x1="560" y1="206" x2="560" y2="226"/>
  </g>

  <!-- L5 -->
  <g fill="#fbfcf9" stroke="#c6cdbb" stroke-width="1">
    <rect x="85" y="226" width="150" height="30" rx="8"/>
    <rect x="285" y="226" width="150" height="30" rx="8"/>
    <rect x="485" y="226" width="150" height="30" rx="8"/>
  </g>
  <g fill="#1e271f" font-size="12.5" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="160" y="245">Analysis</text>
    <text x="360" y="245">Testing</text>
    <text x="560" y="245">SEO</text>
  </g>
</svg>
