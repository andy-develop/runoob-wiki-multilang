<svg viewBox="0 0 920 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <rect width="920" height="450" rx="12" fill="#f8f9ff"/>

  <!-- 标题 -->
  <text x="460" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">DeepSeek Harness：一切皆插件（Everything is a Plugin）</text>

  <!-- 连接线：宿主与各能力插件之间，全部平级 -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="460" y1="255" x2="460" y2="90"/>
    <line x1="460" y1="255" x2="679" y2="129"/>
    <line x1="460" y1="255" x2="795" y2="226"/>
    <line x1="460" y1="255" x2="754" y2="338"/>
    <line x1="460" y1="255" x2="576" y2="410"/>
    <line x1="460" y1="255" x2="344" y2="410"/>
    <line x1="460" y1="255" x2="166" y2="338"/>
    <line x1="460" y1="255" x2="125" y2="226"/>
    <line x1="460" y1="255" x2="241" y2="129"/>
  </g>

  <!-- 中央宿主：仅是插件容器，不含业务能力 -->
  <rect x="365" y="225" width="190" height="60" rx="10" fill="#2980b9"/>
  <text x="460" y="251" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">dsh 宿主进程</text>
  <text x="460" y="271" text-anchor="middle" font-size="11.5" fill="#d0e3ff">Cordis 插件容器 · 无特权核心</text>

  <!-- 周边能力插件：全部同级，可替换 -->
  <g fill="#e8f0ff" stroke="#2980b9" stroke-width="1.5">
    <rect x="404" y="72" width="112" height="36" rx="8"/>
    <rect x="623" y="111" width="112" height="36" rx="8"/>
    <rect x="739" y="208" width="112" height="36" rx="8"/>
    <rect x="698" y="320" width="112" height="36" rx="8"/>
    <rect x="520" y="392" width="112" height="36" rx="8"/>
    <rect x="288" y="392" width="112" height="36" rx="8"/>
    <rect x="110" y="320" width="112" height="36" rx="8"/>
    <rect x="69" y="208" width="112" height="36" rx="8"/>
    <rect x="185" y="111" width="112" height="36" rx="8"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1a3a8a" text-anchor="middle">
    <text x="460" y="95">模型适配器</text>
    <text x="679" y="134">权限策略</text>
    <text x="795" y="231">UI</text>
    <text x="754" y="343">调度</text>
    <text x="576" y="415">存储</text>
    <text x="344" y="415">沙箱</text>
    <text x="166" y="343">Agent Loop</text>
    <text x="125" y="231">会话日志</text>
    <text x="241" y="134">工具注册表</text>
  </g>
</svg>
