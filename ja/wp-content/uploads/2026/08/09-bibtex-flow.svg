<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" style="width:100%;height:auto;">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: Menlo, Consolas, 'Courier New', monospace; }
  </style>
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <rect x="40" y="90" width="170" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="125" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" class="mono">main.tex</text>
  <text x="125" y="158" text-anchor="middle" font-size="12" fill="#6b7280">你的源文件</text>
  <rect x="265" y="90" width="170" height="100" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="350" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" class="mono">main.aux</text>
  <text x="350" y="158" text-anchor="middle" font-size="12" fill="#6b7280">记录引用了哪些文献</text>
  <rect x="490" y="90" width="170" height="100" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="575" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" class="mono">main.bbl</text>
  <text x="575" y="158" text-anchor="middle" font-size="12" fill="#6b7280">排好版的文献列表</text>
  <rect x="715" y="90" width="200" height="100" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="815" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" class="mono">main.pdf</text>
  <text x="815" y="158" text-anchor="middle" font-size="12" fill="#6b7280">最终成品</text>
  <line x1="212" y1="140" x2="261" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="208" y="106" width="56" height="20" fill="#ffffff" opacity="0.95"/>
  <text x="236" y="120" text-anchor="middle" font-size="12" fill="#2563eb" class="mono">xelatex</text>
  <line x1="437" y1="140" x2="486" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="437" y="106" width="48" height="20" fill="#ffffff" opacity="0.95"/>
  <text x="461" y="120" text-anchor="middle" font-size="12" fill="#2563eb" class="mono">bibtex</text>
  <line x1="662" y1="140" x2="711" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="646" y="106" width="80" height="20" fill="#ffffff" opacity="0.95"/>
  <text x="686" y="120" text-anchor="middle" font-size="12" fill="#2563eb" class="mono">xelatex ×2</text>
  <rect x="340" y="290" width="280" height="90" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="480" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" class="mono">refs.bib</text>
  <text x="480" y="354" text-anchor="middle" font-size="12" fill="#6b7280">文献数据库（@article{...}）</text>
  <path d="M480,290 C480,240 520,225 545,195" stroke="#ea580c" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <rect x="560" y="238" width="96" height="20" fill="#ffffff" opacity="0.95"/>
  <text x="608" y="252" text-anchor="middle" font-size="12" fill="#ea580c">提供文献数据</text>
  <text x="480" y="420" text-anchor="middle" font-size="12" fill="#6b7280">新增引用后按上述顺序完整跑一遍；latexmk -pdf 可一键自动完成全部步骤</text>
</svg>