<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">SAMPLING PIPELINE</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="236" y1="176" x2="268" y2="176" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="468" y1="176" x2="500" y2="176" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="700" y1="176" x2="732" y2="176" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M832,232 C832,312 132,312 132,232" fill="none" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="392" y="300" width="176" height="14" rx="2" fill="#faf7f2"/>
  <text x="480" y="311" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">逐 token 循环生成</text>

  <!-- ===== Step 1 ===== -->
  <rect x="36" y="120" width="200" height="112" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="44" y="128" width="24" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="56" y="137" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
  <text x="136" y="168" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">概率分布</text>
  <text x="136" y="190" fill="#57534e" font-size="9.5" text-anchor="middle">给出每个候选词的概率</text>
  <text x="136" y="210" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">的 0.32 · 是 0.21 · 在 0.11</text>

  <!-- ===== Step 2 ===== -->
  <rect x="268" y="120" width="200" height="112" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="276" y="128" width="24" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="288" y="137" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
  <text x="368" y="168" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">temperature</text>
  <text x="368" y="190" fill="#57534e" font-size="9.5" text-anchor="middle">低更确定 · 高更多样</text>
  <text x="368" y="210" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">默认 0.8</text>

  <!-- ===== Step 3 ===== -->
  <rect x="500" y="120" width="200" height="112" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="508" y="128" width="24" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="520" y="137" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
  <text x="600" y="168" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">截断过滤</text>
  <text x="600" y="190" fill="#57534e" font-size="9.5" text-anchor="middle">top_k 取前 40 · top_p 累计 0.9</text>
  <text x="600" y="210" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">min_p 设概率下限</text>

  <!-- ===== Step 4（focal） ===== -->
  <rect x="732" y="120" width="200" height="112" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="740" y="128" width="24" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
  <text x="752" y="137" fill="#b5523a" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
  <text x="832" y="168" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">采样输出</text>
  <text x="832" y="190" fill="#57534e" font-size="9.5" text-anchor="middle">选出下一个 token</text>
  <text x="832" y="210" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">seed 固定则可复现</text>
</svg>
