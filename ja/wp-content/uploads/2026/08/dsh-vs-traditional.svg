<svg viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <rect width="920" height="420" rx="12" fill="#f8f9ff"/>

  <!-- 标题 -->
  <text x="460" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">传统 Agent 与 DeepSeek Harness 的结构对比</text>

  <!-- 左侧：传统 Agent，能力封装在核心内 -->
  <rect x="20" y="60" width="400" height="330" rx="12" fill="#f1f3f7" stroke="#b8c2cf" stroke-width="1.5"/>
  <text x="220" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a5568">传统 Agent 框架</text>

  <rect x="60" y="102" width="320" height="230" rx="8" fill="#e4e9f0" stroke="#9aa7b8" stroke-width="1.5"/>
  <text x="220" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a5568">Agent 核心（能力写死）</text>

  <g fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1">
    <rect x="80" y="140" width="130" height="34" rx="6"/>
    <rect x="230" y="140" width="130" height="34" rx="6"/>
    <rect x="80" y="194" width="130" height="34" rx="6"/>
    <rect x="230" y="194" width="130" height="34" rx="6"/>
    <rect x="80" y="248" width="130" height="34" rx="6"/>
    <rect x="230" y="248" width="130" height="34" rx="6" stroke-dasharray="5,4" fill="none"/>
  </g>
  <g font-size="12" fill="#4a5568" text-anchor="middle">
    <text x="145" y="161">Model</text>
    <text x="295" y="161">Tool</text>
    <text x="145" y="215">Memory</text>
    <text x="295" y="215">Loop</text>
    <text x="145" y="269">UI</text>
    <text x="295" y="269" fill="#8894a6">预留扩展接口</text>
  </g>

  <text x="220" y="360" text-anchor="middle" font-size="11.5" fill="#7a8699">能力封装在核心内，扩展只能依赖预留接口</text>

  <!-- 右侧：dsh，宿主只组织能力 -->
  <rect x="500" y="60" width="400" height="330" rx="12" fill="#eef4fd" stroke="#2980b9" stroke-width="1.5"/>
  <text x="700" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a8a">DeepSeek Harness</text>

  <rect x="590" y="102" width="220" height="40" rx="8" fill="#2980b9"/>
  <text x="700" y="127" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">Harness 宿主（只组织能力）</text>

  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="700" y1="142" x2="625" y2="190"/>
    <line x1="700" y1="142" x2="775" y2="190"/>
    <line x1="700" y1="142" x2="625" y2="240"/>
    <line x1="700" y1="142" x2="775" y2="240"/>
    <line x1="700" y1="142" x2="625" y2="290"/>
    <line x1="700" y1="142" x2="775" y2="290"/>
  </g>

  <g fill="#e8f0ff" stroke="#2980b9" stroke-width="1">
    <rect x="560" y="190" width="130" height="34" rx="6"/>
    <rect x="710" y="190" width="130" height="34" rx="6"/>
    <rect x="560" y="240" width="130" height="34" rx="6"/>
    <rect x="710" y="240" width="130" height="34" rx="6"/>
    <rect x="560" y="290" width="130" height="34" rx="6"/>
    <rect x="710" y="290" width="130" height="34" rx="6"/>
  </g>
  <g font-size="12" fill="#1a3a8a" text-anchor="middle">
    <text x="625" y="211">Model 插件</text>
    <text x="775" y="211">Agent Loop 插件</text>
    <text x="625" y="261">Tool 插件</text>
    <text x="775" y="261">Browser 插件</text>
    <text x="625" y="311">Memory 插件</text>
    <text x="775" y="311">UI 插件</text>
  </g>

  <text x="700" y="360" text-anchor="middle" font-size="11.5" fill="#5a7aa8">宿主不含业务能力，全部能力由同级插件提供</text>

  <!-- 中间对比标识 -->
  <text x="460" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#94a3b8">VS</text>
</svg>
