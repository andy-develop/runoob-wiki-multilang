<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="trainArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">LLM 训练流程</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#6b7280">从原始文本到可对话、符合人类意图的模型</text>

  <!-- 输入：海量文本 -->
  <rect x="30" y="150" width="120" height="120" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="90" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">海量无标注</text>
  <text x="90" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">文本</text>
  <text x="90" y="240" text-anchor="middle" font-size="10.5" fill="#64748b">网页 / 书籍</text>
  <text x="90" y="256" text-anchor="middle" font-size="10.5" fill="#64748b">代码 / 论文</text>

  <line x1="150" y1="210" x2="184" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#trainArrow)"/>

  <!-- 阶段 1：预训练 -->
  <rect x="186" y="150" width="150" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="261" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">预训练</text>
  <text x="261" y="198" text-anchor="middle" font-size="10" fill="#6b7280">Pre-training</text>
  <text x="261" y="226" text-anchor="middle" font-size="11" fill="#475569">学习语言的</text>
  <text x="261" y="244" text-anchor="middle" font-size="11" fill="#475569">统计规律</text>
  <text x="261" y="262" text-anchor="middle" font-size="10" fill="#94a3b8">算力消耗最大</text>

  <line x1="336" y1="210" x2="370" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#trainArrow)"/>

  <!-- 阶段 2：SFT -->
  <rect x="372" y="150" width="150" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="447" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">SFT</text>
  <text x="447" y="198" text-anchor="middle" font-size="10" fill="#6b7280">监督微调</text>
  <text x="447" y="226" text-anchor="middle" font-size="11" fill="#475569">用问答对教模型</text>
  <text x="447" y="244" text-anchor="middle" font-size="11" fill="#475569">按指令回答</text>
  <text x="447" y="262" text-anchor="middle" font-size="10" fill="#94a3b8">人工标注数据</text>

  <line x1="522" y1="210" x2="556" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#trainArrow)"/>

  <!-- 阶段 3：RLHF -->
  <rect x="558" y="150" width="150" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="633" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">RLHF</text>
  <text x="633" y="198" text-anchor="middle" font-size="10" fill="#6b7280">人类反馈强化学习</text>
  <text x="633" y="226" text-anchor="middle" font-size="11" fill="#475569">用人类打分</text>
  <text x="633" y="244" text-anchor="middle" font-size="11" fill="#475569">校准输出偏好</text>
  <text x="633" y="262" text-anchor="middle" font-size="10" fill="#94a3b8">奖励模型 + 强化学习</text>

  <line x1="708" y1="210" x2="742" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#trainArrow)"/>

  <!-- 输出：可对话 LLM -->
  <rect x="744" y="150" width="226" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="857" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">可对话的 LLM</text>
  <text x="857" y="214" text-anchor="middle" font-size="11" fill="#64748b">懂指令 · 符合偏好</text>
  <text x="857" y="234" text-anchor="middle" font-size="11" fill="#64748b">有用 · 诚实 · 安全</text>
  <text x="857" y="256" text-anchor="middle" font-size="10" fill="#94a3b8">如 ChatGPT / Claude 等</text>

  <!-- 对齐贯穿提示（虚线括号） -->
  <path d="M 372 300 Q 372 320 447 320 L 633 320 Q 708 320 708 300" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="540" y1="320" x2="540" y2="345" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="430" y="346" width="220" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="540" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">对齐（Alignment）</text>
  <text x="540" y="380" text-anchor="middle" font-size="10.5" fill="#c2410c">让模型符合人类意图，贯穿 SFT / RLHF 全过程</text>

  <!-- 图例 -->
  <g transform="translate(30, 410)">
    <line x1="0" y1="6" x2="28" y2="6" stroke="#2563eb" stroke-width="2" marker-end="url(#trainArrow)"/>
    <text x="36" y="10" fill="#6b7280" font-size="11">训练推进方向</text>
  </g>
</svg>
