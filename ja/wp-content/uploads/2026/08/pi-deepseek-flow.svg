<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Pi 接入 DeepSeek 架构</text>

  <!-- 配置来源 -->
  <rect x="315" y="60" width="190" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">models.json</text>
  <text x="410" y="104" text-anchor="middle" font-size="11" fill="#64748b">供应商与模型定义</text>

  <rect x="315" y="300" width="190" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">DEEPSEEK_API_KEY</text>
  <text x="410" y="338" text-anchor="middle" font-size="11" fill="#64748b">环境变量 · 鉴权密钥</text>

  <!-- 主流程节点 -->
  <rect x="30" y="195" width="150" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">开发者</text>
  <text x="105" y="241" text-anchor="middle" font-size="11" fill="#64748b">终端交互</text>

  <rect x="315" y="195" width="190" height="62" rx="8" fill="#2563eb"/>
  <text x="410" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Pi CLI</text>
  <text x="410" y="241" text-anchor="middle" font-size="11" fill="#dbeafe">终端编程助手</text>

  <rect x="610" y="195" width="190" height="62" rx="8" fill="#0d9488"/>
  <text x="705" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">OpenAI 兼容接口</text>
  <text x="705" y="241" text-anchor="middle" font-size="11" fill="#ccfbf1">baseUrl · 对接协议</text>

  <rect x="870" y="195" width="120" height="62" rx="8" fill="#7c3aed"/>
  <text x="930" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">DeepSeek API</text>
  <text x="930" y="241" text-anchor="middle" font-size="11" fill="#ede9fe">v4 系列模型</text>

  <!-- 主流程箭头 -->
  <line x1="180" y1="226" x2="309" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="505" y1="226" x2="604" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="800" y1="226" x2="864" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- 配置来源供给 Pi CLI -->
  <line x1="410" y1="120" x2="410" y2="189" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <line x1="410" y1="300" x2="410" y2="263" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>

  <!-- 连线标注 -->
  <text x="244" y="252" text-anchor="middle" font-size="11" fill="#94a3b8">操作</text>
  <text x="555" y="252" text-anchor="middle" font-size="11" fill="#94a3b8">HTTP 请求</text>
  <text x="832" y="252" text-anchor="middle" font-size="11" fill="#94a3b8">调用</text>
</svg>
