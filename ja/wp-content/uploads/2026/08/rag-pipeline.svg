<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">RAG PIPELINE</text>

  <!-- ===== 阶段分隔 ===== -->
  <text x="36" y="92" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">阶段一 · 离线索引</text>
  <line x1="36" y1="280" x2="924" y2="280" stroke="rgba(28,25,23,0.12)" stroke-width="0.8" stroke-dasharray="5,4"/>
  <text x="36" y="324" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">阶段二 · 在线问答</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="206" y1="166" x2="270" y2="166" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="440" y1="166" x2="504" y2="166" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="674" y1="166" x2="738" y2="166" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M831,208 L831,300 L355,300 L355,356" fill="none" stroke="#b5523a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <line x1="206" y1="398" x2="270" y2="398" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="440" y1="398" x2="504" y2="398" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="674" y1="398" x2="738" y2="398" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 箭头标签 ===== -->
  <rect x="556" y="288" width="120" height="14" rx="2" fill="#faf7f2"/>
  <text x="616" y="299" fill="#b5523a" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">取回 top-k 片段</text>

  <!-- ===== 上排：索引链路 ===== -->
  <rect x="36" y="124" width="170" height="84" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="121" y="158" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">本地文档</text>
  <text x="121" y="180" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">txt / md / pdf</text>

  <rect x="270" y="124" width="170" height="84" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="355" y="158" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">解析与切片</text>
  <text x="355" y="180" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">定长 + 重叠</text>

  <rect x="504" y="124" width="170" height="84" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="589" y="158" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">嵌入模型</text>
  <text x="589" y="180" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">embeddinggemma</text>

  <rect x="738" y="124" width="186" height="84" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="831" y="158" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">向量库</text>
  <text x="831" y="180" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">向量 + 原文片段</text>

  <!-- ===== 下排：问答链路 ===== -->
  <rect x="36" y="356" width="170" height="84" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="121" y="390" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">用户提问</text>
  <text x="121" y="412" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">RUNOOB 是什么？</text>

  <rect x="270" y="356" width="170" height="84" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="355" y="390" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">检索</text>
  <text x="355" y="412" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">嵌入问题 · 余弦相似度</text>

  <rect x="504" y="356" width="170" height="84" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="589" y="390" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">拼 prompt 生成</text>
  <text x="589" y="412" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">qwen3.5 · 要求引用来源</text>

  <rect x="738" y="356" width="186" height="84" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="831" y="390" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">带引用的回答</text>
  <text x="831" y="412" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">可溯源 · 幻觉更少</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="512" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">检索质量决定回答质量：切片大小与 top-k 是调优的第一杠杆</text>
</svg>
