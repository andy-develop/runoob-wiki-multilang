<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">TASK TO MODEL</text>

  <!-- ===== 连线（先画） ===== -->
  <path d="M480,128 C480,208 96,208 96,288" fill="none" stroke="rgba(28,25,23,0.35)" stroke-width="1"/>
  <path d="M480,128 C480,208 288,208 288,288" fill="none" stroke="rgba(28,25,23,0.35)" stroke-width="1"/>
  <path d="M480,128 C480,208 480,208 480,288" fill="none" stroke="rgba(28,25,23,0.35)" stroke-width="1"/>
  <path d="M480,128 C480,208 672,208 672,288" fill="none" stroke="rgba(28,25,23,0.35)" stroke-width="1"/>
  <path d="M480,128 C480,208 864,208 864,288" fill="none" stroke="rgba(28,25,23,0.35)" stroke-width="1"/>

  <!-- ===== 根节点（focal） ===== -->
  <rect x="384" y="72" width="192" height="56" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="480" y="100" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">你的任务</text>
  <text x="480" y="116" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">先定任务，再选模型</text>

  <!-- ===== 叶 1：日常对话 ===== -->
  <rect x="16" y="288" width="160" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="96" y="320" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">日常对话</text>
  <text x="96" y="344" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">qwen3.5:4b ~ 9b</text>
  <text x="96" y="364" fill="#57534e" font-size="9" text-anchor="middle">通用问答与写作</text>

  <!-- ===== 叶 2：代码生成 ===== -->
  <rect x="208" y="288" width="160" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="288" y="320" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">代码生成</text>
  <text x="288" y="344" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">qwen3-coder</text>
  <text x="288" y="364" fill="#57534e" font-size="9" text-anchor="middle">建议显存 24GB+</text>

  <!-- ===== 叶 3：推理思考 ===== -->
  <rect x="400" y="288" width="160" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="480" y="320" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">推理思考</text>
  <text x="480" y="344" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">deepseek-r1</text>
  <text x="480" y="364" fill="#57534e" font-size="9" text-anchor="middle">数学与逻辑任务</text>

  <!-- ===== 叶 4：看图理解 ===== -->
  <rect x="592" y="288" width="160" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="672" y="320" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">看图理解</text>
  <text x="672" y="344" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">qwen3.5 原生视觉</text>
  <text x="672" y="364" fill="#57534e" font-size="9" text-anchor="middle">图片路径即可提问</text>

  <!-- ===== 叶 5：文本转向量 ===== -->
  <rect x="784" y="288" width="160" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="864" y="320" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">文本转向量</text>
  <text x="864" y="344" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">embeddinggemma</text>
  <text x="864" y="364" fill="#57534e" font-size="9" text-anchor="middle">RAG 与语义搜索</text>
</svg>
