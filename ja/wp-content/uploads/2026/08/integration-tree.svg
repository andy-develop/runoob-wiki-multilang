<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">INTEGRATION LANDSCAPE</text>

  <!-- ===== 连线（先画） ===== -->
  <path d="M480,128 C480,208 176,208 176,288" fill="none" stroke="rgba(28,25,23,0.35)" stroke-width="1"/>
  <path d="M480,128 C480,208 480,208 480,288" fill="none" stroke="rgba(28,25,23,0.35)" stroke-width="1"/>
  <path d="M480,128 C480,208 784,208 784,288" fill="none" stroke="rgba(28,25,23,0.35)" stroke-width="1"/>

  <!-- ===== 根节点（focal） ===== -->
  <rect x="360" y="72" width="240" height="56" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="480" y="98" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama 集成生态</text>
  <text x="480" y="116" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">ollama launch 一键接入</text>

  <!-- ===== 支 1：终端 Coding Agent ===== -->
  <rect x="36" y="288" width="280" height="112" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="176" y="318" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">终端 Coding Agent</text>
  <text x="176" y="342" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Claude Code · OpenCode · Codex</text>
  <text x="176" y="360" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Copilot CLI · Droid · Goose</text>
  <text x="176" y="382" fill="#57534e" font-size="9" text-anchor="middle">命令行里的编程助手</text>

  <!-- ===== 支 2：IDE 与编辑器 ===== -->
  <rect x="340" y="288" width="280" height="112" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="480" y="318" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">IDE 与编辑器</text>
  <text x="480" y="342" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">VS Code · JetBrains · Cline</text>
  <text x="480" y="360" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Roo Code · Zed · Xcode</text>
  <text x="480" y="382" fill="#57534e" font-size="9" text-anchor="middle">写代码时随叫随到</text>

  <!-- ===== 支 3：桌面与自动化 ===== -->
  <rect x="644" y="288" width="280" height="112" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="784" y="318" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">桌面助手与自动化</text>
  <text x="784" y="342" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Claude Desktop · OpenClaw · Hermes</text>
  <text x="784" y="360" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">n8n · Onyx · Marimo</text>
  <text x="784" y="382" fill="#57534e" font-size="9" text-anchor="middle">日常助理与工作流</text>
</svg>
