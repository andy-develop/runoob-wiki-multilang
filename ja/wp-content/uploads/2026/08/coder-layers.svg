<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">CODING ASSISTANT STACK</text>

  <!-- ===== L3 工具层 ===== -->
  <rect x="96" y="72" width="808" height="84" rx="6" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <text x="112" y="100" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L3</text>
  <text x="140" y="102" fill="#1c1917" font-size="14" font-weight="600">工具层</text>
  <text x="888" y="101" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">你每天面对的界面</text>
  <rect x="112" y="116" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="204" y="134" fill="#1c1917" font-size="10" text-anchor="middle">VS Code Chat</text>
  <rect x="308" y="116" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="400" y="134" fill="#1c1917" font-size="10" text-anchor="middle">Claude Code</text>
  <rect x="504" y="116" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="596" y="134" fill="#1c1917" font-size="10" text-anchor="middle">Cline / JetBrains</text>
  <rect x="700" y="116" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="792" y="134" fill="#1c1917" font-size="10" text-anchor="middle">终端脚本</text>

  <!-- ===== L2 协议层（focal） ===== -->
  <rect x="96" y="164" width="808" height="84" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="112" y="192" fill="#b5523a" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L2</text>
  <text x="140" y="194" fill="#1c1917" font-size="14" font-weight="600">协议层</text>
  <text x="888" y="193" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">localhost:11434</text>
  <rect x="112" y="208" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(181,82,58,0.45)" stroke-width="0.8"/>
  <text x="204" y="226" fill="#1c1917" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">/v1/messages</text>
  <rect x="308" y="208" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(181,82,58,0.45)" stroke-width="0.8"/>
  <text x="400" y="226" fill="#1c1917" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">/v1/chat/completions</text>
  <rect x="504" y="208" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(181,82,58,0.45)" stroke-width="0.8"/>
  <text x="596" y="226" fill="#1c1917" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">/api/chat</text>

  <!-- ===== L1 模型层 ===== -->
  <rect x="96" y="256" width="808" height="84" rx="6" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <text x="112" y="284" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L1</text>
  <text x="140" y="286" fill="#1c1917" font-size="14" font-weight="600">模型层</text>
  <text x="888" y="285" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">随显存自由切换</text>
  <rect x="112" y="300" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="204" y="318" fill="#1c1917" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">runoob-coder（定制）</text>
  <rect x="308" y="300" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="400" y="318" fill="#1c1917" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">qwen3-coder</text>
  <rect x="504" y="300" width="184" height="28" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="596" y="318" fill="#1c1917" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">qwen3.5:9b</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="376" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">层与层解耦：换工具不用改模型，换模型不用改工具</text>
</svg>
