<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">TEAM DEPLOYMENT TOPOLOGY</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="206" y1="252" x2="280" y2="252" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="252" x2="554" y2="252" stroke="#b5523a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <path d="M674,164 L674,112 L724,112" fill="none" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ===== 箭头标签 ===== -->
  <rect x="196" y="232" width="100" height="14" rx="2" fill="#faf7f2"/>
  <text x="246" y="243" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">HTTP + 凭证</text>
  <rect x="470" y="232" width="100" height="14" rx="2" fill="#faf7f2"/>
  <text x="520" y="243" fill="#b5523a" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">仅限内网转发</text>
  <rect x="682" y="132" width="104" height="14" rx="2" fill="#faf7f2"/>
  <text x="734" y="143" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">push / pull</text>

  <!-- ===== 客户端组 ===== -->
  <rect x="36" y="152" width="170" height="200" rx="8" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <text x="121" y="182" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">内网成员</text>
  <rect x="52" y="200" width="138" height="36" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="121" y="222" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">同事的 CLI</text>
  <rect x="52" y="244" width="138" height="36" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="121" y="266" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Web 界面</text>
  <rect x="52" y="288" width="138" height="36" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="121" y="310" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">CI 脚本</text>

  <!-- ===== Nginx 反代 ===== -->
  <rect x="280" y="176" width="200" height="152" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="380" y="210" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Nginx 反向代理</text>
  <text x="380" y="236" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Basic Auth 鉴权</text>
  <text x="380" y="256" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">限流 · TLS 终结</text>
  <text x="380" y="276" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">流式转发 buffering off</text>
  <text x="380" y="304" fill="#78716c" font-size="9" text-anchor="middle">安全边界在这一层</text>

  <!-- ===== Ollama 服务（focal） ===== -->
  <rect x="554" y="164" width="240" height="176" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="674" y="198" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama 服务</text>
  <text x="674" y="222" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Docker 容器 · GPU 直通</text>
  <text x="674" y="246" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">监听 127.0.0.1:11434</text>
  <text x="674" y="270" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">数据卷持久化模型</text>
  <text x="674" y="302" fill="#78716c" font-size="9" text-anchor="middle">只信任来自反代的流量</text>

  <!-- ===== 模型库 ===== -->
  <rect x="724" y="84" width="200" height="60" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="824" y="110" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">模型库 ollama.com</text>
  <text x="824" y="130" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">公共模型 · 私有发布</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="448" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">Ollama 自身不提供鉴权，安全边界由反代与网络策略承担</text>
</svg>
