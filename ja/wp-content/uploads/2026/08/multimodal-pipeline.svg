<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="mmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="330" rx="12" fill="#f8f9ff"/>

  <!-- 标题 -->
  <text x="490" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">多模态模型如何"看懂"一张图片</text>

  <!-- 输入层：图片输入 -->
  <rect x="20" y="64" width="140" height="72" rx="10" fill="#eef4fd" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="64" y="74" width="52" height="34" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="76" cy="84" r="3.5" fill="#f1c40f"/>
  <path d="M 68 104 L 78 93 L 84 99 L 89 95 L 100 104 Z" fill="#6fbf73"/>
  <text x="90" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a8a">图片输入</text>

  <!-- 输入层：文本输入 -->
  <rect x="20" y="168" width="140" height="72" rx="10" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="64" y="178" width="52" height="28" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 78 206 L 86 206 L 76 214 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="90" y="197" text-anchor="middle" font-size="11" fill="#2c3e50">文字</text>
  <text x="90" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e6b3a">文本输入</text>

  <!-- 编码层：视觉编码器 -->
  <rect x="216" y="64" width="168" height="72" rx="10" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="300" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a8a">视觉编码器</text>
  <text x="300" y="118" text-anchor="middle" font-size="10" fill="#7a8699">图片切成 patch 转向量</text>

  <!-- 编码层：分词器 -->
  <rect x="216" y="168" width="168" height="72" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="300" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e6b3a">分词器 Tokenizer</text>
  <text x="300" y="218" text-anchor="middle" font-size="10" fill="#7a8699">文字切成文本 token</text>

  <!-- 统一 token 序列 -->
  <rect x="436" y="64" width="190" height="208" rx="10" fill="#fffdf4" stroke="#e0a93e" stroke-width="1.5"/>
  <text x="531" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6100">统一 token 序列</text>

  <!-- 第一行：图像 token -->
  <g>
    <rect x="471" y="104" width="24" height="24" rx="5" fill="#2980b9"/>
    <rect x="503" y="104" width="24" height="24" rx="5" fill="#2980b9"/>
    <rect x="535" y="104" width="24" height="24" rx="5" fill="#2980b9"/>
    <rect x="567" y="104" width="24" height="24" rx="5" fill="#2980b9"/>
    <text x="483" y="120" text-anchor="middle" font-size="11" fill="#ffffff">图</text>
    <text x="515" y="120" text-anchor="middle" font-size="11" fill="#ffffff">图</text>
    <text x="547" y="120" text-anchor="middle" font-size="11" fill="#ffffff">图</text>
    <text x="579" y="120" text-anchor="middle" font-size="11" fill="#ffffff">图</text>
  </g>

  <!-- 第二行：文本 token -->
  <g>
    <rect x="471" y="138" width="24" height="24" rx="5" fill="#27ae60"/>
    <rect x="503" y="138" width="24" height="24" rx="5" fill="#27ae60"/>
    <rect x="535" y="138" width="24" height="24" rx="5" fill="#27ae60"/>
    <rect x="567" y="138" width="24" height="24" rx="5" fill="#27ae60"/>
    <text x="483" y="154" text-anchor="middle" font-size="11" fill="#ffffff">文</text>
    <text x="515" y="154" text-anchor="middle" font-size="11" fill="#ffffff">文</text>
    <text x="547" y="154" text-anchor="middle" font-size="11" fill="#ffffff">文</text>
    <text x="579" y="154" text-anchor="middle" font-size="11" fill="#ffffff">文</text>
  </g>

  <!-- 第三行：图文混排 -->
  <g>
    <rect x="471" y="172" width="24" height="24" rx="5" fill="#2980b9"/>
    <rect x="503" y="172" width="24" height="24" rx="5" fill="#27ae60"/>
    <rect x="535" y="172" width="24" height="24" rx="5" fill="#27ae60"/>
    <rect x="567" y="172" width="24" height="24" rx="5" fill="#2980b9"/>
    <text x="483" y="188" text-anchor="middle" font-size="11" fill="#ffffff">图</text>
    <text x="515" y="188" text-anchor="middle" font-size="11" fill="#ffffff">文</text>
    <text x="547" y="188" text-anchor="middle" font-size="11" fill="#ffffff">文</text>
    <text x="579" y="188" text-anchor="middle" font-size="11" fill="#ffffff">图</text>
  </g>

  <text x="531" y="222" text-anchor="middle" font-size="10.5" fill="#7a8699">图文混排在同一个序列里</text>
  <rect x="447" y="234" width="168" height="22" rx="6" fill="#fdf3e2" stroke="#e0a93e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="531" y="249" text-anchor="middle" font-size="10" fill="#b9770e">单张图片最多占 384 tokens</text>

  <!-- 大语言模型 -->
  <rect x="676" y="94" width="150" height="140" rx="14" fill="#2980b9"/>
  <text x="751" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">大语言模型</text>
  <text x="751" y="164" text-anchor="middle" font-size="10.5" fill="#dbeafe">DeepSeek</text>
  <text x="751" y="180" text-anchor="middle" font-size="10.5" fill="#dbeafe">V4-Flash-Vision-Exp</text>

  <!-- 输出 -->
  <rect x="876" y="114" width="88" height="100" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/>
  <text x="920" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e6b3a">输出</text>
  <text x="920" y="168" text-anchor="middle" font-size="10.5" fill="#2c3e50">文字回答</text>
  <text x="920" y="186" text-anchor="middle" font-size="10.5" fill="#2c3e50">代码</text>
  <text x="920" y="204" text-anchor="middle" font-size="10.5" fill="#2c3e50">PPT 页面</text>

  <!-- 连线 -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="160" y1="100" x2="212" y2="100" marker-end="url(#mmArrow)"/>
    <line x1="160" y1="204" x2="212" y2="204" marker-end="url(#mmArrow)"/>
    <line x1="384" y1="100" x2="432" y2="100" marker-end="url(#mmArrow)"/>
    <line x1="384" y1="204" x2="432" y2="204" marker-end="url(#mmArrow)"/>
    <line x1="626" y1="164" x2="672" y2="164" marker-end="url(#mmArrow)"/>
    <line x1="826" y1="164" x2="872" y2="164" marker-end="url(#mmArrow)"/>
  </g>
</svg>
