<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="pipeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">大模型技术整体链路</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#6b7280">从模型训练到落地的完整技术链路</text>

  <!-- 阶段 1：训练阶段 -->
  <g>
    <rect x="60" y="90" width="170" height="78" rx="8" fill="#2563eb"/>
    <text x="145" y="135" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">训练阶段</text>
    <rect x="230" y="90" width="710" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="585" y="127" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">预训练 → SFT → RLHF / 对齐</text>
    <text x="585" y="149" text-anchor="middle" font-size="11.5" fill="#64748b">在海量文本上学语言规律，再教会模型按指令、按人类偏好回答</text>
  </g>
  <line x1="500" y1="168" x2="500" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- 阶段 2：通用 LLM 模型 -->
  <g>
    <rect x="60" y="184" width="170" height="78" rx="8" fill="#7c3aed"/>
    <text x="145" y="229" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">通用模型</text>
    <rect x="230" y="184" width="710" height="78" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="585" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#4c1d95">通用 LLM 模型</text>
    <text x="585" y="243" text-anchor="middle" font-size="11.5" fill="#64748b">基于 Transformer 的「预测下一个 Token」概率模型，能力的承载体</text>
  </g>
  <line x1="500" y1="262" x2="500" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- 阶段 3：模型优化 -->
  <g>
    <rect x="60" y="278" width="170" height="78" rx="8" fill="#059669"/>
    <text x="145" y="323" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">模型优化</text>
    <rect x="230" y="278" width="710" height="78" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="585" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#065f46">微调 / 量化 / 蒸馏</text>
    <text x="585" y="337" text-anchor="middle" font-size="11.5" fill="#64748b">让模型更适配特定场景，或更轻量、更快、更省地部署上线</text>
  </g>
  <line x1="500" y1="356" x2="500" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- 阶段 4：开发者驱动 -->
  <g>
    <rect x="60" y="372" width="170" height="78" rx="8" fill="#ea580c"/>
    <text x="145" y="417" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">开发者驱动</text>
    <rect x="230" y="372" width="710" height="78" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="585" y="409" text-anchor="middle" font-size="15" font-weight="600" fill="#9a3412">Prompt / System Prompt / CoT</text>
    <text x="585" y="431" text-anchor="middle" font-size="11.5" fill="#64748b">通过提示词驱动模型，决定输出质量，无需改动模型本身</text>
  </g>
  <line x1="500" y1="450" x2="500" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- 阶段 5：接入外部知识 -->
  <g>
    <rect x="60" y="466" width="170" height="78" rx="8" fill="#0891b2"/>
    <text x="145" y="511" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">外部知识</text>
    <rect x="230" y="466" width="710" height="78" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="585" y="503" text-anchor="middle" font-size="15" font-weight="600" fill="#155e75">Embedding + 向量数据库 → RAG</text>
    <text x="585" y="525" text-anchor="middle" font-size="11.5" fill="#64748b">先检索真实资料再生成，缓解幻觉，让模型用上训练之外的新知识</text>
  </g>
  <line x1="500" y1="544" x2="500" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- 阶段 6：自主执行 -->
  <g>
    <rect x="60" y="560" width="170" height="78" rx="8" fill="#dc2626"/>
    <text x="145" y="605" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">自主执行</text>
    <rect x="230" y="560" width="710" height="78" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="585" y="597" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">Function Calling / MCP → Agent</text>
    <text x="585" y="619" text-anchor="middle" font-size="11.5" fill="#64748b">让模型能调用工具、自主规划多步任务，从聊天机器人进化为数字员工</text>
  </g>

  <!-- 脚注 -->
  <text x="500" y="688" text-anchor="middle" font-size="11.5" fill="#6b7280">每个阶段解决一类核心问题：训练造模型 → 优化变轻量 → 驱动出质量 → 检索补知识 → 工具去执行</text>
  <text x="500" y="708" text-anchor="middle" font-size="11" fill="#94a3b8">初学者建议按从上到下的顺序逐层理解</text>
</svg>
