<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="32" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">AGENT LOOP · TOOL CALLING</text>

  <!-- ===== 生命周期线（先画） ===== -->
  <line x1="108" y1="120" x2="108" y2="496" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="368" y1="120" x2="368" y2="496" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="612" y1="120" x2="612" y2="496" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="856" y1="120" x2="856" y2="496" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== 激活条 ===== -->
  <rect x="364" y="168" width="8" height="280" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="608" y="208" width="8" height="40" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="608" y="368" width="8" height="40" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="852" y="288" width="8" height="40" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>

  <!-- ===== 消息箭头 ===== -->
  <line x1="108" y1="168" x2="364" y2="168" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="372" y1="208" x2="608" y2="208" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="608" y1="248" x2="372" y2="248" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="372" y1="288" x2="852" y2="288" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="852" y1="328" x2="372" y2="328" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="372" y1="368" x2="608" y2="368" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="608" y1="408" x2="372" y2="408" stroke="#b5523a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <line x1="364" y1="448" x2="108" y2="448" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ===== 消息标签（带遮罩） ===== -->
  <rect x="156" y="148" width="160" height="14" rx="2" fill="#faf7f2"/>
  <text x="236" y="159" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">提问：纽约多少度？</text>
  <rect x="398" y="188" width="184" height="14" rx="2" fill="#faf7f2"/>
  <text x="490" y="199" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">chat(messages + tools)</text>
  <rect x="392" y="228" width="196" height="14" rx="2" fill="#faf7f2"/>
  <text x="490" y="239" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">assistant + tool_calls</text>
  <rect x="648" y="268" width="172" height="14" rx="2" fill="#faf7f2"/>
  <text x="734" y="279" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">执行 get_weather(city)</text>
  <rect x="686" y="308" width="96" height="14" rx="2" fill="#faf7f2"/>
  <text x="734" y="319" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">返回 22°C</text>
  <rect x="394" y="348" width="192" height="14" rx="2" fill="#faf7f2"/>
  <text x="490" y="359" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">chat(追加工具结果)</text>
  <rect x="448" y="388" width="84" height="14" rx="2" fill="#faf7f2"/>
  <text x="490" y="399" fill="#b5523a" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">最终回答</text>
  <rect x="150" y="428" width="140" height="14" rx="2" fill="#faf7f2"/>
  <text x="220" y="439" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">纽约现在 22°C</text>

  <!-- ===== 参与者（画在生命线之上） ===== -->
  <rect x="32" y="72" width="152" height="48" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="108" y="101" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">用户</text>
  <rect x="292" y="72" width="152" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="368" y="101" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">你的程序</text>
  <rect x="536" y="72" width="152" height="48" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="612" y="101" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama</text>
  <rect x="780" y="72" width="152" height="48" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="856" y="101" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">本地工具函数</text>

  <!-- ===== Legend ===== -->
  <line x1="32" y1="512" x2="928" y2="512" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="528" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="32" y1="544" x2="60" y2="544" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="68" y="548" fill="#57534e" font-size="8.5">调用请求</text>
  <line x1="176" y1="544" x2="204" y2="544" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="212" y="548" fill="#57534e" font-size="8.5">返回结果</text>
  <line x1="320" y1="544" x2="348" y2="544" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="356" y="548" fill="#57534e" font-size="8.5">参与者生命线（循环直至不再返回 tool_calls）</text>
</svg>
