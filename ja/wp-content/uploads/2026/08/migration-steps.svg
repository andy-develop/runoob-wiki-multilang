<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">MIGRATION STEPS</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="316" y1="188" x2="364" y2="188" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="604" y1="188" x2="652" y2="188" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 箭头标签 ===== -->
  <rect x="308" y="168" width="64" height="14" rx="2" fill="#faf7f2"/>
  <text x="340" y="179" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">打包带走</text>
  <rect x="596" y="168" width="64" height="14" rx="2" fill="#faf7f2"/>
  <text x="628" y="179" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">指向新路径</text>

  <!-- ===== 步骤 1 ===== -->
  <rect x="36" y="112" width="280" height="152" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="44" y="120" width="24" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="56" y="129" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
  <text x="176" y="162" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">导出与备份</text>
  <text x="176" y="188" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">show --modelfile 存配方</text>
  <text x="176" y="210" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">models 目录整体打包</text>
  <text x="176" y="238" fill="#78716c" font-size="9" text-anchor="middle">配方进 Git，权重进移动盘</text>

  <!-- ===== 步骤 2 ===== -->
  <rect x="364" y="112" width="240" height="152" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="372" y="120" width="24" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
  <text x="384" y="129" fill="#b5523a" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
  <text x="484" y="162" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">迁移数据</text>
  <text x="484" y="188" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_MODELS 指向新位置</text>
  <text x="484" y="210" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Linux 记得 chown 属主</text>
  <text x="484" y="238" fill="#78716c" font-size="9" text-anchor="middle">两台机器版本保持一致</text>

  <!-- ===== 步骤 3 ===== -->
  <rect x="652" y="112" width="272" height="152" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="660" y="120" width="24" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="672" y="129" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
  <text x="788" y="162" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">验证</text>
  <text x="788" y="188" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">list 与旧机清单对比</text>
  <text x="788" y="210" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">run qwen3.5 实测对话</text>
  <text x="788" y="238" fill="#78716c" font-size="9" text-anchor="middle">ps 确认 GPU 状态正常</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="320" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">配方与权重分离存放，迁移就只是搬文件加改路径</text>
</svg>
