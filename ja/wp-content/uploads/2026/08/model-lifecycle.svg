<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">MODEL LIFECYCLE</text>

  <!-- ===== 转换弧线（先画） ===== -->
  <path d="M760,232 C760,168 424,168 424,232" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M760,232 C760,120 424,120 424,232" fill="none" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M424,296 C424,384 128,384 128,296" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="208" y1="264" x2="304" y2="264" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="544" y1="264" x2="640" y2="264" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 转换标签（带遮罩） ===== -->
  <rect x="216" y="246" width="80" height="14" rx="2" fill="#faf7f2"/>
  <text x="256" y="257" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ollama pull</text>
  <rect x="552" y="246" width="80" height="14" rx="2" fill="#faf7f2"/>
  <text x="592" y="257" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ollama run</text>
  <rect x="552" y="162" width="80" height="14" rx="2" fill="#faf7f2"/>
  <text x="592" y="173" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ollama stop</text>
  <rect x="500" y="106" width="184" height="14" rx="2" fill="#faf7f2"/>
  <text x="592" y="117" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">keep-alive 超时 · 默认 5 分钟</text>
  <rect x="238" y="376" width="76" height="14" rx="2" fill="#faf7f2"/>
  <text x="276" y="387" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ollama rm</text>

  <!-- ===== 状态：未下载 ===== -->
  <rect x="48" y="232" width="160" height="64" rx="20" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="128" y="262" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">未下载</text>
  <text x="128" y="280" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">list 中不可见</text>

  <!-- ===== 状态：已下载（磁盘） ===== -->
  <rect x="304" y="232" width="240" height="64" rx="6" fill="#faf7f2"/>
  <rect x="304" y="232" width="240" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <rect x="312" y="240" width="32" height="12" rx="2" fill="transparent" stroke="rgba(87,83,78,0.50)" stroke-width="0.8"/>
  <text x="328" y="249" fill="#57534e" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
  <text x="424" y="266" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">已下载</text>
  <text x="424" y="282" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">~/.ollama/models</text>

  <!-- ===== 状态：已加载（内存/显存，focal） ===== -->
  <rect x="640" y="232" width="240" height="64" rx="6" fill="#faf7f2"/>
  <rect x="640" y="232" width="240" height="64" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="648" y="240" width="60" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
  <text x="678" y="249" fill="#b5523a" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">RAM / VRAM</text>
  <text x="760" y="266" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">已加载</text>
  <text x="760" y="282" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">ollama ps 可见</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="760" y="344" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">驻留约 5 分钟，期间再次请求零加载延迟</text>

  <!-- ===== Legend ===== -->
  <line x1="36" y1="496" x2="924" y2="496" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="36" y="512" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="36" y="528" width="14" height="10" rx="2" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="56" y="536" fill="#57534e" font-size="8.5">磁盘状态</text>
  <rect x="156" y="528" width="14" height="10" rx="2" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="176" y="536" fill="#57534e" font-size="8.5">运行状态</text>
  <line x1="276" y1="532" x2="304" y2="532" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="312" y="536" fill="#57534e" font-size="8.5">手动执行的命令</text>
  <line x1="452" y1="532" x2="480" y2="532" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="488" y="536" fill="#57534e" font-size="8.5">自动发生的行为</text>
</svg>
