<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">CHAT APP ARCHITECTURE</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="236" y1="232" x2="340" y2="232" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="216" x2="700" y2="152" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="272" x2="700" y2="344" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 箭头标签 ===== -->
  <rect x="240" y="212" width="96" height="14" rx="2" fill="#faf7f2"/>
  <text x="288" y="223" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">POST /chat</text>
  <rect x="596" y="164" width="80" height="14" rx="2" fill="#faf7f2"/>
  <text x="636" y="175" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">流式调用</text>
  <rect x="596" y="316" width="80" height="14" rx="2" fill="#faf7f2"/>
  <text x="636" y="327" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">读写历史</text>

  <!-- ===== 浏览器 ===== -->
  <rect x="36" y="188" width="200" height="88" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <rect x="44" y="196" width="40" height="12" rx="2" fill="transparent" stroke="rgba(120,113,108,0.40)" stroke-width="0.8"/>
  <text x="64" y="205" fill="#78716c" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="136" y="228" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">浏览器对话界面</text>
  <text x="136" y="248" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">fetch 流式渲染</text>

  <!-- ===== 后端服务（focal） ===== -->
  <rect x="340" y="176" width="260" height="120" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="470" y="208" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">后端服务（Python / Node）</text>
  <text x="470" y="232" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">会话管理 · 组装 messages 历史</text>
  <text x="470" y="252" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">调用 Ollama · NDJSON 转发</text>
  <text x="470" y="272" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">历史持久化入口</text>

  <!-- ===== Ollama 服务 ===== -->
  <rect x="700" y="112" width="224" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="812" y="144" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama 服务</text>
  <text x="812" y="164" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">localhost:11434 · qwen3.5</text>

  <!-- ===== 会话存储 ===== -->
  <rect x="700" y="304" width="224" height="80" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="812" y="336" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">会话存储</text>
  <text x="812" y="356" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">内存字典 / SQLite / 数据库</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="440" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">历史由你的服务管理，这正是模型拥有长期记忆的原理</text>
</svg>
