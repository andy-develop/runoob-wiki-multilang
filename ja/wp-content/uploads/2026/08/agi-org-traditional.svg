  <line x1="360" y1="42" x2="360" y2="58" stroke="#c6cdbb" stroke-width="1.5"/>
  <line x1="90" y1="58" x2="630" y2="58" stroke="#c6cdbb" stroke-width="1.5"/>
  <g stroke="#c6cdbb" stroke-width="1.5">
    <line x1="90" y1="58" x2="90" y2="70"/>
    <line x1="180" y1="58" x2="180" y2="70"/>
    <line x1="270" y1="58" x2="270" y2="70"/>
    <line x1="360" y1="58" x2="360" y2="70"/>
    <line x1="450" y1="58" x2="450" y2="70"/>
    <line x1="540" y1="58" x2="540" y2="70"/>
    <line x1="630" y1="58" x2="630" y2="70"/>
  </g>

  <g fill="#fbfcf9" stroke="#c6cdbb" stroke-width="1">
    <rect x="52" y="70" width="76" height="30" rx="6"/>
    <rect x="142" y="70" width="76" height="30" rx="6"/>
    <rect x="232" y="70" width="76" height="30" rx="6"/>
    <rect x="322" y="70" width="76" height="30" rx="6"/>
    <rect x="412" y="70" width="76" height="30" rx="6"/>
    <rect x="502" y="70" width="76" height="30" rx="6"/>
    <rect x="592" y="70" width="76" height="30" rx="6"/>
  </g>
  <g fill="#1e271f" font-size="12.5" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="90" y="89">产品</text>
    <text x="180" y="89">技术</text>
    <text x="270" y="89">设计</text>
    <text x="360" y="89">市场</text>
    <text x="450" y="89">销售</text>
