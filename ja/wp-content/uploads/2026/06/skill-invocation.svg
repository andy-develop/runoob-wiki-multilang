<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Skill 调用机制</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">显式调用与隐式匹配两种触发方式的完整流程对比</text>
  <rect x="50" y="80" width="400" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="250" y="104" text-anchor="middle" font-size="15" font-weight="600" fill="#2563eb">方式一：显式调用</text>
  <rect x="510" y="80" width="400" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="710" y="104" text-anchor="middle" font-size="15" font-weight="600" fill="#16a34a">方式二：隐式匹配</text>
  <rect x="70" y="136" width="360" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">用户显式引用技能</text>
  <text x="250" y="184" text-anchor="middle" font-size="12" fill="#6b7280">/skills 或 $skill-name</text>
  <line x1="250" y1="198" x2="250" y2="218" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="70" y="218" width="360" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Codex 检测到显式引用</text>
  <text x="250" y="266" text-anchor="middle" font-size="12" fill="#6b7280">跳过匹配，直接定位目标技能</text>
  <line x1="250" y1="280" x2="250" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="70" y="300" width="360" height="62" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">加载完整 SKILL.md 并执行</text>
  <text x="250" y="348" text-anchor="middle" font-size="12" fill="#6b7280">按技能指令逐步完成任务</text>
  <rect x="530" y="136" width="360" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">用户发出自然语言任务</text>
  <text x="710" y="184" text-anchor="middle" font-size="12" fill="#6b7280">任务与技能 description 匹配</text>
  <line x1="710" y1="198" x2="710" y2="218" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="530" y="218" width="360" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Codex 扫描初始技能列表</text>
  <text x="710" y="266" text-anchor="middle" font-size="12" fill="#6b7280">在上下文窗口约 2% 预算内匹配</text>
  <line x1="710" y1="280" x2="710" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="530" y="300" width="360" height="62" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">匹配成功，加载 SKILL.md</text>
  <text x="710" y="348" text-anchor="middle" font-size="12" fill="#6b7280">未匹配则使用通用能力处理</text>
  <circle cx="78" cy="156" r="12" fill="#2563eb"/>
  <text x="78" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <circle cx="78" cy="238" r="12" fill="#2563eb"/>
  <text x="78" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <circle cx="78" cy="320" r="12" fill="#2563eb"/>
  <text x="78" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <circle cx="538" cy="156" r="12" fill="#16a34a"/>
  <text x="538" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <circle cx="538" cy="238" r="12" fill="#16a34a"/>
  <text x="538" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <circle cx="538" cy="320" r="12" fill="#16a34a"/>
  <text x="538" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <line x1="250" y1="362" x2="250" y2="397" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="710" y1="362" x2="710" y2="397" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="130" y="407" width="700" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="435" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">无论哪种方式，Codex 最终都会加载完整的 SKILL.md 文件并执行技能指令</text>
  <line x1="250" y1="397" x2="250" y2="407" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="710" y1="397" x2="710" y2="407" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="130" y="473" width="700" height="36" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="480" y="496" text-anchor="middle" font-size="12" fill="#92400e">关键区别：显式调用无需匹配判断；隐式匹配依赖 description 字段的编写质量</text>
</svg>