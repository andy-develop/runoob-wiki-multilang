<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
  <!-- 背景和整体样式 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="12"/>

  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">AI Agent 基本架构</text>

  <!-- 中心大脑模块 -->
  <g filter="url(#shadow)">
    <rect x="300" y="180" width="200" height="120" fill="url(#brainGrad)" rx="12"/>
    <text x="400" y="235" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="white">大脑</text>
    <text x="400" y="260" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="white">LLM 推理核心</text>
    <text x="400" y="280" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">理解、推理、决策</text>
  </g>

  <!-- 工具模块（右侧） -->
  <g filter="url(#shadow)">
    <rect x="550" y="180" width="180" height="120" fill="url(#toolGrad)" rx="12"/>
    <text x="640" y="225" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="white">工具</text>
    <text x="640" y="250" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="white">Tools / Function Calling</text>
    <text x="640" y="270" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">搜索、计算、API...</text>
  </g>

  <!-- 记忆模块（左侧） -->
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="180" height="120" fill="url(#memoryGrad)" rx="12"/>
    <text x="160" y="225" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="white">记忆</text>
    <text x="160" y="250" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="white">Memory</text>
    <text x="160" y="270" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">短期、长期、摘要</text>
  </g>

  <!-- 规划模块（下方） -->
  <g filter="url(#shadow)">
    <rect x="300" y="360" width="200" height="100" fill="url(#planGrad)" rx="12"/>
    <text x="400" y="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="white">规划</text>
    <text x="400" y="425" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="white">Planning</text>
    <text x="400" y="445" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">任务分解、步骤编排</text>
  </g>

  <!-- 连接线：记忆 → 大脑 -->
  <line x1="250" y1="240" x2="300" y2="240" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="295,235 300,240 295,245" fill="#94a3b8"/>

  <!-- 连接线：大脑 → 工具 -->
  <line x1="500" y1="240" x2="550" y2="240" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="545,235 550,240 545,245" fill="#94a3b8"/>

  <!-- 连接线：大脑 → 规划（双向） -->
  <line x1="400" y1="300" x2="400" y2="360" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="395,355 400,360 405,355" fill="#94a3b8"/>
  <polygon points="405,305 400,300 395,305" fill="#94a3b8"/>

  <!-- 用户输入（上方） -->
  <g>
    <rect x="250" y="80" width="300" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
    <text x="400" y="110" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">用户输入 / 任务</text>
    <text x="400" y="130" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">"帮我订明天去北京的机票"</text>
  </g>

  <!-- 输入箭头 -->
  <line x1="400" y1="140" x2="400" y2="180" stroke="#64748b" stroke-width="3"/>
  <polygon points="395,175 400,180 405,175" fill="#64748b"/>

  <!-- 输出（底部） -->
  <g>
    <rect x="250" y="100" width="10" height="10" fill="transparent"/>
  </g>

  <!-- 图标装饰 -->
  <!-- 大脑图标 -->
  <g transform="translate(350, 195)">
    <circle cx="25" cy="25" r="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <circle cx="25" cy="25" r="12" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <circle cx="25" cy="25" r="5" fill="rgba(255,255,255,0.6)"/>
  </g>

  <!-- 工具图标（扳手） -->
  <g transform="translate(570, 195)">
    <rect x="5" y="20" width="40" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="0" y="15" width="12" height="18" rx="6" fill="rgba(255,255,255,0.5)"/>
    <circle cx="38" cy="24" r="8" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- 记忆图标（数据库） -->
  <g transform="translate(90, 195)">
    <rect x="5" y="10" width="40" height="30" rx="4" fill="rgba(255,255,255,0.4)"/>
    <line x1="10" y1="20" x2="40" y2="20" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <line x1="10" y1="30" x2="40" y2="30" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  </g>

  <!-- 规划图标（流程图） -->
  <g transform="translate(345, 375)">
    <rect x="5" y="5" width="15" height="15" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="30" y="5" width="15" height="15" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="17" y="28" width="15" height="15" rx="3" fill="rgba(255,255,255,0.4)"/>
    <line x1="20" y1="12" x2="30" y2="12" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <polygon points="28,9 30,12 28,15" fill="rgba(255,255,255,0.6)"/>
    <line x1="38" y1="20" x2="25" y2="28" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <polygon points="26,26 25,28 28,29" fill="rgba(255,255,255,0.6)"/>
  </g>
</svg>
