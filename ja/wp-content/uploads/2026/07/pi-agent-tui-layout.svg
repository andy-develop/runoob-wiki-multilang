<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- terminal frame -->
  <rect x="64" y="48" width="552" height="336" rx="8" fill="#f2ede4" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <circle cx="88" cy="68" r="4" fill="rgba(28,25,23,0.20)"/>
  <circle cx="104" cy="68" r="4" fill="rgba(28,25,23,0.20)"/>
  <circle cx="120" cy="68" r="4" fill="rgba(28,25,23,0.20)"/>
  <text x="592" y="72" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">pi</text>

  <!-- region 1: startup header -->
  <rect x="80" y="88" width="520" height="48" rx="6" fill="#ffffff" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <text x="96" y="108" fill="#1c1917" font-size="12" font-weight="600">启动头部</text>
  <text x="96" y="124" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">context files · prompts · skills · extensions</text>

  <!-- region 2: message area -->
  <rect x="80" y="144" width="520" height="136" rx="6" fill="#ffffff" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <text x="96" y="164" fill="#1c1917" font-size="12" font-weight="600">消息区域</text>
  <text x="96" y="188" fill="#57534e" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">&#8250; 你: 总结这个项目的结构和主要功能</text>
  <text x="96" y="212" fill="#57534e" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">&#8226; read src/app.ts</text>
  <text x="96" y="236" fill="#57534e" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">&#8226; read package.json</text>
  <text x="96" y="260" fill="#57534e" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">AI: 这是一个 React + Vite 项目，入口为 src/app.ts ...</text>

  <!-- region 3: editor (focal) -->
  <rect x="80" y="288" width="520" height="48" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <text x="96" y="308" fill="#1c1917" font-size="12" font-weight="600">编辑区</text>
  <text x="96" y="324" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">&gt; 在这里输入消息，回车发送</text>

  <!-- region 4: status bar -->
  <rect x="80" y="344" width="520" height="24" rx="4" fill="rgba(28,25,23,0.05)" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <text x="96" y="360" fill="#57534e" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">~/projects/runoob-demo · claude-sonnet-5 · tokens 12.4k · cost $0.04</text>

  <!-- connectors + right annotations -->
  <line x1="616" y1="112" x2="648" y2="112" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <line x1="616" y1="212" x2="648" y2="212" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <line x1="616" y1="312" x2="648" y2="312" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <line x1="616" y1="356" x2="648" y2="356" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>

  <text x="660" y="104" fill="#1c1917" font-size="12" font-weight="600">加载状态一览</text>
  <text x="660" y="120" fill="#78716c" font-size="9">启动时展示，可 quietStartup 隐藏</text>

  <text x="660" y="204" fill="#1c1917" font-size="12" font-weight="600">对话与工具调用</text>
  <text x="660" y="220" fill="#78716c" font-size="9">Ctrl+O 展开工具输出详情</text>

  <text x="660" y="304" fill="#1c1917" font-size="12" font-weight="600">你的输入位置</text>
  <text x="660" y="320" fill="#78716c" font-size="9">边框颜色随推理等级变化</text>

  <text x="660" y="348" fill="#1c1917" font-size="12" font-weight="600">用量与费用</text>
  <text x="660" y="364" fill="#78716c" font-size="9">token、上下文占用与费用实时更新</text>
</svg>
