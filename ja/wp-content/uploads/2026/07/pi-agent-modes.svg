<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- column eyebrows -->
  <text x="208" y="40" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.18em" text-anchor="middle">INPUT</text>
  <text x="440" y="40" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.18em" text-anchor="middle">MODE</text>
  <text x="672" y="40" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.18em" text-anchor="middle">OUTPUT</text>

  <!-- row 1: interactive -->
  <line x1="240" y1="88" x2="312" y2="88" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="568" y1="88" x2="640" y2="88" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="320" y="64" width="240" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="84" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">交互模式（默认）</text>
  <text x="440" y="102" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">$ pi</text>
  <text x="228" y="80" fill="#57534e" font-size="9" text-anchor="end">键盘输入</text>
  <text x="228" y="96" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">stdin</text>
  <text x="652" y="80" fill="#57534e" font-size="9">TUI 实时渲染</text>
  <text x="652" y="96" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace">terminal ui</text>

  <!-- row 2: print (focal) -->
  <line x1="240" y1="168" x2="312" y2="168" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="568" y1="168" x2="640" y2="168" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="320" y="144" width="240" height="48" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <text x="440" y="164" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Print 模式</text>
  <text x="440" y="182" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">$ pi -p "..."</text>
  <text x="228" y="160" fill="#57534e" font-size="9" text-anchor="end">参数 / 管道</text>
  <text x="228" y="176" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">argv · stdin</text>
  <text x="652" y="160" fill="#57534e" font-size="9">单次文本输出</text>
  <text x="652" y="176" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace">stdout</text>

  <!-- row 3: json -->
  <line x1="240" y1="248" x2="312" y2="248" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="568" y1="248" x2="640" y2="248" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="320" y="224" width="240" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="244" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">JSON 模式</text>
  <text x="440" y="262" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">$ pi --mode json</text>
  <text x="228" y="240" fill="#57534e" font-size="9" text-anchor="end">参数 / 管道</text>
  <text x="228" y="256" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">argv · stdin</text>
  <text x="652" y="240" fill="#57534e" font-size="9">结构化事件流</text>
  <text x="652" y="256" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace">jsonl events</text>

  <!-- row 4: rpc -->
  <line x1="240" y1="328" x2="312" y2="328" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="568" y1="328" x2="640" y2="328" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="320" y="304" width="240" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="324" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">RPC 模式</text>
  <text x="440" y="342" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">$ pi --mode rpc</text>
  <text x="228" y="320" fill="#57534e" font-size="9" text-anchor="end">双向 JSON 消息</text>
  <text x="228" y="336" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">stdin/stdout</text>
  <text x="652" y="320" fill="#57534e" font-size="9">双向 JSON 消息</text>
  <text x="652" y="336" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace">request/response</text>

  <!-- legend -->
  <line x1="32" y1="368" x2="848" y2="368" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="384" fill="#57534e" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="112" y="376" width="20" height="14" rx="3" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="140" y="387" fill="#57534e" font-size="9">脚本与 CI 集成首选</text>
</svg>
