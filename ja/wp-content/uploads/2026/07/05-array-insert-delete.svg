<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "SF Mono","Fira Code","Cascadia Code","Courier New","Microsoft YaHei","SimHei",monospace; }
  </style>
  <rect width="850" height="500" fill="url(#bg)"/>

  <text x="425" y="25" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">数组插入与删除操作流程</text>

  <!-- ===== INSERT ===== -->
  <rect x="20" y="42" width="810" height="210" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="425" y="67" text-anchor="middle" fill="#f97316" font-size="13" font-weight="bold">插入操作 — 在索引 2 的位置插入 25</text>

  <!-- Step 1 -->
  <text x="60" y="92" fill="#94a3b8" font-size="11">原始数组</text>
  <rect x="55" y="102" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="79" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">10</text>
  <rect x="110" y="102" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1"/>
  <text x="134" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">20</text>
  <rect x="165" y="102" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="189" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">30</text>
  <rect x="220" y="102" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#ea580c" stroke-width="1"/>
  <text x="244" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">40</text>
  <rect x="275" y="102" width="48" height="36" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="380" y="125" text-anchor="middle" fill="#475569" font-size="22">→</text>
  <text x="460" y="92" fill="#94a3b8" font-size="11">元素后移（从后向前，倒序遍历）</text>
  <rect x="440" y="102" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="464" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">10</text>
  <rect x="495" y="102" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1"/>
  <text x="519" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">20</text>
  <rect x="550" y="102" width="48" height="36" rx="4" fill="#1c1917" stroke="#eab308" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="574" y="126" text-anchor="middle" fill="#eab308" font-size="10">空</text>
  <rect x="605" y="102" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="629" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">30</text>
  <rect x="660" y="102" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#ea580c" stroke-width="1"/>
  <text x="684" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">40</text>
  <text x="380" y="177" text-anchor="middle" fill="#475569" font-size="22">→</text>
  <text x="460" y="160" fill="#94a3b8" font-size="11">写入新元素 25</text>
  <rect x="440" y="170" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="464" y="194" text-anchor="middle" fill="#e2e8f0" font-size="12">10</text>
  <rect x="495" y="170" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1"/>
  <text x="519" y="194" text-anchor="middle" fill="#e2e8f0" font-size="12">20</text>
  <rect x="550" y="170" width="48" height="36" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text x="574" y="194" text-anchor="middle" fill="#e2e8f0" font-size="12">25</text>
  <rect x="605" y="170" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="629" y="194" text-anchor="middle" fill="#e2e8f0" font-size="12">30</text>
  <rect x="660" y="170" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#ea580c" stroke-width="1"/>
  <text x="684" y="194" text-anchor="middle" fill="#e2e8f0" font-size="12">40</text>
  <text x="425" y="244" text-anchor="middle" fill="#94a3b8" font-size="10">重点：从后向前移动，避免覆盖尚未处理的元素</text>

  <!-- ===== DELETE ===== -->
  <rect x="20" y="265" width="810" height="210" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="425" y="290" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">删除操作 — 删除索引 2 的元素 30</text>

  <text x="60" y="317" fill="#94a3b8" font-size="11">原始数组</text>
  <rect x="55" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="79" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">10</text>
  <rect x="110" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1"/>
  <text x="134" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">20</text>
  <rect x="165" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#ef4444" stroke-width="2"/>
  <text x="189" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">30</text>
  <rect x="220" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#ea580c" stroke-width="1"/>
  <text x="244" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">40</text>
  <rect x="275" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="299" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">50</text>
  <text x="380" y="350" text-anchor="middle" fill="#475569" font-size="22">→</text>
  <text x="460" y="317" fill="#94a3b8" font-size="11">元素前移（从前向后，正序遍历）填补空位</text>
  <rect x="440" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="464" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">10</text>
  <rect x="495" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1"/>
  <text x="519" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">20</text>
  <rect x="550" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#ea580c" stroke-width="1"/>
  <text x="574" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">40</text>
  <rect x="605" y="327" width="48" height="36" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="629" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">50</text>
  <rect x="660" y="327" width="48" height="36" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="425" y="405" text-anchor="middle" fill="#94a3b8" font-size="10">重点：从前向后移动，保持剩余元素的相对顺序不变</text>

  <rect x="200" y="425" width="450" height="36" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="425" y="448" text-anchor="middle" fill="#eab308" font-size="11">插入与删除平均复杂度：O(n)   |   尾部插入/删除：O(1)</text>

</svg>