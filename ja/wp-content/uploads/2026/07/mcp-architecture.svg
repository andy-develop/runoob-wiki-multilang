<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrowData" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowReturn" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="hostGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">MCP 架构：Host / Client / Server 三层模型</text>
  <rect x="50" y="60" width="900" height="140" rx="10" fill="url(#hostGrad)" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="870" y="72" width="64" height="22" rx="11" fill="#2563eb"/>
  <text x="902" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Host</text>
  <text x="70" y="88" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">AI 应用层</text>
  <text x="70" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">负责协调多个 Client、管理对话，用户直接使用的 AI 助手</text>
  <rect x="70" y="122" width="196" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="88" cy="152" r="5" fill="#2563eb" opacity="0.7"/>
  <text x="168" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Claude Code</text>
  <rect x="292" y="122" width="196" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="310" cy="152" r="5" fill="#2563eb" opacity="0.7"/>
  <text x="390" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Claude Desktop</text>
  <rect x="514" y="122" width="196" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="532" cy="152" r="5" fill="#7c3aed" opacity="0.7"/>
  <text x="612" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Cursor</text>
  <rect x="736" y="122" width="196" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="754" cy="152" r="5" fill="#059669" opacity="0.7"/>
  <text x="834" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">ChatGPT</text>
  <rect x="50" y="225" width="900" height="105" rx="10" fill="url(#clientGrad)" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="860" y="237" width="74" height="22" rx="11" fill="#7c3aed"/>
  <text x="897" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Client</text>
  <text x="70" y="253" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">协议适配层</text>
  <text x="70" y="273" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">每个 Server 对应一个 Client，将工具调用翻译为标准 JSON-RPC 2.0 消息</text>
  <rect x="70" y="284" width="196" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="168" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5b21b6">Client 1</text>
  <rect x="292" y="284" width="196" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="390" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5b21b6">Client 2</text>
  <rect x="514" y="284" width="196" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="612" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5b21b6">Client 3</text>
  <rect x="736" y="284" width="196" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="834" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5b21b6">Client 4</text>
  <line x1="168" y1="182" x2="168" y2="284" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrowDown)" stroke-dasharray="4,3"/>
  <line x1="390" y1="182" x2="390" y2="284" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrowDown)" stroke-dasharray="4,3"/>
  <line x1="612" y1="182" x2="612" y2="284" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrowDown)" stroke-dasharray="4,3"/>
  <line x1="834" y1="182" x2="834" y2="284" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrowDown)" stroke-dasharray="4,3"/>
  <rect x="50" y="350" width="900" height="145" rx="10" fill="url(#serverGrad)" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="856" y="362" width="78" height="22" rx="11" fill="#059669"/>
  <text x="895" y="377" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Server</text>
  <text x="70" y="378" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#065f46">工具 / 数据服务层</text>
  <text x="70" y="398" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">暴露具体工具或数据源能力，不直接与模型对话，所有交互经 Client 转发</text>
  <rect x="70" y="415" width="196" height="62" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="88" cy="446" r="5" fill="#059669" opacity="0.7"/>
  <text x="168" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065f46">GitHub Server</text>
  <text x="168" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">代码仓库操作</text>
  <rect x="292" y="415" width="196" height="62" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="310" cy="446" r="5" fill="#059669" opacity="0.7"/>
  <text x="390" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065f46">Database Server</text>
  <text x="390" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">数据库查询</text>
  <rect x="514" y="415" width="196" height="62" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="532" cy="446" r="5" fill="#059669" opacity="0.7"/>
  <text x="612" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065f46">File System</text>
  <text x="612" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">文件系统访问</text>
  <rect x="736" y="415" width="196" height="62" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="754" cy="446" r="5" fill="#059669" opacity="0.7"/>
  <text x="834" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065f46">Custom Server</text>
  <text x="834" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">自定义工具</text>
  <line x1="168" y1="316" x2="168" y2="415" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowData)"/>
  <line x1="390" y1="316" x2="390" y2="415" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowData)"/>
  <line x1="612" y1="316" x2="612" y2="415" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowData)"/>
  <line x1="834" y1="316" x2="834" y2="415" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowData)"/>
  <line x1="183" y1="415" x2="183" y2="316" stroke="#059669" stroke-width="1.2" marker-end="url(#arrowReturn)" stroke-dasharray="4,3"/>
  <line x1="405" y1="415" x2="405" y2="316" stroke="#059669" stroke-width="1.2" marker-end="url(#arrowReturn)" stroke-dasharray="4,3"/>
  <line x1="627" y1="415" x2="627" y2="316" stroke="#059669" stroke-width="1.2" marker-end="url(#arrowReturn)" stroke-dasharray="4,3"/>
  <line x1="849" y1="415" x2="849" y2="316" stroke="#059669" stroke-width="1.2" marker-end="url(#arrowReturn)" stroke-dasharray="4,3"/>
  <rect x="50" y="510" width="900" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="538" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">图例</text>
  <line x1="70" y1="560" x2="110" y2="560" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDown)"/>
  <text x="122" y="565" font-family="system-ui, sans-serif" font-size="12" fill="#475569">管理流：Host 以子进程方式启动和管理 Client</text>
  <line x1="70" y1="585" x2="110" y2="585" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowData)"/>
  <text x="122" y="590" font-family="system-ui, sans-serif" font-size="12" fill="#475569">请求流：Client 将工具调用请求（JSON-RPC 2.0）转发给 Server</text>
  <line x1="420" y1="560" x2="460" y2="560" stroke="#059669" stroke-width="1.2" marker-end="url(#arrowReturn)" stroke-dasharray="4,3"/>
  <text x="472" y="565" font-family="system-ui, sans-serif" font-size="12" fill="#475569">响应流：Server 返回执行结果给 Client</text>
  <rect x="420" y="578" width="26" height="16" rx="3" fill="url(#hostGrad)" stroke="#93c5fd" stroke-width="1"/>
  <text x="456" y="591" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Host 层（蓝色系）</text>
  <rect x="590" y="578" width="26" height="16" rx="3" fill="url(#clientGrad)" stroke="#c4b5fd" stroke-width="1"/>
  <text x="626" y="591" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Client 层（紫色系）</text>
  <rect x="760" y="578" width="26" height="16" rx="3" fill="url(#serverGrad)" stroke="#6ee7b7" stroke-width="1"/>
  <text x="796" y="591" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Server 层（绿色系）</text>
</svg>