<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- arrows first (behind boxes) -->
  <line x1="144" y1="192" x2="188" y2="192" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="288" y1="192" x2="332" y2="192" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="432" y1="192" x2="476" y2="192" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="576" y1="192" x2="620" y2="192" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M384 172 C384 88, 384 88, 396 88" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="496" y1="88" x2="540" y2="88" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M528 212 C528 296, 528 296, 556 296" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- fork edge labels (masked) -->
  <rect x="340" y="116" width="44" height="14" rx="2" fill="#faf7f2"/>
  <text x="362" y="127" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">/fork</text>
  <rect x="508" y="240" width="44" height="14" rx="2" fill="#faf7f2"/>
  <text x="530" y="251" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">/fork</text>

  <!-- main session nodes -->
  <rect x="48" y="172" width="96" height="40" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="96" y="196" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">会话开始</text>

  <rect x="192" y="172" width="96" height="40" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="240" y="196" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">消息 2</text>

  <!-- fork point 1 (focal) -->
  <rect x="336" y="172" width="96" height="40" rx="6" fill="#ffffff" stroke="#b5523a" stroke-width="1.2"/>
  <text x="384" y="196" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">消息 3</text>

  <!-- fork point 2 (focal) -->
  <rect x="480" y="172" width="96" height="40" rx="6" fill="#ffffff" stroke="#b5523a" stroke-width="1.2"/>
  <text x="528" y="196" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">消息 4</text>

  <rect x="624" y="172" width="96" height="40" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="672" y="196" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">消息 5</text>

  <!-- branch A nodes -->
  <rect x="400" y="68" width="96" height="40" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="448" y="92" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">方案 A-1</text>
  <rect x="544" y="68" width="96" height="40" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="592" y="92" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">方案 A-2</text>

  <!-- branch B node -->
  <rect x="560" y="276" width="96" height="40" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="608" y="300" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">方案 B-1</text>

  <!-- editorial aside -->
  <text x="856" y="92" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif','Songti SC',serif" text-anchor="end">分支互不影响，可随时切换</text>

  <!-- legend -->
  <line x1="32" y1="332" x2="848" y2="332" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="348" fill="#57534e" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="112" y="340" width="20" height="14" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="140" y="351" fill="#57534e" font-size="9" text-anchor="start">主会话</text>
  <rect x="212" y="340" width="20" height="14" rx="3" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="240" y="351" fill="#57534e" font-size="9" text-anchor="start">分支会话</text>
  <rect x="324" y="340" width="20" height="14" rx="3" fill="#ffffff" stroke="#b5523a" stroke-width="1.2"/>
  <text x="352" y="351" fill="#57534e" font-size="9" text-anchor="start">分叉点（/fork 的起点）</text>
</svg>
