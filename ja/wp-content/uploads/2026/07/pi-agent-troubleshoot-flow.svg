<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- arrows first -->
  <line x1="440" y1="96" x2="440" y2="124" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="192" x2="440" y2="236" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="304" x2="440" y2="348" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="416" x2="440" y2="444" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="540" y1="160" x2="628" y2="160" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="540" y1="272" x2="628" y2="272" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="540" y1="384" x2="628" y2="384" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- yes/no labels (masked) -->
  <rect x="448" y="204" width="28" height="16" rx="2" fill="#faf7f2"/>
  <text x="462" y="216" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">否</text>
  <rect x="448" y="316" width="28" height="16" rx="2" fill="#faf7f2"/>
  <text x="462" y="328" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">否</text>
  <rect x="448" y="424" width="28" height="16" rx="2" fill="#faf7f2"/>
  <text x="462" y="436" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">否</text>
  <rect x="572" y="144" width="28" height="16" rx="2" fill="#faf7f2"/>
  <text x="586" y="156" fill="#b5523a" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">是</text>
  <rect x="572" y="256" width="28" height="16" rx="2" fill="#faf7f2"/>
  <text x="586" y="268" fill="#b5523a" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">是</text>
  <rect x="572" y="368" width="28" height="16" rx="2" fill="#faf7f2"/>
  <text x="586" y="380" fill="#b5523a" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">是</text>

  <!-- start (focal) -->
  <rect x="340" y="48" width="200" height="48" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <text x="440" y="68" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">pi 启动或使用异常</text>
  <text x="440" y="86" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">start here</text>

  <!-- decision 1 -->
  <polygon points="440,128 540,160 440,192 340,160" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="156" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">命令找不到？</text>
  <text x="440" y="172" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">command not found</text>

  <!-- decision 2 -->
  <polygon points="440,240 540,272 440,304 340,272" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="268" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">认证或模型报错？</text>
  <text x="440" y="284" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">401 / provider error</text>

  <!-- decision 3 -->
  <polygon points="440,352 540,384 440,416 340,384" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="380" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">界面乱码或卡顿？</text>
  <text x="440" y="396" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">rendering issues</text>

  <!-- actions right column -->
  <rect x="632" y="136" width="192" height="48" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="728" y="156" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">检查 PATH 与全局目录</text>
  <text x="728" y="174" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">npm prefix -g</text>

  <rect x="632" y="248" width="192" height="48" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="728" y="268" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">按优先级检查凭证</text>
  <text x="728" y="286" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">auth.json → 环境变量</text>

  <rect x="632" y="360" width="192" height="48" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="728" y="380" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">检查终端色彩支持</text>
  <text x="728" y="398" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">echo $COLORTERM</text>

  <!-- fallback -->
  <rect x="340" y="448" width="200" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="440" y="468" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">查看会话日志定位</text>
  <text x="440" y="486" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">~/.pi/agent/sessions/</text>

  <!-- legend -->
  <line x1="32" y1="512" x2="848" y2="512" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="528" fill="#57534e" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">LEGEND</text>
  <polygon points="150,524 168,530 150,536 132,530" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="178" y="533" fill="#57534e" font-size="9">判断节点</text>
  <rect x="260" y="522" width="20" height="14" rx="3" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="288" y="533" fill="#57534e" font-size="9">处理动作</text>
</svg>
