<svg viewBox="0 0 780 660" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
  <defs>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrLg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="780" height="660" fill="#fafbfc"/>

  <text x="390" y="26" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 的 Agent 循环</text>
  <text x="390" y="44" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">一次提问会触发一个 agent_start，内部可能循环多轮工具调用</text>

  <rect x="180" y="56" width="280" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="80" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#334155">用户输入 prompt</text>
  <line x1="320" y1="96" x2="320" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>

  <rect x="180" y="114" width="280" height="40" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="138" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6d28d9">before_agent_start</text>
  <text x="470" y="138" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">扩展可在此注入消息</text>
  <text x="470" y="152" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">或改写系统提示</text>
  <line x1="320" y1="154" x2="320" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>

  <rect x="180" y="172" width="280" height="40" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="196" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6d28d9">agent_start</text>
  <line x1="320" y1="212" x2="320" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>

  <rect x="70" y="230" width="640" height="290" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="390" y="248" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#64748b">turn 循环：LLM 每轮可调用工具，循环到不再调用为止</text>

  <rect x="180" y="260" width="280" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="284" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#1e40af">构建上下文 context</text>
  <text x="470" y="278" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">系统提示 + AGENTS.md</text>
  <text x="470" y="292" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">+ 历史 + 工具列表</text>
  <line x1="320" y1="300" x2="320" y2="316" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>

  <rect x="180" y="318" width="280" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="342" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#1e40af">调用 LLM provider</text>
  <line x1="320" y1="358" x2="320" y2="374" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>

  <rect x="180" y="376" width="280" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="400" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#1e40af">LLM 返回：文本 + 可能的工具调用</text>
  <line x1="320" y1="416" x2="320" y2="432" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>

  <polygon points="320,434 386,468 320,502 254,468" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="320" y="472" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#854d0e">调用工具?</text>

  <line x1="386" y1="468" x2="506" y2="468" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>
  <text x="446" y="460" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">是</text>

  <rect x="510" y="446" width="160" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="590" y="464" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#047857">执行工具</text>
  <text x="590" y="480" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#475569">read / bash / edit ...</text>

  <path d="M 590 446 L 590 280 L 462 280" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrLg)"/>
  <text x="600" y="365" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#047857">工具结果</text>
  <text x="600" y="380" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#047857">加入上下文</text>
  <text x="600" y="395" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#047857">回到构建上下文</text>

  <line x1="320" y1="502" x2="320" y2="540" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>
  <text x="332" y="524" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">否</text>

  <rect x="180" y="542" width="280" height="40" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="566" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6d28d9">turn_end → agent_end → agent_settled</text>
  <line x1="320" y1="582" x2="320" y2="598" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>

  <rect x="180" y="600" width="280" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="624" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#334155">返回最终回复给用户</text>
</svg>
