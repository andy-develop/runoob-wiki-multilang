<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- arrows first -->
  <line x1="440" y1="104" x2="440" y2="140" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="200" x2="440" y2="236" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="296" x2="440" y2="332" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- miss labels (masked) -->
  <rect x="452" y="112" width="76" height="16" rx="2" fill="#faf7f2"/>
  <text x="490" y="124" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">未命中</text>
  <rect x="452" y="208" width="76" height="16" rx="2" fill="#faf7f2"/>
  <text x="490" y="220" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">未命中</text>
  <rect x="452" y="304" width="76" height="16" rx="2" fill="#faf7f2"/>
  <text x="490" y="316" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">未命中</text>

  <!-- priority badges -->
  <text x="120" y="80" fill="#78716c" font-size="16" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">01</text>
  <text x="120" y="176" fill="#b5523a" font-size="16" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">02</text>
  <text x="120" y="272" fill="#78716c" font-size="16" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">03</text>
  <text x="120" y="368" fill="#78716c" font-size="16" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">04</text>

  <!-- level 1 -->
  <rect x="160" y="48" width="560" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="192" y="72" fill="#1c1917" font-size="12" font-weight="600">命令行参数</text>
  <text x="192" y="90" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">pi --api-key · pi --provider</text>
  <text x="688" y="80" fill="#57534e" font-size="9" text-anchor="end">临时指定，仅当次启动有效</text>

  <!-- level 2 (focal, most used) -->
  <rect x="160" y="144" width="560" height="56" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <text x="192" y="168" fill="#1c1917" font-size="12" font-weight="600">凭证文件</text>
  <text x="192" y="186" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">~/.pi/agent/auth.json</text>
  <text x="688" y="176" fill="#b5523a" font-size="9" text-anchor="end">/login 订阅登录写入，最常用</text>

  <!-- level 3 -->
  <rect x="160" y="240" width="560" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="192" y="264" fill="#1c1917" font-size="12" font-weight="600">环境变量</text>
  <text x="192" y="282" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">ANTHROPIC_API_KEY · DEEPSEEK_API_KEY · OPENAI_API_KEY</text>
  <text x="688" y="272" fill="#57534e" font-size="9" text-anchor="end">适合脚本与 CI 环境</text>

  <!-- level 4 -->
  <rect x="160" y="336" width="560" height="56" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="192" y="360" fill="#1c1917" font-size="12" font-weight="600">自定义提供商配置</text>
  <text x="192" y="378" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace">~/.pi/agent/models.json</text>
  <text x="688" y="368" fill="#57534e" font-size="9" text-anchor="end">OpenAI Compatible 端点</text>

  <!-- bottom note -->
  <text x="440" y="428" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif','Songti SC',serif" text-anchor="middle">四级全部未命中时，启动界面会提示先运行 /login 完成认证</text>
</svg>
