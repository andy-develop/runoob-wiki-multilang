<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
  <defs>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="760" height="540" fill="#fafbfc"/>

  <text x="380" y="30" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 的四层包架构</text>
  <text x="380" y="50" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">上层依赖下层，你也可以单独使用底层三个包</text>

  <rect x="80" y="68" width="600" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="94" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">用户在终端运行  pi</text>

  <line x1="380" y1="110" x2="380" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrA)"/>

  <rect x="80" y="132" width="600" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="380" y="157" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1e40af">@earendil-works/pi-coding-agent</text>
  <text x="380" y="180" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#475569">交互式编码 Agent CLI · 默认工具 read / write / edit / bash</text>

  <line x1="380" y1="200" x2="380" y2="218" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrA)"/>

  <rect x="80" y="222" width="600" height="68" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="380" y="247" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#6d28d9">@earendil-works/pi-agent-core</text>
  <text x="380" y="270" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#475569">Agent 运行时 · 工具调用循环 · 状态管理</text>

  <line x1="380" y1="290" x2="380" y2="308" stroke="#64748b" stroke-width="1.5"/>
  <line x1="220" y1="308" x2="540" y2="308" stroke="#64748b" stroke-width="1.5"/>
  <line x1="220" y1="308" x2="220" y2="326" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrA)"/>
  <line x1="540" y1="308" x2="540" y2="326" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrA)"/>

  <rect x="80" y="330" width="280" height="68" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="220" y="355" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#047857">@earendil-works/pi-ai</text>
  <text x="220" y="378" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#475569">统一多厂商 LLM API</text>

  <rect x="400" y="330" width="280" height="68" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="540" y="355" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#b45309">@earendil-works/pi-tui</text>
  <text x="540" y="378" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#475569">终端 UI 库 · 差分渲染</text>

  <line x1="220" y1="398" x2="220" y2="426" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG)"/>

  <rect x="80" y="430" width="280" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="220" y="455" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#334155">15+ LLM 厂商</text>
  <text x="220" y="476" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#64748b">Anthropic · OpenAI · Google</text>
  <text x="220" y="490" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#64748b">Bedrock · Ollama · ...</text>

  <text x="400" y="455" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">pi-tui 是独立的渲染层，</text>
  <text x="400" y="472" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">不依赖 LLM，可单独用于</text>
  <text x="400" y="489" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">任何终端应用。</text>

  <rect x="60" y="514" width="640" height="18" rx="4" fill="none"/>
</svg>
