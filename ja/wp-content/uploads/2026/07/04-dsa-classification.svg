<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 650" width="850" height="650">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: "SF Mono","Fira Code","Cascadia Code","Courier New","Microsoft YaHei","SimHei",monospace; }
  </style>
  <rect width="850" height="650" fill="url(#bg)"/>

  <text x="425" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">数据结构分类全景图</text>

  <!-- Root -->
  <rect x="300" y="50" width="250" height="40" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
  <text x="425" y="75" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">数据结构分类</text>

  <!-- Split arrows from root -->
  <line x1="350" y1="90" x2="180" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="90" x2="670" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Left branch: 按逻辑结构 -->
  <rect x="50" y="130" width="300" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="153" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">按逻辑结构分类</text>

  <!-- 3 sub-branches under 逻辑结构 -->
  <line x1="130" y1="166" x2="90" y2="200" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="166" x2="200" y2="200" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="270" y1="166" x2="310" y2="200" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="20" y="205" width="140" height="150" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="90" y="228" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="bold">线性结构</text>
  <line x1="40" y1="235" x2="140" y2="235" stroke="#334155" stroke-width="0.5"/>
  <text x="90" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">数组 (Array)</text>
  <text x="90" y="275" text-anchor="middle" fill="#94a3b8" font-size="11">链表 (Linked List)</text>
  <text x="90" y="295" text-anchor="middle" fill="#94a3b8" font-size="11">栈 (Stack)</text>
  <text x="90" y="315" text-anchor="middle" fill="#94a3b8" font-size="11">队列 (Queue)</text>
  <text x="90" y="340" text-anchor="middle" fill="#475569" font-size="10">元素关系: 一对一</text>

  <rect x="175" y="205" width="140" height="150" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="245" y="228" text-anchor="middle" fill="#10b981" font-size="12" font-weight="bold">树形结构</text>
  <line x1="195" y1="235" x2="295" y2="235" stroke="#334155" stroke-width="0.5"/>
  <text x="245" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">二叉树</text>
  <text x="245" y="275" text-anchor="middle" fill="#94a3b8" font-size="11">二叉搜索树</text>
  <text x="245" y="295" text-anchor="middle" fill="#94a3b8" font-size="11">AVL 树 (平衡)</text>
  <text x="245" y="315" text-anchor="middle" fill="#94a3b8" font-size="11">堆 (Heap)</text>
  <text x="245" y="340" text-anchor="middle" fill="#475569" font-size="10">元素关系: 一对多</text>

  <rect x="330" y="205" width="140" height="150" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1"/>
  <text x="400" y="228" text-anchor="middle" fill="#f97316" font-size="12" font-weight="bold">图形结构</text>
  <line x1="350" y1="235" x2="450" y2="235" stroke="#334155" stroke-width="0.5"/>
  <text x="400" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">有向图</text>
  <text x="400" y="275" text-anchor="middle" fill="#94a3b8" font-size="11">无向图</text>
  <text x="400" y="295" text-anchor="middle" fill="#94a3b8" font-size="11">带权图</text>
  <text x="400" y="315" text-anchor="middle" fill="#94a3b8" font-size="11">DAG (有向无环图)</text>
  <text x="400" y="340" text-anchor="middle" fill="#475569" font-size="10">元素关系: 多对多</text>

  <!-- Right branch: 按存储方式 -->
  <rect x="540" y="130" width="270" height="36" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
  <text x="675" y="153" text-anchor="middle" fill="#f97316" font-size="13" font-weight="bold">按存储方式分类</text>

  <line x1="600" y1="166" x2="570" y2="200" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="675" y1="166" x2="675" y2="200" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="750" y1="166" x2="780" y2="200" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="510" y="205" width="140" height="150" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="580" y="228" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">顺序存储</text>
  <line x1="530" y1="235" x2="630" y2="235" stroke="#334155" stroke-width="0.5"/>
  <text x="580" y="258" text-anchor="middle" fill="#94a3b8" font-size="11">内存连续存放</text>
  <text x="580" y="278" text-anchor="middle" fill="#94a3b8" font-size="11">随机访问 O(1)</text>
  <text x="580" y="298" text-anchor="middle" fill="#94a3b8" font-size="11">大小固定/栈分配</text>
  <text x="580" y="325" text-anchor="middle" fill="#475569" font-size="10">代表: 数组、静态栈</text>

  <rect x="660" y="205" width="140" height="150" rx="6" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="730" y="228" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">链式存储</text>
  <line x1="680" y1="235" x2="780" y2="235" stroke="#334155" stroke-width="0.5"/>
  <text x="730" y="258" text-anchor="middle" fill="#94a3b8" font-size="11">内存可分散</text>
  <text x="730" y="278" text-anchor="middle" fill="#94a3b8" font-size="11">不支持随机访问</text>
  <text x="730" y="298" text-anchor="middle" fill="#94a3b8" font-size="11">动态扩容灵活</text>
  <text x="730" y="325" text-anchor="middle" fill="#475569" font-size="10">代表: 链表、树、图</text>

  <!-- Cross-dimension note -->
  <rect x="160" y="390" width="530" height="60" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="425" y="415" text-anchor="middle" fill="#eab308" font-size="12" font-weight="bold">两个维度可以交叉组合</text>
  <text x="425" y="438" text-anchor="middle" fill="#94a3b8" font-size="11">示例：栈 (线性结构) 可用顺序存储 (数组) 或链式存储 (链表) 实现</text>

  <!-- ADT section -->
  <rect x="160" y="475" width="530" height="155" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="425" y="500" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">抽象数据类型 (ADT) — 接口与实现分离</text>

  <rect x="190" y="520" width="200" height="90" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="290" y="545" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="bold">ADT 层面 (接口)</text>
  <text x="290" y="565" text-anchor="middle" fill="#94a3b8" font-size="11">定义"做什么"</text>
  <text x="290" y="585" text-anchor="middle" fill="#94a3b8" font-size="11">push / pop / peek 等操作</text>
  <text x="290" y="602" text-anchor="middle" fill="#94a3b8" font-size="11">LIFO 行为规范</text>

  <text x="420" y="565" text-anchor="middle" fill="#475569" font-size="20">⇔</text>

  <rect x="460" y="520" width="200" height="90" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="560" y="545" text-anchor="middle" fill="#10b981" font-size="12" font-weight="bold">实现层面 (底层)</text>
  <text x="560" y="565" text-anchor="middle" fill="#94a3b8" font-size="11">决定"怎么做"</text>
  <text x="560" y="585" text-anchor="middle" fill="#94a3b8" font-size="11">数组实现 / 链表实现</text>
  <text x="560" y="602" text-anchor="middle" fill="#94a3b8" font-size="11">性能特性不同，行为一致</text>

</svg>