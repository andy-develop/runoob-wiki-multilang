<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- arrows first -->
  <line x1="144" y1="120" x2="172" y2="120" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="288" y1="120" x2="316" y2="120" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="432" y1="120" x2="460" y2="120" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="688" y1="120" x2="716" y2="120" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="776" y1="144" x2="776" y2="236" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- turn loop: internal mini arrows (drawn before mini nodes) -->
  <line x1="576" y1="104" x2="576" y2="116" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="576" y1="140" x2="576" y2="152" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- loop-back dashed inside container -->
  <path d="M464 164 C440 164, 440 88, 464 88" fill="none" stroke="#b5523a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

  <!-- row 1 nodes -->
  <rect x="32" y="96" width="112" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="88" y="116" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">扩展加载</text>
  <text x="88" y="134" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">extensions ready</text>

  <rect x="176" y="96" width="112" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="232" y="116" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">项目信任确认</text>
  <text x="232" y="134" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">project_trust</text>

  <rect x="320" y="96" width="112" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="376" y="116" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">会话启动</text>
  <text x="376" y="134" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">session_start</text>

  <!-- turn loop container (focal) -->
  <rect x="464" y="56" width="224" height="136" rx="8" fill="rgba(181,82,58,0.05)" stroke="#b5523a" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="476" y="76" fill="#b5523a" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">TURN LOOP</text>
  <text x="676" y="76" fill="#b5523a" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">turn_start / turn_end</text>

  <rect x="472" y="84" width="192" height="20" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <text x="568" y="98" fill="#1c1917" font-size="9" font-weight="600" text-anchor="middle">组装上下文 context</text>
  <rect x="472" y="116" width="192" height="24" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <text x="568" y="132" fill="#1c1917" font-size="9" font-weight="600" text-anchor="middle">请求模型 provider</text>
  <rect x="472" y="152" width="192" height="24" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <text x="568" y="168" fill="#1c1917" font-size="9" font-weight="600" text-anchor="middle">执行工具 tool_call</text>

  <rect x="720" y="96" width="112" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="776" y="116" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">回复完成</text>
  <text x="776" y="134" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">agent_end</text>

  <!-- row 2 -->
  <rect x="720" y="240" width="112" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="776" y="260" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">会话关闭</text>
  <text x="776" y="278" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">session_shutdown</text>

  <!-- loop count note -->
  <text x="576" y="216" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif','Songti SC',serif" text-anchor="middle">有工具调用时循环多轮，直到模型给出最终回复</text>

  <!-- legend -->
  <line x1="32" y1="336" x2="848" y2="336" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="352" fill="#57534e" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="112" y1="348" x2="148" y2="348" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="158" y="351" fill="#57534e" font-size="9">顺序执行</text>
  <line x1="240" y1="348" x2="276" y2="348" stroke="#b5523a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="286" y="351" fill="#57534e" font-size="9">循环 / 可多次触发</text>
</svg>
