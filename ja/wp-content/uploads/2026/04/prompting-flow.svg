<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Codex 提示词工作流程</text>

  <!-- User Input Box -->
  <rect x="50" y="50" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">用户提示词</text>
  <text x="125" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Prompt</text>

  <!-- Arrow to Codex -->
  <line x1="200" y1="75" x2="250" y2="75" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Codex Agent Box -->
  <rect x="250" y="50" width="150" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="325" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9d174d">Codex Agent</text>
  <text x="325" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#831843">处理请求</text>

  <!-- Loop Arrow -->
  <path d="M 400 75 C 450 75, 450 120, 400 120 C 350 120, 350 75, 400 75" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="410" y="105" font-family="Arial, sans-serif" font-size="9" fill="#7c3aed">循环</text>

  <!-- Arrow to Model -->
  <line x1="400" y1="75" x2="450" y2="75" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- LLM Model -->
  <rect x="450" y="50" width="150" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="525" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">LLM 模型</text>
  <text x="525" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">GPT-5.4</text>

  <!-- Arrow to Action -->
  <line x1="600" y1="75" x2="650" y2="75" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Action Selection -->
  <rect x="650" y="50" width="130" height="50" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="715" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">执行工具</text>

  <!-- Tool Options - Branching -->
  <!-- File Read -->
  <line x1="715" y1="100" x2="715" y2="140" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="620" y="140" width="95" height="35" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="667" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3730a3">读取文件</text>

  <rect x="715" y="140" width="95" height="35" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="762" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3730a3">编辑文件</text>

  <rect x="810" y="140" width="95" height="35" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1" transform="translate(-190,0)"/>
  <text x="857" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3730a3">执行命令</text>

  <!-- Results Flow Back -->
  <line x1="667" y1="175" x2="667" y2="220" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="762" y1="175" x2="762" y2="220" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Results Aggregation -->
  <rect x="550" y="220" width="250" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">结果聚合与输出</text>

  <!-- Final Output -->
  <line x1="675" y1="260" x2="675" y2="300" stroke="#059669" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="600" y="300" width="150" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="675" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">最终输出</text>

  <!-- Completion Check -->
  <path d="M 750 325 C 780 325, 780 280, 750 280 C 720 280, 720 325, 750 325" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="785" y="305" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">完成?</text>

  <!-- Legend -->
  <rect x="50" y="380" width="700" height="50" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="65" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">流程说明：</text>
  <circle cx="70" cy="418" r="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="82" y="422" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">用户输入</text>
  <circle cx="160" cy="418" r="4" fill="#fce7f3" stroke="#db2777"/>
  <text x="172" y="422" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Codex 处理</text>
  <circle cx="260" cy="418" r="4" fill="#d1fae5" stroke="#059669"/>
  <text x="272" y="422" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">LLM 推理</text>
  <circle cx="360" cy="418" r="4" fill="#fed7aa" stroke="#ea580c"/>
  <text x="372" y="422" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">工具执行</text>
  <circle cx="460" cy="418" r="4" fill="#d1fae5" stroke="#059669"/>
  <text x="472" y="422" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">结果输出</text>
</svg>