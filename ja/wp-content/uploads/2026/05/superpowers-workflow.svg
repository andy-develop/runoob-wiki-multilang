<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="boxA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="boxB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="boxC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="boxD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="url(#bgGrad)"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Superpowers 工作流：从需求到代码</text>
  <text x="450" y="65" text-anchor="middle" font-size="13" fill="#64748b">让 AI 按流程干活，而不是拿到需求就动手写</text>

  <!-- 用户需求 -->
  <rect x="40" y="120" width="160" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">用户描述需求</text>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#64748b">自然语言输入</text>

  <!-- 阶段 1: 需求梳理 -->
  <rect x="240" y="120" width="160" height="80" rx="10" fill="url(#boxA)"/>
  <text x="320" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1. 需求梳理</text>
  <text x="320" y="172" text-anchor="middle" font-size="11" fill="#dbeafe">brainstorming</text>
  <text x="320" y="190" text-anchor="middle" font-size="11" fill="#dbeafe">追问 / 对齐方案</text>

  <!-- 阶段 2: 实现规划 -->
  <rect x="440" y="120" width="160" height="80" rx="10" fill="url(#boxB)"/>
  <text x="520" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2. 实现规划</text>
  <text x="520" y="172" text-anchor="middle" font-size="11" fill="#d1fae5">任务拆分 2-5 分钟</text>
  <text x="520" y="190" text-anchor="middle" font-size="11" fill="#d1fae5">文件 / 代码 / 验证</text>

  <!-- 阶段 3: 执行 -->
  <rect x="640" y="120" width="160" height="80" rx="10" fill="url(#boxC)"/>
  <text x="720" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3. 执行任务</text>
  <text x="720" y="172" text-anchor="middle" font-size="11" fill="#fef3c7">TDD / Worktree</text>
  <text x="720" y="190" text-anchor="middle" font-size="11" fill="#fef3c7">双轮检查</text>

  <!-- 阶段 4: 交付 -->
  <rect x="370" y="280" width="160" height="80" rx="10" fill="url(#boxD)"/>
  <text x="450" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4. 交付代码</text>
  <text x="450" y="332" text-anchor="middle" font-size="11" fill="#f3e8ff">符合设计规格</text>
  <text x="450" y="350" text-anchor="middle" font-size="11" fill="#f3e8ff">质量已审查</text>

  <!-- 连接线 -->
  <line x1="200" y1="160" x2="232" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="160" x2="432" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="160" x2="632" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 向下转到第 4 阶段 -->
  <path d="M720 200 L720 240 L450 240 L450 272" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 反馈回环 -->
  <path d="M370 320 L150 320 L150 200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow)"/>
  <text x="180" y="345" font-size="11" fill="#64748b">发现偏差 → 回到需求梳理</text>

  <!-- 底部标签 -->
  <rect x="40" y="410" width="820" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="435" font-size="12" font-weight="600" fill="#0f172a">核心理念：</text>
  <text x="135" y="435" font-size="12" fill="#475569">在写代码之前先把需求理清楚、列出实现计划、确认边界，最后再动手——减少来回修改的次数。</text>
</svg>
