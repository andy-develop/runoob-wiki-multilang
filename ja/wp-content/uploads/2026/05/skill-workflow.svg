<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E8449;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E67E22;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- 用户请求 -->
  <rect x="300" y="20" width="200" height="50" rx="8" fill="url(#userGrad)"/>
  <text x="400" y="50" text-anchor="middle" fill="#fff" font-size="16" font-family="sans-serif" font-weight="bold">用户请求</text>

  <line x1="400" y1="70" x2="400" y2="100" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent 理解需求 -->
  <rect x="280" y="100" width="240" height="50" rx="8" fill="url(#agentGrad)"/>
  <text x="400" y="130" text-anchor="middle" fill="#fff" font-size="16" font-family="sans-serif" font-weight="bold">Agent 理解需求</text>

  <line x1="400" y1="150" x2="400" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 扫描所有 Skills -->
  <rect x="280" y="180" width="240" height="50" rx="8" fill="url(#skillGrad)"/>
  <text x="400" y="210" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="bold">扫描所有 Skills</text>

  <line x1="400" y1="230" x2="400" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 读取 description -->
  <rect x="280" y="260" width="240" height="50" rx="8" fill="url(#skillGrad)"/>
  <text x="400" y="290" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="bold">读取 description 字段</text>

  <line x1="400" y1="310" x2="400" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 匹配合适 Skill -->
  <rect x="260" y="340" width="280" height="50" rx="8" fill="url(#agentGrad)"/>
  <text x="400" y="370" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="bold">匹配合适的 Skill</text>

  <line x1="400" y1="390" x2="400" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 执行任务 -->
  <rect x="300" y="420" width="200" height="50" rx="8" fill="url(#agentGrad)"/>
  <text x="400" y="450" text-anchor="middle" fill="#fff" font-size="16" font-family="sans-serif" font-weight="bold">执行任务并返回结果</text>

  <!-- 右侧说明 -->
  <rect x="580" y="180" width="180" height="30" rx="4" fill="#f0f0f0" stroke="#ddd"/>
  <text x="670" y="200" text-anchor="middle" fill="#666" font-size="12" font-family="sans-serif">先读取描述信息</text>

  <rect x="580" y="260" width="180" height="30" rx="4" fill="#f0f0f0" stroke="#ddd"/>
  <text x="670" y="280" text-anchor="middle" fill="#666" font-size="12" font-family="sans-serif">命中后才加载完整内容</text>

  <line x1="580" y1="195" x2="520" y2="205" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="580" y1="275" x2="520" y2="285" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 底部标注 -->
  <text x="400" y="500" text-anchor="middle" fill="#999" font-size="12" font-family="sans-serif">Agent 不会一次性加载所有 Skill 的完整内容，以节省 Token 消耗</text>
</svg>