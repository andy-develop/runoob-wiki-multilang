<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="leftBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="midBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="rightBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="url(#bg)"/>

  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Taste Skill 如何改变 AI 生成界面的方式</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#64748b">从"功能正确"到"视觉有意思"——用设计规则替代训练数据的默认模式</text>

  <!-- 左：AI 默认 -->
  <rect x="30" y="105" width="250" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="105" width="250" height="44" rx="12" fill="url(#leftBox)"/>
  <rect x="30" y="137" width="250" height="12" fill="url(#leftBox)"/>
  <text x="155" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AI 默认输出</text>

  <text x="50" y="180" font-size="13" fill="#475569">训练数据中最高频的模式：</text>
  <rect x="50" y="195" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="155" y="215" text-anchor="middle" font-size="12" fill="#64748b">大标题居中 + 副标题</text>
  <rect x="50" y="232" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="155" y="252" text-anchor="middle" font-size="12" fill="#64748b">蓝白 / 深灰配色</text>
  <rect x="50" y="269" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="155" y="289" text-anchor="middle" font-size="12" fill="#64748b">卡片四等分 + 均匀间距</text>
  <rect x="50" y="306" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="155" y="326" text-anchor="middle" font-size="12" fill="#64748b">标准圆角 + CTA 按钮</text>

  <text x="155" y="370" text-anchor="middle" font-size="12" fill="#94a3b8">功能正确，视觉普通</text>
  <text x="155" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8">"AI 味"</text>

  <!-- 中：Taste Skill -->
  <rect x="325" y="105" width="250" height="310" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="325" y="105" width="250" height="44" rx="12" fill="url(#midBox)"/>
  <rect x="325" y="137" width="250" height="12" fill="url(#midBox)"/>
  <text x="450" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Taste Skill 规则</text>

  <text x="345" y="180" font-size="13" fill="#475569">SKILL.md 里的设计决策：</text>
  <rect x="345" y="195" width="210" height="30" rx="6" fill="#fff7ed"/>
  <text x="450" y="215" text-anchor="middle" font-size="12" fill="#c2410c">DESIGN_VARIANCE 布局变化</text>
  <rect x="345" y="232" width="210" height="30" rx="6" fill="#fff7ed"/>
  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#c2410c">MOTION_INTENSITY 动效深度</text>
  <rect x="345" y="269" width="210" height="30" rx="6" fill="#fff7ed"/>
  <text x="450" y="289" text-anchor="middle" font-size="12" fill="#c2410c">VISUAL_DENSITY 信息密度</text>
  <rect x="345" y="306" width="210" height="30" rx="6" fill="#fff7ed"/>
  <text x="450" y="326" text-anchor="middle" font-size="12" fill="#c2410c">排版层次 / 间距逻辑</text>

  <text x="450" y="370" text-anchor="middle" font-size="12" fill="#ea580c">覆盖训练数据的默认模式</text>
  <text x="450" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#ea580c">设计偏好注入</text>

  <!-- 右：输出 -->
  <rect x="620" y="105" width="250" height="310" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="620" y="105" width="250" height="44" rx="12" fill="url(#rightBox)"/>
  <rect x="620" y="137" width="250" height="12" fill="url(#rightBox)"/>
  <text x="745" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">生成结果</text>

  <text x="640" y="180" font-size="13" fill="#475569">按规则做设计决策：</text>
  <rect x="640" y="195" width="210" height="30" rx="6" fill="#eef2ff"/>
  <text x="745" y="215" text-anchor="middle" font-size="12" fill="#4338ca">不对称 / 现代布局</text>
  <rect x="640" y="232" width="210" height="30" rx="6" fill="#eef2ff"/>
  <text x="745" y="252" text-anchor="middle" font-size="12" fill="#4338ca">有意图的配色选择</text>
  <rect x="640" y="269" width="210" height="30" rx="6" fill="#eef2ff"/>
  <text x="745" y="289" text-anchor="middle" font-size="12" fill="#4338ca">节奏感间距 + 层次</text>
  <rect x="640" y="306" width="210" height="30" rx="6" fill="#eef2ff"/>
  <text x="745" y="326" text-anchor="middle" font-size="12" fill="#4338ca">匹配场景的动效</text>

  <text x="745" y="370" text-anchor="middle" font-size="12" fill="#6366f1">功能正确 + 视觉有意思</text>
  <text x="745" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#6366f1">去除"AI 味"</text>

  <!-- 箭头 -->
  <line x1="280" y1="260" x2="317" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="575" y1="260" x2="612" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- 底部 -->
  <rect x="30" y="445" width="840" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="472" font-size="12" font-weight="600" fill="#0f172a">核心思路：</text>
  <text x="125" y="472" font-size="12" fill="#475569">不靠模糊的提示词（"高端感""设计感"），而是把具体的设计决策写成规则文件，让 AI 在生成前加载，按规则做决策。</text>
  <text x="125" y="490" font-size="12" fill="#475569">三个可调参数（1-10）控制布局变化幅度、动效深度、信息密度，改完保存立即生效。</text>
</svg>
