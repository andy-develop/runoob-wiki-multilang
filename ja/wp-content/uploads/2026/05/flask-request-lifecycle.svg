<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .node-light { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .node-dark { font-size: 13px; font-weight: 600; fill: #111827; }
    .sub-light { font-size: 11px; font-weight: 400; fill: rgba(255,255,255,0.85); }
    .sub-dark { font-size: 11px; font-weight: 400; fill: #6b7280; }
    .small-light { font-size: 10px; font-weight: 400; fill: rgba(255,255,255,0.75); }
    .small-dark { font-size: 10px; font-weight: 400; fill: #9ca3af; }
    .legend-title { font-size: 11px; font-weight: 600; fill: #374151; }
    .legend-text { font-size: 11px; font-weight: 400; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="480" y="35" text-anchor="middle" class="title">Flask 请求处理生命周期</text>

  <!-- ===== Step 1: HTTP 请求 ===== -->
  <rect x="345" y="55" width="270" height="40" rx="20" fill="#2563eb" filter="url(#shadow)"/>
  <text x="480" y="80" text-anchor="middle" class="node-light">HTTP 请求（客户端）</text>
  <line x1="480" y1="95" x2="480" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== Step 2: Flask.__call__() ===== -->
  <rect x="360" y="122" width="240" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="145" text-anchor="middle" class="node-dark">Flask.__call__() WSGI 入口</text>
  <line x1="480" y1="158" x2="480" y2="181" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== Step 3: AppContext.push() ===== -->
  <rect x="320" y="185" width="320" height="36" rx="6" fill="#16a34a" filter="url(#shadow)"/>
  <text x="480" y="208" text-anchor="middle" class="node-light">AppContext.push() 推入上下文</text>
  <text x="165" y="204" text-anchor="end" class="small-light">← current_app, g 可用</text>
  <text x="795" y="204" text-anchor="start" class="small-light">request, session 可用 →</text>
  <line x1="480" y1="221" x2="480" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== Step 4: full_dispatch_request() ===== -->
  <rect x="280" y="252" width="400" height="38" rx="8" fill="#1e40af" filter="url(#shadow)"/>
  <text x="480" y="277" text-anchor="middle" class="node-light">full_dispatch_request() 完整请求调度</text>

  <!-- 分支横线 + 三根竖线 -->
  <line x1="480" y1="290" x2="480" y2="312" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="160" y1="312" x2="800" y2="312" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="160" y1="312" x2="160" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="480" y1="312" x2="480" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="800" y1="312" x2="800" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== Step 5: 三个核心步骤 (白底深字) ===== -->
  <rect x="55" y="334" width="210" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="357" text-anchor="middle" class="node-dark">preprocess_request()</text>

  <line x1="267" y1="352" x2="310" y2="352" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="315" y="334" width="330" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="357" text-anchor="middle" class="node-dark">dispatch_request() 路由匹配 + 视图调度</text>

  <line x1="647" y1="352" x2="690" y2="352" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="695" y="334" width="210" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="357" text-anchor="middle" class="node-dark">finalize_request()</text>

  <!-- 竖线向下到钩子行 -->
  <line x1="160" y1="370" x2="160" y2="395" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="480" y1="370" x2="480" y2="395" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="800" y1="370" x2="800" y2="395" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- ===== Step 6: 三个钩子行 ===== -->
  <rect x="55" y="400" width="210" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="160" y="420" text-anchor="middle" class="node-dark">before_request 钩子</text>
  <text x="160" y="434" text-anchor="middle" class="sub-dark">登录检查 · 权限验证</text>

  <rect x="315" y="400" width="330" height="36" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="480" y="420" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">调用视图函数（你的代码）</text>

  <rect x="695" y="400" width="210" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="800" y="420" text-anchor="middle" class="node-dark">after_request 钩子</text>
  <text x="800" y="434" text-anchor="middle" class="sub-dark">响应头 · Cookie 设置</text>

  <!-- 汇聚 → 响应 -->
  <line x1="160" y1="436" x2="160" y2="458" stroke="#9ca3af" stroke-width="1"/>
  <line x1="480" y1="436" x2="480" y2="458" stroke="#9ca3af" stroke-width="1"/>
  <line x1="800" y1="436" x2="800" y2="458" stroke="#9ca3af" stroke-width="1"/>
  <line x1="160" y1="458" x2="800" y2="458" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="480" y1="458" x2="480" y2="485" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== Step 7: HTTP 响应 ===== -->
  <rect x="345" y="490" width="270" height="40" rx="20" fill="#16a34a" filter="url(#shadow)"/>
  <text x="480" y="515" text-anchor="middle" class="node-light">HTTP 响应（返回客户端）</text>

  <!-- ===== 图例 ===== -->
  <rect x="30" y="555" width="270" height="70" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="45" y="575" class="legend-title">图例</text>
  <line x1="45" y1="595" x2="75" y2="595" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="85" y="599" class="legend-text">请求/响应主流程</text>
  <line x1="45" y1="615" x2="75" y2="615" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="85" y="619" class="legend-text">分支/汇聚</text>

</svg>