<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .node-label { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub-label { font-size: 12px; font-weight: 400; fill: #6b7280; }
    .layer-title { font-size: 11px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
  </style>
  <defs>
    <marker id="arrowMain" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="title">Flask 技术栈分层架构</text>

  <!-- Layer 1: 浏览器 / HTTP 客户端 -->
  <rect x="60" y="65" width="840" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="80" y="83" class="layer-title">表现层</text>
  <rect x="320" y="85" width="320" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="114" text-anchor="middle" class="node-label">浏览器 / HTTP 客户端</text>
  <text x="480" y="130" text-anchor="middle" class="sub-label">发送 HTTP 请求，接收并渲染响应</text>

  <!-- Arrow L1→L2 -->
  <line x1="480" y1="155" x2="480" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowMain)"/>

  <!-- Layer 2: WSGI 服务器 -->
  <rect x="60" y="190" width="840" height="75" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="80" y="208" class="layer-title">服务器层</text>
  <rect x="320" y="208" width="320" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="234" text-anchor="middle" class="node-label">WSGI 服务器（Werkzeug / Gunicorn）</text>

  <!-- Arrow L2→L3 -->
  <line x1="480" y1="265" x2="480" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowMain)"/>

  <!-- Layer 3: Flask 应用核心 -->
  <rect x="60" y="300" width="840" height="90" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="80" y="318" class="layer-title">框架核心层</text>

  <rect x="100" y="325" width="200" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="348" text-anchor="middle" class="node-label">路由系统</text>
  <text x="200" y="365" text-anchor="middle" class="sub-label">URL 匹配 + 视图函数调度</text>

  <rect x="320" y="325" width="200" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="348" text-anchor="middle" class="node-label">模板引擎（Jinja2）</text>
  <text x="420" y="365" text-anchor="middle" class="sub-label">HTML 渲染 + XSS 自动防护</text>

  <rect x="540" y="325" width="200" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="348" text-anchor="middle" class="node-label">请求/响应处理</text>
  <text x="640" y="365" text-anchor="middle" class="sub-label">Session · Cookie · JSON · 信号</text>

  <!-- Arrow L3→L4 -->
  <line x1="480" y1="390" x2="480" y2="420" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowMain)"/>

  <!-- Layer 4: 应用代码 + 扩展 -->
  <rect x="60" y="425" width="840" height="80" rx="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="80" y="443" class="layer-title">业务层</text>

  <rect x="100" y="450" width="240" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="474" text-anchor="middle" class="node-label">你的路由与视图函数</text>

  <rect x="360" y="450" width="240" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="474" text-anchor="middle" class="node-label">数据库 / ORM 集成</text>

  <rect x="620" y="450" width="240" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="474" text-anchor="middle" class="node-label">Flask 扩展生态</text>

</svg>