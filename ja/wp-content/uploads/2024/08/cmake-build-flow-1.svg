<svg viewBox="0 0 800 500"
     xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;">

  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowLight" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" rx="8"/>

  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1e293b">CMake 构建流程</text>

  <!-- ====== 阶段 1: 编写源文件 ====== -->
  <rect x="40" y="48" width="720" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" filter="url(#shadowLight)"/>

  <rect x="52" y="56" width="56" height="38" rx="5" fill="#94a3b8"/>
  <text x="80" y="79" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fff">1</text>

  <text x="120" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">编写源文件和 CMakeLists.txt</text>
  <text x="120" y="92" font-family="monospace, Courier New, Courier" font-size="11" fill="#64748b">main.cpp + mylib.cpp + mylib.h + CMakeLists.txt</text>

  <!-- 箭头 1→2 -->
  <line x1="400" y1="102" x2="400" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- ====== 阶段 2: 创建构建目录 ====== -->
  <rect x="40" y="124" width="720" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" filter="url(#shadowLight)"/>

  <rect x="52" y="132" width="56" height="38" rx="5" fill="#94a3b8"/>
  <text x="80" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fff">2</text>

  <text x="120" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">创建构建目录（Out-of-Source Build）</text>
  <text x="120" y="168" font-family="monospace, Courier New, Courier" font-size="11" fill="#64748b">mkdir build &amp;&amp; cd build</text>

  <!-- 箭头 2→3 -->
  <line x1="400" y1="178" x2="400" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- ====== 阶段 3: 配置（CMake） ====== -->
  <rect x="40" y="200" width="720" height="54" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="52" y="208" width="56" height="38" rx="5" fill="#3b82f6"/>
  <text x="80" y="231" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fff">3</text>

  <text x="120" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">配置项目（cmake ..）</text>
  <text x="120" y="244" font-family="monospace, Courier New, Courier" font-size="11" fill="#64748b">解析 CMakeLists.txt → 生成 Makefile / .sln / ninja.build</text>

  <!-- 箭头 3→4 -->
  <line x1="400" y1="254" x2="400" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- ====== 阶段 4: 编译（Build） ====== -->
  <rect x="40" y="276" width="720" height="54" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="52" y="284" width="56" height="38" rx="5" fill="#16a34a"/>
  <text x="80" y="307" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fff">4</text>

  <text x="120" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">编译项目（cmake --build . 或 make）</text>
  <text x="120" y="320" font-family="monospace, Courier New, Courier" font-size="11" fill="#64748b">调用编译器 → 生成目标文件（可执行文件 + 库文件）</text>

  <!-- 箭头 4→5 -->
  <line x1="400" y1="330" x2="400" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- ====== 阶段 5: 运行与测试 ====== -->
  <rect x="40" y="352" width="720" height="54" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="52" y="360" width="56" height="38" rx="5" fill="#ca8a04"/>
  <text x="80" y="383" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fff">5</text>

  <text x="120" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">运行可执行文件与运行测试</text>
  <text x="120" y="396" font-family="monospace, Courier New, Courier" font-size="11" fill="#64748b">./MyExecutable → ctest 或 ./TestMyLib</text>

  <!-- ====== 底部关键概念 ====== -->
  <rect x="40" y="422" width="720" height="68" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4,2" opacity="0.4"/>

  <text x="400" y="446" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e">核心概念</text>

  <!-- 三个概念方块 -->
  <rect x="60" y="456" width="210" height="28" rx="4" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="165" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78716c">Out-of-Source Build（源外构建）</text>

  <rect x="295" y="456" width="210" height="28" rx="4" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="400" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78716c">Target 目标（可执行文件/库）</text>

  <rect x="530" y="456" width="210" height="28" rx="4" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="635" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78716c">跨平台构建（Linux/macOS/Windows）</text>

</svg>