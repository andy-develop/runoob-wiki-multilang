<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">API LANDSCAPE</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="236" y1="252" x2="300" y2="252" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <line x1="660" y1="176" x2="724" y2="176" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M660,336 L692,336 L692,372 L724,372" fill="none" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <rect x="232" y="232" width="72" height="14" rx="2" fill="#faf7f2"/>
  <text x="268" y="243" fill="#2563eb" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>
  <rect x="664" y="156" width="56" height="14" rx="2" fill="#faf7f2"/>
  <text x="692" y="167" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">加载推理</text>
  <rect x="648" y="384" width="88" height="14" rx="2" fill="#faf7f2"/>
  <text x="692" y="395" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">云端转发</text>

  <!-- ===== 左：调用方 ===== -->
  <rect x="36" y="112" width="200" height="280" rx="8" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <text x="136" y="140" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">你的代码</text>
  <rect x="52" y="160" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="136" y="180" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">curl</text>
  <rect x="52" y="200" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="136" y="220" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Python SDK</text>
  <rect x="52" y="240" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="136" y="260" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">JavaScript SDK</text>
  <rect x="52" y="280" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="136" y="300" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OpenAI SDK</text>
  <rect x="52" y="320" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="136" y="340" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Anthropic SDK</text>

  <!-- ===== 中：Ollama 服务 ===== -->
  <rect x="300" y="112" width="360" height="368" rx="8" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="480" y="142" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama 服务</text>
  <text x="480" y="160" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">localhost:11434</text>
  <line x1="316" y1="176" x2="644" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>

  <text x="316" y="200" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">生成类</text>
  <text x="316" y="224" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">POST /api/generate</text>
  <text x="316" y="248" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">POST /api/chat</text>
  <text x="316" y="272" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">POST /api/embed</text>
  <text x="316" y="296" fill="#57534e" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">/v1/*  OpenAI · Anthropic 兼容</text>

  <line x1="316" y1="316" x2="644" y2="316" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="316" y="340" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">管理类</text>
  <text x="316" y="364" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">GET /api/tags · POST /api/pull</text>
  <text x="316" y="388" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">POST /api/show · /api/create</text>
  <text x="316" y="412" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">DELETE /api/delete · GET /api/ps</text>
  <text x="316" y="436" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">GET /api/version · /api/blobs</text>

  <!-- ===== 右上：本地模型 ===== -->
  <rect x="724" y="140" width="200" height="72" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="824" y="172" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">本地模型</text>
  <text x="824" y="192" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">qwen3.5 · runoob-helper</text>

  <!-- ===== 右下：Ollama Cloud ===== -->
  <rect x="724" y="336" width="200" height="72" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="824" y="368" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama Cloud</text>
  <text x="824" y="388" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">ollama.com/api · API Key</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="500" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">一套服务，三种协议：原生 API · OpenAI 兼容 · Anthropic 兼容</text>
</svg>
