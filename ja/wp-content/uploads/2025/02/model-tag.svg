<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">MODEL TAG ANATOMY</text>

  <!-- ===== Leader lines（先画，位于文字下层） ===== -->
  <path d="M428,154 Q376,184 302,206" fill="none" stroke="rgba(28,25,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="302" cy="206" r="2" fill="#1c1917"/>
  <path d="M540,154 Q596,184 654,206" fill="none" stroke="rgba(28,25,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="654" cy="206" r="2" fill="#1c1917"/>

  <!-- ===== 示例一：模型名 + 标签 ===== -->
  <text x="480" y="140" font-size="32" font-weight="600" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle"><tspan fill="#1c1917">qwen3.5</tspan><tspan fill="#b5523a">:9b</tspan></text>

  <rect x="96" y="212" width="208" height="52" rx="6" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <text x="200" y="234" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">模型名</text>
  <text x="200" y="252" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">模型库中的名字</text>

  <rect x="656" y="212" width="208" height="52" rx="6" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <text x="760" y="234" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">标签 tag</text>
  <text x="760" y="252" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">参数规格或版本</text>

  <!-- ===== 示例二：省略标签 → latest ===== -->
  <line x1="96" y1="292" x2="864" y2="292" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="480" y="324" font-size="16" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle"><tspan fill="#1c1917">ollama run qwen3.5</tspan><tspan fill="#78716c">  =  </tspan><tspan fill="#1c1917">qwen3.5</tspan><tspan fill="#b5523a">:latest</tspan></text>
  <text x="480" y="346" fill="#57534e" font-size="10" text-anchor="middle">不写标签时自动补 :latest，当前对应 9b 规格（约 6.6GB）</text>

  <!-- ===== 示例三：命名空间 ===== -->
  <line x1="96" y1="372" x2="864" y2="372" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="480" y="404" font-size="16" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle"><tspan fill="#78716c">runoob/</tspan><tspan fill="#1c1917">my-model</tspan><tspan fill="#b5523a">:4b</tspan></text>
  <text x="480" y="426" fill="#57534e" font-size="10" text-anchor="middle">命名空间：个人或组织发布的模型，斜杠前是发布者的用户名（格式示例）</text>
</svg>
