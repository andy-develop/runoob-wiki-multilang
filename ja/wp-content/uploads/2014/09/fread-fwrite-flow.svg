<svg viewBox="0 0 800 420"
     xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;">

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="420" fill="url(#bgGrad)" rx="8"/>

  <!-- 标题 -->
  <text x="400" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e293b">fread / fwrite 数据读写流程</text>

  <!-- ====== fread 区域（上方） ====== -->
  <rect x="40" y="52" width="720" height="140" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="60" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af">fread — 从文件读取到内存</text>

  <!-- 磁盘/文件 -->
  <rect x="60" y="90" width="180" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="150" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">磁盘文件</text>
  <text x="150" y="136" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">data.bin (rb)</text>

  <!-- 箭头 文件 → 缓冲区 -->
  <line x1="240" y1="120" x2="300" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="270" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">size × count 字节</text>

  <!-- 缓冲区 -->
  <rect x="310" y="90" width="180" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="400" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">内存缓冲区</text>
  <text x="400" y="136" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">void *ptr</text>

  <!-- 箭头 缓冲区 → 结构体 -->
  <line x1="490" y1="120" x2="550" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="520" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">反序列化</text>

  <!-- 结构体/变量 -->
  <rect x="560" y="90" width="180" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="650" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">C 变量/结构体</text>
  <text x="650" y="136" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">Student s; int arr[5];</text>

  <!-- 返回值说明 -->
  <rect x="60" y="160" width="680" height="24" rx="4" fill="#dbeafe" fill-opacity="0.5"/>
  <text x="400" y="177" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">返回值：成功读取的块数（非字节数），若 &lt; count 则可能 EOF 或出错</text>

  <!-- ====== 分隔 ====== -->
  <line x1="60" y1="210" x2="740" y2="210" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ====== fwrite 区域（下方） ====== -->
  <rect x="40" y="224" width="720" height="140" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="60" y="246" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#166534">fwrite — 从内存写入到文件</text>

  <!-- 结构体/变量 -->
  <rect x="60" y="262" width="180" height="60" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="150" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">C 变量/结构体</text>
  <text x="150" y="308" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">Student s = {101, "Alice"};</text>

  <!-- 箭头 结构体 → 缓冲区 -->
  <line x1="240" y1="292" x2="300" y2="292" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="270" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a">序列化</text>

  <!-- 缓冲区 -->
  <rect x="310" y="262" width="180" height="60" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">内存缓冲区</text>
  <text x="400" y="308" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">const void *ptr</text>

  <!-- 箭头 缓冲区 → 磁盘 -->
  <line x1="490" y1="292" x2="550" y2="292" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="520" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a">size × count 字节</text>

  <!-- 磁盘/文件 -->
  <rect x="560" y="262" width="180" height="60" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="650" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">磁盘文件</text>
  <text x="650" y="308" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">data.bin (wb)</text>

  <!-- 返回值说明 -->
  <rect x="60" y="332" width="680" height="24" rx="4" fill="#dcfce7" fill-opacity="0.5"/>
  <text x="400" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">返回值：成功写入的块数（非字节数），若 &lt; count 则写入出错</text>

  <!-- 底部关键点 -->
  <rect x="40" y="380" width="720" height="30" rx="6" fill="#fef3c7" fill-opacity="0.5"/>
  <text x="400" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#92400e">
    关键：二进制模式 "rb"/"wb" → 无格式转换 → 高性能 → 需注意内存对齐与字节序
  </text>

</svg>