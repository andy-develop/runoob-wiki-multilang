})();

<form id="ds-form">
<label for="tougao_title">ノートタイトル:(<span style="color:red;">*</span>)</label>

<label for="tougao_authorname">ニックネーム:(<span style="color:red;">*</span>)</label>

<label for="tougao_authoremail">E-Mail:(<span style="color:red;">*</span>)</label>

<div class="field"><input class="text" id="tougao_authorblog" name="tougao_authorblog" placeholder="请输入您的博客地址或引用地址" size="22" tabindex="3" type="text"/>
</div>

エディターを読み込むコンテナ
<div class="note-editor" style="margin: 10px;">
<div id="mded"></div>

<script>
//初始化编辑器
	
var editor = new Simditor({
  textarea: $('#mded'),
  placeholder: '写笔记...',
  upload: {url:'/api/comment_upload_file.php',params: null,fileKey: 'upload_file',connectionCount: 1,leaveConfirm: '文件正在上传，您确定离开?'},
  defaultImage: 'http://www.runoob.com/images/logo.png',
  codeLanguages: '',
  toolbar: [  'bold','code','ul','ol','image'  ]
});

editor.on('valuechanged', function() {
	$(".simditor-popover").hide();
});
$(".button-green").click(function() {
	var post_url =""
	var tougao_authorname = $("#tougao_authorname").val();
	var tougao_authoremail = $("#tougao_authoremail").val();
	var tougao_authorblog = $("#tougao_authorblog").val();
	var tougao_title = $("#tougao_title").val();
	var tougao_content = editor.getValue();
	if(!tougao_authorname) {
		alert("请输入昵称！");
	} else if(!tougao_authoremail) {
		alert("请输入邮箱！");
	} else if(!tougao_title) {
		alert("请输入标题！");
	} else if(!tougao_content) {
		alert("请输入内容！");
	} else if(tougao_content.length<100) {
		// console.log("tougao_content.length", tougao_content.length);
		alert("内容太短了！");
	} else {
		//console.log("tougao_content.length", tougao_content.length);
		tougao_content = tougao_content.replace(/<pre><code>/,"<pre>");
		tougao_content = tougao_content.replace(/<\/code><\/pre>/,"</pre>");
		//console.log("tougao_content.length", tougao_content.length);
		$.post(post_url,{tougao_form:'send',tougao_authorname:tougao_authorname,tougao_authoremail:tougao_authoremail,tougao_authorblog:tougao_authorblog,tougao_title:tougao_title,tougao_content:tougao_content},function(result){
			if(result.flag) {
				$("#submitBtn").attr("disabled","true");  
			}
		   alert(result.msg);
		   
	    },'json');
	}

})
</script>
