(function () {
  var t = localStorage.getItem('runoob-theme') || 'light';

  document.documentElement.setAttribute('data-theme', t);

  if (t === 'dark') {
    loadDarkCss();
  }

  function loadDarkCss() {
    if (document.getElementById('dark-theme-css')) return;

    var link = document.createElement('link');
    link.id = 'dark-theme-css';
    link.rel = 'stylesheet';
    link.href = window.RUNOOB_CONFIG.darkCssUrl;

    document.head.appendChild(link);
  }
})();
</script>

/* 主题切换按钮 */
/* ===== 主题变量（核心）===== */
:root {
  --theme-bg: #ffffff;
  --theme-border: #e5e7eb;
  --theme-icon: #333;
  --theme-hover: #f3f4f6;
}

.dark {
  --theme-bg: #1f2937;
  --theme-border: #374151;
  --theme-icon: #e5e7eb;
  --theme-hover: #374151;
}

/* ===== 按钮容器 ===== */
.nav-theme-toggle {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== 按钮本体 ===== */
.nav-theme-toggle button {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 28px;
  height: 28px;

  border-radius: 6px;
  border: 1px solid var(--theme-border);

  background: var(--theme-bg);
  color: var(--theme-icon);

  cursor: pointer;
  transition: all 0.2s ease;
}

/* ===== 图标大小 ===== */
.nav-theme-toggle i {
  font-size: 14px;
}

/* ===== hover 效果 ===== */
.nav-theme-toggle button:hover {
  background: var(--theme-hover);
  transform: translateY(-1px);
}

/* ===== 点击反馈 ===== */
.nav-theme-toggle button:active {
  transform: scale(0.95);
}

/* ===== 当前激活态（可选）===== */
.nav-theme-toggle button.active {
  border-color: #3b82f6;
  color: #3b82f6;
}
</style>

<h2 class="sitetip">変換後のCSSコード：</h2>
<textarea class="tarea" id="packer" onmouseover="this.focus();this.select();"></textarea>
<script>
	var lCSSCoder={format:function(s){s=s.replace(/\s*([\{\}\:\;\,])\s*/g,"$1");s=s.replace(/;\s*;/g,";");s=s.replace(/\,[\s\.\#\d]*{/g,"{");s=s.replace(/([^\s])\{([^\s])/g,"$1 {\n\t$2");s=s.replace(/([^\s])\}([^\n]*)/g,"$1\n}\n$2");s=s.replace(/([^\s]);([^\s\}])/g,"$1;\n\t$2");return s},packAdv:function(s){s=s.replace(/\/\*(.|\n)*?\*\//g,"");s=s.replace(/\s*([\{\}\:\;\,])\s*/g,"$1");s=s.replace(/\,[\s\.\#\d]*\{/g,"{");s=s.replace(/;\s*;/g,";");s=s.match(/^\s*(\S+(\s+\S+)*)\s*$/);return(s==null)?"":s[1]},pack:function(s){s=s.replace(/\/\*(.|\n)*?\*\//g,"");s=s.replace(/\s*([\{\}\:\;\,])\s*/g,"$1");s=s.replace(/\,[\s\.\#\d]*\{/g,"{");s=s.replace(/;\s*;/g,";");s=s.replace(/;\s*}/g,"}");s=s.replace(/([^\s])\{([^\s])/g,"$1{$2");s=s.replace(/([^\s])\}([^\n]s*)/g,"$1}\n$2");return s}};function CSS(s){document.getElementById("packer").value=lCSSCoder[s](document.getElementById("code").value)}
</script>
