<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .node-label { font-size: 14px; font-weight: 600; fill: #111827; }
    .sub-label { font-size: 11px; font-weight: 400; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" class="title">生产环境部署架构</text>

  <!-- User Browser -->
  <rect x="55" y="60" width="160" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="88" text-anchor="middle" class="node-label">用户浏览器</text>
  <text x="135" y="108" text-anchor="middle" class="sub-label">HTTPS 请求</text>
  <path d="M 218 95 L 270 95" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Nginx -->
  <rect x="275" y="60" width="190" height="70" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="88" text-anchor="middle" class="node-label">Nginx 反向代理</text>
  <text x="370" y="108" text-anchor="middle" class="sub-label">SSL 终结 · 静态文件 · 负载均衡</text>

  <!-- Branch to workers -->
  <path d="M 465 85 L 535 85" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <line x1="538" y1="65" x2="538" y2="155" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Worker 1 -->
  <line x1="538" y1="70" x2="585" y2="70" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="590" y="52" width="170" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="75" text-anchor="middle" class="node-label">Gunicorn Worker 1</text>

  <!-- Worker 2 -->
  <line x1="538" y1="110" x2="585" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="590" y="92" width="170" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="115" text-anchor="middle" class="node-label">Gunicorn Worker 2</text>

  <!-- Worker 3 -->
  <line x1="538" y1="150" x2="585" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="590" y="132" width="170" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="155" text-anchor="middle" class="node-label">Gunicorn Worker 3</text>

  <!-- Worker N -->
  <text x="620" y="190" class="sub-label">··· 更多 Worker ···</text>

  <!-- Arrow to Flask -->
  <path d="M 675 200 L 675 230" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Flask App -->
  <rect x="525" y="235" width="300" height="46" rx="8" fill="#1e40af" filter="url(#shadow)"/>
  <text x="675" y="263" text-anchor="middle" fill="#ffffff" class="node-label">Flask 应用（app.py）</text>

  <!-- 各组件职责 -->
  <rect x="55" y="295" width="860" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="75" y="316" font-size="12" font-weight="600" fill="#374151">各组件职责</text>

  <!-- row 1: Nginx -->
  <rect x="75" y="330" width="10" height="10" rx="2" fill="#bfdbfe"/>
  <text x="95" y="339" font-size="12" fill="#4b5563">Nginx：静态文件直接返回，动态请求代理转发，HTTPS 加密</text>

  <!-- row 2: Gunicorn -->
  <rect x="75" y="350" width="10" height="10" rx="2" fill="#d1d5db"/>
  <text x="95" y="359" font-size="12" fill="#4b5563">Gunicorn：多 Worker 进程处理并发，崩溃自动重启</text>

  <!-- row 3: Flask -->
  <rect x="75" y="370" width="10" height="10" rx="2" fill="#1e40af"/>
  <text x="95" y="379" font-size="12" fill="#4b5563">Flask：处理业务逻辑，返回响应</text>

  <!-- 警告提示 -->
  <rect x="120" y="400" width="720" height="32" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="480" y="421" text-anchor="middle" font-size="12" fill="#92400e">生产环境绝不能使用 flask run 或 app.run() —— 它们仅适用于本地开发调试</text>

</svg>