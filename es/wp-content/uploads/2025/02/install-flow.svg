<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">INSTALLATION FLOW</text>

  <!-- ===== Arrows (before boxes) ===== -->
  <path d="M384,124 L152,124 L152,224" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M576,124 L808,124 L808,224" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="164" x2="480" y2="224" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M152,320 L152,368 L468,368" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M808,320 L808,368 L492,368" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="320" x2="480" y2="360" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="376" x2="480" y2="400" stroke="#b5523a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- ===== Arrow labels (masked) ===== -->
  <rect x="236" y="112" width="64" height="14" rx="2" fill="#faf7f2"/>
  <text x="268" y="123" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">macOS</text>
  <rect x="448" y="180" width="64" height="14" rx="2" fill="#faf7f2"/>
  <text x="480" y="191" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">Windows</text>
  <rect x="660" y="112" width="64" height="14" rx="2" fill="#faf7f2"/>
  <text x="692" y="123" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">Linux</text>

  <!-- ===== Decision diamond ===== -->
  <polygon points="480,84 576,124 480,164 384,124" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="480" y="129" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">你的系统</text>

  <!-- ===== macOS node ===== -->
  <rect x="36" y="224" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="44" y="232" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="60" y="241" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DMG</text>
  <text x="152" y="268" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">官方安装包</text>
  <text x="152" y="288" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">拖入 Applications</text>
  <text x="152" y="304" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">需 macOS 14+</text>

  <!-- ===== Windows node ===== -->
  <rect x="364" y="224" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="372" y="232" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="388" y="241" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">EXE</text>
  <text x="480" y="268" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">OllamaSetup.exe</text>
  <text x="480" y="288" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">免管理员 · 装用户目录</text>
  <text x="480" y="304" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">需 Windows 10 22H2+</text>

  <!-- ===== Linux node ===== -->
  <rect x="692" y="224" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="700" y="232" width="24" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="712" y="241" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SH</text>
  <text x="808" y="268" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">一键安装脚本</text>
  <text x="808" y="288" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">install.sh 自动装依赖</text>
  <text x="808" y="304" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">服务器建议注册 systemd</text>

  <!-- ===== Merge dot ===== -->
  <circle cx="480" cy="368" r="4" fill="#1c1917"/>

  <!-- ===== Verify node（focal） ===== -->
  <rect x="364" y="400" width="232" height="64" rx="20" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="384" y="408" width="40" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
  <text x="404" y="417" fill="#b5523a" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>
  <text x="480" y="436" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">ollama -v</text>
  <text x="480" y="452" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">打印版本号即安装成功</text>

  <!-- ===== Legend ===== -->
  <line x1="36" y1="496" x2="924" y2="496" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="36" y="512" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <polygon points="46,524 56,529 46,534 36,529" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="64" y="532" fill="#57534e" font-size="8.5">选择平台</text>
  <rect x="156" y="524" width="14" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="178" y="532" fill="#57534e" font-size="8.5">安装方式</text>
  <rect x="272" y="524" width="14" height="10" rx="2" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="294" y="532" fill="#57534e" font-size="8.5">验证安装</text>
</svg>
