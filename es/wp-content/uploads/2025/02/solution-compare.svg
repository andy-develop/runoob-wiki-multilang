<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">DEPLOYMENT OPTIONS</text>

  <!-- ===== 列 1：云端大模型 API（外部） ===== -->
  <rect x="36" y="88" width="280" height="304" rx="8" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="176" y="116" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">云端大模型 API</text>
  <text x="176" y="134" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">OPENAI · CLAUDE · GEMINI</text>
  <line x1="52" y1="148" x2="300" y2="148" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="52" y="176" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">DATA</text>
  <text x="52" y="192" fill="#1c1917" font-size="10">数据出域，存于服务商</text>
  <text x="52" y="220" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">COMPUTE</text>
  <text x="52" y="236" fill="#1c1917" font-size="10">服务商数据中心</text>
  <text x="52" y="264" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">COST</text>
  <text x="52" y="280" fill="#1c1917" font-size="10">按 Token 计费</text>
  <text x="52" y="308" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">OFFLINE</text>
  <text x="52" y="324" fill="#1c1917" font-size="10">不可用</text>
  <text x="52" y="352" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">FOR</text>
  <text x="52" y="368" fill="#1c1917" font-size="10">数据不敏感、要顶级模型</text>

  <!-- ===== 列 2：Ollama 本地（focal） ===== -->
  <rect x="340" y="88" width="280" height="304" rx="8" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="480" y="116" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">Ollama 本地运行</text>
  <text x="480" y="134" fill="#b5523a" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">本书主线</text>
  <line x1="356" y1="148" x2="604" y2="148" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="356" y="176" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">DATA</text>
  <text x="356" y="192" fill="#1c1917" font-size="10">数据不出本机</text>
  <text x="356" y="220" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">COMPUTE</text>
  <text x="356" y="236" fill="#1c1917" font-size="10">本机 CPU / GPU</text>
  <text x="356" y="264" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">COST</text>
  <text x="356" y="280" fill="#1c1917" font-size="10">免费，无按量费用</text>
  <text x="356" y="308" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">OFFLINE</text>
  <text x="356" y="324" fill="#1c1917" font-size="10">完全可用</text>
  <text x="356" y="352" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">FOR</text>
  <text x="356" y="368" fill="#1c1917" font-size="10">隐私、开发、离线场景</text>

  <!-- ===== 列 3：Ollama Cloud ===== -->
  <rect x="644" y="88" width="280" height="304" rx="8" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="784" y="116" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">Ollama Cloud</text>
  <text x="784" y="134" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">:CLOUD 标签模型</text>
  <line x1="660" y1="148" x2="908" y2="148" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="660" y="176" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">DATA</text>
  <text x="660" y="192" fill="#1c1917" font-size="10">经 Ollama 云端处理</text>
  <text x="660" y="220" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">COMPUTE</text>
  <text x="660" y="236" fill="#1c1917" font-size="10">Ollama 云端集群</text>
  <text x="660" y="264" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">COST</text>
  <text x="660" y="280" fill="#1c1917" font-size="10">官方定价，按用量</text>
  <text x="660" y="308" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">OFFLINE</text>
  <text x="660" y="324" fill="#1c1917" font-size="10">需联网</text>
  <text x="660" y="352" fill="#78716c" font-size="7.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">FOR</text>
  <text x="660" y="368" fill="#1c1917" font-size="10">本地算力不足、临时用大模型</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="432" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">三者可以混搭：本地为主，大任务按需上云</text>
</svg>
