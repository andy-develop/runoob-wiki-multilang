<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">LOCAL / CLOUD HYBRID FLOW</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="216" y1="232" x2="300" y2="232" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="540" y1="196" x2="724" y2="144" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M540,268 L588,268 L588,336 L724,336" fill="none" stroke="#b5523a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

  <!-- ===== 箭头标签 ===== -->
  <rect x="216" y="212" width="88" height="14" rx="2" fill="#faf7f2"/>
  <text x="260" y="223" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">同一套调用</text>
  <rect x="592" y="152" width="88" height="14" rx="2" fill="#faf7f2"/>
  <text x="636" y="163" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">本地标签</text>
  <rect x="580" y="296" width="96" height="14" rx="2" fill="#faf7f2"/>
  <text x="628" y="307" fill="#b5523a" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">:cloud 标签</text>

  <!-- ===== 请求 ===== -->
  <rect x="36" y="188" width="180" height="88" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="126" y="224" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">你的调用</text>
  <text x="126" y="244" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">CLI · SDK · API</text>

  <!-- ===== 本地服务（focal） ===== -->
  <rect x="300" y="164" width="240" height="136" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="420" y="204" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama 本地服务</text>
  <text x="420" y="224" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">localhost:11434</text>
  <text x="420" y="248" fill="#57534e" font-size="9.5" text-anchor="middle">统一入口 · 自动完成云端鉴权</text>
  <text x="420" y="270" fill="#78716c" font-size="9.5" text-anchor="middle">按模型名后缀决定去向</text>

  <!-- ===== 本地模型 ===== -->
  <rect x="724" y="108" width="200" height="72" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="824" y="140" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">本地模型</text>
  <text x="824" y="160" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">本机 GPU · 数据不出设备</text>

  <!-- ===== Ollama Cloud ===== -->
  <rect x="724" y="300" width="200" height="72" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="824" y="332" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama 云端</text>
  <text x="824" y="352" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">官方 GPU 集群 · 需登录账号</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="436" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">同一个 API 地址、同一套工具链，只有模型名差一个后缀</text>
</svg>
