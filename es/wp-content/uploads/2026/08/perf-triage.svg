<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">PERFORMANCE TRIAGE</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="480" y1="144" x2="480" y2="156" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360,200 L152,200 L152,320" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="244" x2="480" y2="320" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M600,200 L808,200 L808,320" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 箭头标签 ===== -->
  <rect x="96" y="188" width="88" height="14" rx="2" fill="#faf7f2"/>
  <text x="140" y="199" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">100% CPU</text>
  <rect x="448" y="272" width="64" height="14" rx="2" fill="#faf7f2"/>
  <text x="480" y="283" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">CPU/GPU</text>
  <rect x="744" y="188" width="80" height="14" rx="2" fill="#faf7f2"/>
  <text x="784" y="199" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">100% GPU</text>

  <!-- ===== 起点 ===== -->
  <rect x="364" y="88" width="232" height="56" rx="20" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="480" y="120" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">模型响应慢</text>

  <!-- ===== 决策 ===== -->
  <polygon points="480,156 600,200 480,244 360,200" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="480" y="205" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">ollama ps 看哪列？</text>

  <!-- ===== 分支 1：全 CPU ===== -->
  <rect x="36" y="320" width="232" height="112" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="44" y="328" width="72" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="80" y="337" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO VRAM</text>
  <text x="152" y="360" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">显存完全不够</text>
  <text x="152" y="384" fill="#57534e" font-size="9.5" text-anchor="middle">换更小规格标签</text>
  <text x="152" y="404" fill="#57534e" font-size="9.5" text-anchor="middle">或用 create 量化压体积</text>

  <!-- ===== 分支 2：混合 ===== -->
  <rect x="364" y="320" width="232" height="112" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="372" y="328" width="80" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
  <text x="412" y="337" fill="#b5523a" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SPLIT LOAD</text>
  <text x="480" y="360" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">显存不足被切分</text>
  <text x="480" y="384" fill="#57534e" font-size="9.5" text-anchor="middle">调低 num_ctx 上下文</text>
  <text x="480" y="404" fill="#57534e" font-size="9.5" text-anchor="middle">Flash Attention + KV 量化</text>

  <!-- ===== 分支 3：满血 ===== -->
  <rect x="692" y="320" width="232" height="112" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="700" y="328" width="72" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="736" y="337" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">FULL GPU</text>
  <text x="808" y="360" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">已满血，还慢</text>
  <text x="808" y="384" fill="#57534e" font-size="9.5" text-anchor="middle">换更小的参数规模</text>
  <text x="808" y="404" fill="#57534e" font-size="9.5" text-anchor="middle">检查并发与队列积压</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="472" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">每次只改一个变量，用 ollama ps 和 tokens/s 观察变化</text>

  <!-- ===== Legend ===== -->
  <line x1="36" y1="504" x2="924" y2="504" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="36" y="520" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <polygon points="56,534 68,540 56,546 44,540" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="76" y="544" fill="#57534e" font-size="8.5">检查决策</text>
  <rect x="176" y="534" width="14" height="10" rx="2" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="198" y="544" fill="#57534e" font-size="8.5">最常见瓶颈</text>
</svg>
