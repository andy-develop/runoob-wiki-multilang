<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="agentArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="agentArrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="agentArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Agent 智能体工作循环</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#6b7280">思考 → 调用工具 → 观察结果 → 反思，循环直至完成任务</text>

  <!-- 输入：用户任务 -->
  <rect x="30" y="260" width="120" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="90" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">用户任务</text>
  <text x="90" y="305" text-anchor="middle" font-size="10.5" fill="#c2410c">自然语言下达</text>

  <!-- 用户任务 → 规划：智能体接收任务后，第一步是规划 -->
  <path d="M 150 275 Q 160 225 206 215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#agentArrowGray)"/>

  <!-- 输出：最终结果 -->
  <rect x="850" y="260" width="120" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="910" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">任务完成</text>
  <text x="910" y="305" text-anchor="middle" font-size="10.5" fill="#059669">输出最终结果</text>

  <!-- 中心：LLM 推理核心 -->
  <circle cx="500" cy="290" r="62" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="283" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">LLM</text>
  <text x="500" y="304" text-anchor="middle" font-size="11" fill="#6d28d9">推理核心</text>

  <!-- 环形节点 1：规划（左） -->
  <rect x="190" y="150" width="160" height="66" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="270" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">规划 Plan</text>
  <text x="270" y="199" text-anchor="middle" font-size="10.5" fill="#64748b">拆解任务为多个步骤</text>

  <!-- 环形节点 2：调用工具（上） -->
  <rect x="420" y="100" width="160" height="66" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="500" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">调用工具 Act</text>
  <text x="500" y="149" text-anchor="middle" font-size="10.5" fill="#64748b">Function Calling / MCP</text>

  <!-- 环形节点 3：执行（右） -->
  <rect x="650" y="150" width="160" height="66" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="730" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">执行 Execute</text>
  <text x="730" y="199" text-anchor="middle" font-size="10.5" fill="#64748b">搜索 / 代码 / 数据库</text>

  <!-- 环形节点 4：观察反思（下） -->
  <rect x="420" y="420" width="160" height="66" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="500" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">观察反思 Observe</text>
  <text x="500" y="469" text-anchor="middle" font-size="10.5" fill="#64748b">判断是否完成 / 下一步</text>

  <!-- 中心 LLM 与各节点连线（虚线，表示由 LLM 驱动每一步） -->
  <line x1="340" y1="183" x2="450" y2="262" stroke="#8b5cf6" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="500" y1="166" x2="500" y2="228" stroke="#8b5cf6" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="660" y1="183" x2="550" y2="262" stroke="#8b5cf6" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="500" y1="352" x2="500" y2="420" stroke="#8b5cf6" stroke-width="1.3" stroke-dasharray="4 4"/>

  <!-- 循环箭头：规划 → 调用工具 → 执行 → 观察反思 → 规划 -->
  <!-- 规划(右上角 350,170) → 调用工具(左下 420,150) -->
  <path d="M 350 168 Q 400 130 420 133" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#agentArrow)"/>
  <!-- 调用工具(右下 580,150) → 执行(左上 650,170) -->
  <path d="M 580 150 Q 625 130 650 168" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#agentArrow)"/>
  <!-- 执行(下 730,216) → 观察反思(右 580,453) -->
  <path d="M 730 216 Q 760 360 580 453" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#agentArrow)"/>
  <!-- 观察反思(左 420,453) → 规划(下 270,216) -->
  <path d="M 420 453 Q 200 400 250 216" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#agentArrow)"/>

  <!-- 完成时输出：中心 → 最终结果 -->
  <line x1="562" y1="290" x2="846" y2="290" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#agentArrowGreen)"/>
  <text x="704" y="282" text-anchor="middle" font-size="10.5" fill="#059669">任务完成时输出</text>

  <!-- 图例 -->
  <g transform="translate(30, 525)">
    <line x1="0" y1="6" x2="28" y2="6" stroke="#2563eb" stroke-width="2" marker-end="url(#agentArrow)"/>
    <text x="36" y="10" fill="#6b7280" font-size="11">思考循环（ReAct）</text>
    <line x1="160" y1="6" x2="188" y2="6" stroke="#8b5cf6" stroke-width="1.3" stroke-dasharray="4 4"/>
    <text x="196" y="10" fill="#6b7280" font-size="11">由 LLM 驱动每一步</text>
    <line x1="340" y1="6" x2="368" y2="6" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#agentArrowGreen)"/>
    <text x="376" y="10" fill="#6b7280" font-size="11">完成并输出</text>
  </g>
</svg>
