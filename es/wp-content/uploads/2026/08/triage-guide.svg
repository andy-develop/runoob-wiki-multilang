<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">TROUBLESHOOTING GUIDE</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="480" y1="128" x2="480" y2="148" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M356,204 L152,204 L152,232" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M436,224 L368,272" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M524,224 L592,272" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M604,204 L808,204 L808,232" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 箭头标签 ===== -->
  <rect x="96" y="188" width="104" height="14" rx="2" fill="#faf7f2"/>
  <text x="148" y="199" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">连不上 / 拉不动</text>
  <rect x="328" y="240" width="104" height="14" rx="2" fill="#faf7f2"/>
  <text x="380" y="251" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">内存 / 显存不足</text>
  <rect x="528" y="240" width="112" height="14" rx="2" fill="#faf7f2"/>
  <text x="584" y="251" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">GPU 没在工作</text>
  <rect x="756" y="188" width="104" height="14" rx="2" fill="#faf7f2"/>
  <text x="808" y="199" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">响应慢 / 503</text>

  <!-- ===== 起点 ===== -->
  <rect x="364" y="80" width="232" height="48" rx="20" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="480" y="110" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">遇到异常</text>

  <!-- ===== 决策 ===== -->
  <polygon points="480,148 604,204 480,260 356,204" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="480" y="200" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">先看日志</text>
  <text x="480" y="219" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">再按症状分流</text>

  <!-- ===== 分支 1：连接类 ===== -->
  <rect x="36" y="232" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="152" y="264" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">连接与下载</text>
  <text x="152" y="288" fill="#57534e" font-size="9" text-anchor="middle">服务是否在跑 · 端口是否占用</text>
  <text x="152" y="308" fill="#57534e" font-size="9" text-anchor="middle">代理 HTTPS_PROXY 是否正确</text>

  <!-- ===== 分支 2：资源类 ===== -->
  <rect x="264" y="288" width="232" height="96" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="380" y="320" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">资源不足</text>
  <text x="380" y="344" fill="#57534e" font-size="9" text-anchor="middle">ollama ps 看占用 · 换小规格</text>
  <text x="380" y="364" fill="#57534e" font-size="9" text-anchor="middle">量化压体积 · 降上下文</text>

  <!-- ===== 分支 3：GPU 类 ===== -->
  <rect x="464" y="288" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="580" y="320" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">GPU 异常</text>
  <text x="580" y="344" fill="#57534e" font-size="9" text-anchor="middle">驱动版本 · 容器 runtime</text>
  <text x="580" y="364" fill="#57534e" font-size="9" text-anchor="middle">日志中的发现失败错误码</text>

  <!-- ===== 分支 4：性能类 ===== -->
  <rect x="692" y="232" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="808" y="264" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">性能与过载</text>
  <text x="808" y="288" fill="#57534e" font-size="9" text-anchor="middle">503 查队列 · 慢查混合切分</text>
  <text x="808" y="308" fill="#57534e" font-size="9" text-anchor="middle">并发与 keep_alive 策略</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="440" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">八成的问题，日志里已经写好了答案</text>
</svg>
