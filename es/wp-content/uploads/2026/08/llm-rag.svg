<svg viewBox="0 0 1180 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="ragArrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ragArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="590" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">RAG 检索增强生成流程</text>
  <text x="590" y="55" text-anchor="middle" font-size="12" fill="#6b7280">先检索真实资料，再让模型基于资料生成回答</text>

  <!-- 两条泳道标签 -->
  <rect x="20" y="100" width="70" height="54" rx="6" fill="#64748b"/>
  <text x="55" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">离线</text>
  <text x="55" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">建库</text>

  <rect x="20" y="300" width="70" height="54" rx="6" fill="#2563eb"/>
  <text x="55" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">在线</text>
  <text x="55" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">查询</text>

  <!-- ========== 顶部建库泳道 ========== -->
  <rect x="110" y="100" width="170" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="195" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">知识库文档</text>
  <text x="195" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">PDF / 网页 / 数据库</text>

  <line x1="280" y1="127" x2="314" y2="127" stroke="#64748b" stroke-width="2" marker-end="url(#ragArrowGray)"/>

  <rect x="316" y="100" width="170" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="401" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">文本切分</text>
  <text x="401" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">按段落切成小块 chunk</text>

  <line x1="486" y1="127" x2="520" y2="127" stroke="#64748b" stroke-width="2" marker-end="url(#ragArrowGray)"/>

  <rect x="522" y="100" width="170" height="54" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="607" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#155e75">向量化 Embedding</text>
  <text x="607" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">文本 → 向量（数字）</text>

  <line x1="692" y1="127" x2="726" y2="127" stroke="#64748b" stroke-width="2" marker-end="url(#ragArrowGray)"/>

  <!-- ========== 中央向量数据库（共享，纵向贯通） ========== -->
  <rect x="728" y="100" width="200" height="254" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="828" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">向量数据库</text>
  <text x="828" y="237" text-anchor="middle" font-size="11" fill="#0369a1">存储所有文档向量</text>
  <text x="828" y="255" text-anchor="middle" font-size="11" fill="#0369a1">按语义相似度检索</text>
  <text x="828" y="285" text-anchor="middle" font-size="10.5" fill="#64748b">Pinecone</text>
  <text x="828" y="303" text-anchor="middle" font-size="10.5" fill="#64748b">Milvus / Chroma</text>

  <!-- ========== 底部查询泳道 ========== -->
  <rect x="110" y="300" width="170" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="195" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">用户提问</text>
  <text x="195" y="342" text-anchor="middle" font-size="10.5" fill="#64748b">例如：如何部署模型？</text>

  <line x1="280" y1="327" x2="314" y2="327" stroke="#2563eb" stroke-width="2" marker-end="url(#ragArrowBlue)"/>

  <rect x="316" y="300" width="170" height="54" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="401" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#155e75">向量化 Embedding</text>
  <text x="401" y="342" text-anchor="middle" font-size="10.5" fill="#64748b">问题 → 向量</text>

  <!-- 问题向量 → 向量数据库检索 -->
  <path d="M 486 327 C 600 327 600 327 724 327" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ragArrowBlue)"/>
  <text x="605" y="318" text-anchor="middle" font-size="10.5" fill="#2563eb">相似度检索</text>

  <!-- 向量数据库 → 检索结果 -->
  <line x1="928" y1="327" x2="962" y2="327" stroke="#2563eb" stroke-width="2" marker-end="url(#ragArrowBlue)"/>

  <rect x="964" y="300" width="186" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1057" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">检索结果 Top-K</text>
  <text x="1057" y="342" text-anchor="middle" font-size="10.5" fill="#64748b">最相关的文档片段</text>

  <!-- 检索结果 → 拼接上下文（折线向下右） -->
  <path d="M 1057 354 L 1057 392 L 607 392 L 607 416" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ragArrowBlue)"/>
  <text x="830" y="384" text-anchor="middle" font-size="10.5" fill="#2563eb">拼接到 Prompt</text>

  <!-- LLM 生成回答 -->
  <rect x="430" y="418" width="354" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="607" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">LLM 基于检索资料生成回答</text>
  <text x="607" y="462" text-anchor="middle" font-size="10.5" fill="#64748b">问题 + 检索到的真实资料 → 有依据的回答（减少幻觉）</text>
</svg>
