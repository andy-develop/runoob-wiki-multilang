<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300" width="750" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "SF Mono","Fira Code","Cascadia Code","Courier New","Microsoft YaHei","SimHei",monospace; }
  </style>
  <rect width="750" height="300" fill="url(#bg)"/>

  <text x="375" y="28" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">数组内存布局 — int arr[5] = {10, 20, 30, 40, 50}</text>

  <rect x="60" y="55" width="120" height="70" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="120" y="83" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">10</text>
  <text x="120" y="103" text-anchor="middle" fill="#94a3b8" font-size="10">arr[0]</text>
  <text x="120" y="119" text-anchor="middle" fill="#475569" font-size="9">0x1000</text>
  <rect x="190" y="55" width="120" height="70" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="83" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">20</text>
  <text x="250" y="103" text-anchor="middle" fill="#94a3b8" font-size="10">arr[1]</text>
  <text x="250" y="119" text-anchor="middle" fill="#475569" font-size="9">0x1004</text>
  <rect x="320" y="55" width="120" height="70" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="83" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">30</text>
  <text x="380" y="103" text-anchor="middle" fill="#94a3b8" font-size="10">arr[2]</text>
  <text x="380" y="119" text-anchor="middle" fill="#475569" font-size="9">0x1008</text>
  <rect x="450" y="55" width="120" height="70" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <text x="510" y="83" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">40</text>
  <text x="510" y="103" text-anchor="middle" fill="#94a3b8" font-size="10">arr[3]</text>
  <text x="510" y="119" text-anchor="middle" fill="#475569" font-size="9">0x100C</text>
  <rect x="580" y="55" width="120" height="70" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="83" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">50</text>
  <text x="640" y="103" text-anchor="middle" fill="#94a3b8" font-size="10">arr[4]</text>
  <text x="640" y="119" text-anchor="middle" fill="#475569" font-size="9">0x1010</text>
  <line x1="180" y1="90" x2="190" y2="90" stroke="#475569" stroke-width="1"/>
  <polygon points="190,87 190,93 196,90" fill="#475569"/>
  <line x1="310" y1="90" x2="320" y2="90" stroke="#475569" stroke-width="1"/>
  <polygon points="320,87 320,93 326,90" fill="#475569"/>
  <line x1="440" y1="90" x2="450" y2="90" stroke="#475569" stroke-width="1"/>
  <polygon points="450,87 450,93 456,90" fill="#475569"/>
  <line x1="570" y1="90" x2="580" y2="90" stroke="#475569" stroke-width="1"/>
  <polygon points="580,87 580,93 586,90" fill="#475569"/>
  <text x="375" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">每个 int 占用 4 字节 (sizeof(int) = 4)</text>

  <rect x="130" y="175" width="490" height="45" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="375" y="198" text-anchor="middle" fill="#eab308" font-size="12">访问公式：arr[i] 的地址 = 起始地址 + i × sizeof(int)</text>
  <text x="375" y="214" text-anchor="middle" fill="#94a3b8" font-size="10">例：arr[3] 地址 = 0x1000 + 3×4 = 0x100C，存储值为 40</text>

  <line x1="60" y1="245" x2="60" y2="260" stroke="#7c3aed" stroke-width="1"/>
  <text x="60" y="274" text-anchor="middle" fill="#7c3aed" font-size="10">下标: 0</text>
  <line x1="190" y1="245" x2="190" y2="260" stroke="#3b82f6" stroke-width="1"/>
  <text x="190" y="274" text-anchor="middle" fill="#3b82f6" font-size="10">下标: 1</text>
  <line x1="320" y1="245" x2="320" y2="260" stroke="#10b981" stroke-width="1"/>
  <text x="320" y="274" text-anchor="middle" fill="#10b981" font-size="10">下标: 2</text>
  <line x1="450" y1="245" x2="450" y2="260" stroke="#ea580c" stroke-width="1"/>
  <text x="450" y="274" text-anchor="middle" fill="#ea580c" font-size="10">下标: 3</text>
  <line x1="580" y1="245" x2="580" y2="260" stroke="#7c3aed" stroke-width="1"/>
  <text x="580" y="274" text-anchor="middle" fill="#7c3aed" font-size="10">下标: 4</text>
  <line x1="60" y1="285" x2="580" y2="285" stroke="#475569" stroke-width="0.5"/>
  <text x="320" y="296" text-anchor="middle" fill="#475569" font-size="9">连续内存区域（低地址 → 高地址）</text>
</svg>