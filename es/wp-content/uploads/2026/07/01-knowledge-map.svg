<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" width="1100" height="950">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-down" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: "SF Mono","Fira Code","Cascadia Code","Courier New","Microsoft YaHei","SimHei",monospace; }
    .title-main { font-size: 20px; font-weight: 700; fill: #e2e8f0; }
    .title-layer { font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .label { font-size: 13px; fill: #e2e8f0; }
    .label-sub { font-size: 11px; fill: #94a3b8; }
    .label-muted { font-size: 10px; fill: #64748b; }
  </style>

  <!-- Background -->
  <rect width="1100" height="950" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" class="title-main">C 语言数据结构与算法 - 知识体系全景图</text>

  <!-- ============================================ -->
  <!-- LAYER 1: 入门基础 -->
  <!-- ============================================ -->
  <rect x="40" y="65" width="1020" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="65" width="1020" height="32" rx="8" fill="#1e1b4b"/>
  <rect x="40" y="81" width="1020" height="16" fill="#1e1b4b"/>
  <text x="60" y="86" class="title-layer" fill="#a855f7">入门基础</text>

  <!-- Layer 1 nodes -->
  <rect x="80" y="115" width="280" height="105" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="220" y="142" text-anchor="middle" class="label" fill="#a855f7" font-weight="bold">环境搭建</text>
  <text x="220" y="163" text-anchor="middle" class="label-sub">GCC 编译器安装与配置</text>
  <text x="220" y="183" text-anchor="middle" class="label-sub">VS Code / Code::Blocks / Dev-C++</text>
  <text x="220" y="203" text-anchor="middle" class="label-sub">编译运行第一个 C 程序</text>

  <rect x="410" y="115" width="280" height="105" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <text x="550" y="142" text-anchor="middle" class="label" fill="#f97316" font-weight="bold">算法基础</text>
  <text x="550" y="163" text-anchor="middle" class="label-sub">算法的定义与特性</text>
  <text x="550" y="183" text-anchor="middle" class="label-sub">时间复杂度与空间复杂度</text>
  <text x="550" y="203" text-anchor="middle" class="label-sub">大 O 表示法 (Big O Notation)</text>

  <rect x="740" y="115" width="280" height="105" rx="6" fill="#052e16" stroke="#059669" stroke-width="1.5"/>
  <text x="880" y="142" text-anchor="middle" class="label" fill="#10b981" font-weight="bold">基本概念</text>
  <text x="880" y="163" text-anchor="middle" class="label-sub">数据结构分类（线性/非线性）</text>
  <text x="880" y="183" text-anchor="middle" class="label-sub">抽象数据类型 (ADT)</text>
  <text x="880" y="203" text-anchor="middle" class="label-sub">指针 / 结构体 / 动态内存分配</text>

  <!-- Layer 1→2 arrows -->
  <line x1="220" y1="220" x2="220" y2="280" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="550" y1="220" x2="550" y2="280" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="880" y1="220" x2="880" y2="280" stroke="#059669" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>

  <!-- ============================================ -->
  <!-- LAYER 2: 线性数据结构 -->
  <!-- ============================================ -->
  <rect x="40" y="285" width="1020" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="285" width="1020" height="32" rx="8" fill="#1e1b4b"/>
  <rect x="40" y="301" width="1020" height="16" fill="#1e1b4b"/>
  <text x="60" y="306" class="title-layer" fill="#a855f7">线性数据结构</text>

  <!-- Row 1: 数组→链表→双向链表→循环链表 -->
  <rect x="80" y="335" width="145" height="52" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="152" y="358" text-anchor="middle" class="label" fill="#60a5fa">数组</text>
  <text x="152" y="377" text-anchor="middle" class="label-muted">连续存储 · O(1) 访问</text>

  <text x="237" y="365" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="250" y="335" width="145" height="52" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="322" y="358" text-anchor="middle" class="label" fill="#60a5fa">链表</text>
  <text x="322" y="377" text-anchor="middle" class="label-muted">动态节点 · O(1) 增删</text>

  <text x="407" y="365" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="420" y="335" width="145" height="52" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="492" y="358" text-anchor="middle" class="label" fill="#60a5fa">双向链表</text>
  <text x="492" y="377" text-anchor="middle" class="label-muted">prev + next 指针</text>

  <text x="577" y="365" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="590" y="335" width="145" height="52" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="662" y="358" text-anchor="middle" class="label" fill="#60a5fa">循环链表</text>
  <text x="662" y="377" text-anchor="middle" class="label-muted">首尾相连 · 环形结构</text>

  <!-- Row 2: 栈→表达式解析 | 队列→循环队列→优先队列 -->
  <rect x="80" y="398" width="145" height="46" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="152" y="415" text-anchor="middle" class="label" fill="#a855f7">栈 (Stack)</text>
  <text x="152" y="433" text-anchor="middle" class="label-muted">LIFO · push/pop</text>

  <text x="237" y="423" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="250" y="398" width="165" height="46" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="332" y="415" text-anchor="middle" class="label" fill="#a855f7">表达式解析</text>
  <text x="332" y="433" text-anchor="middle" class="label-muted">中缀转后缀 · 栈求值</text>

  <rect x="490" y="398" width="145" height="46" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
  <text x="562" y="415" text-anchor="middle" class="label" fill="#f97316">队列 (Queue)</text>
  <text x="562" y="433" text-anchor="middle" class="label-muted">FIFO · enqueue/dequeue</text>

  <text x="648" y="423" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="660" y="398" width="145" height="46" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
  <text x="732" y="415" text-anchor="middle" class="label" fill="#f97316">循环队列</text>
  <text x="732" y="433" text-anchor="middle" class="label-muted">取模回绕 · 空间复用</text>

  <text x="818" y="423" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="830" y="398" width="145" height="46" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
  <text x="902" y="415" text-anchor="middle" class="label" fill="#f97316">优先队列</text>
  <text x="902" y="433" text-anchor="middle" class="label-muted">按优先级出队</text>

  <!-- Layer 2→3 arrows -->
  <line x1="350" y1="460" x2="350" y2="520" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="750" y1="460" x2="750" y2="520" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>

  <!-- ============================================ -->
  <!-- LAYER 3: 非线性数据结构 -->
  <!-- ============================================ -->
  <rect x="40" y="525" width="1020" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="525" width="1020" height="32" rx="8" fill="#1e1b4b"/>
  <rect x="40" y="541" width="1020" height="16" fill="#1e1b4b"/>
  <text x="60" y="546" class="title-layer" fill="#a855f7">非线性数据结构</text>

  <!-- 4 boxes for tree, hash, heap, graph -->
  <rect x="70" y="575" width="225" height="108" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="182" y="600" text-anchor="middle" class="label" fill="#a855f7" font-weight="bold">树 (Tree)</text>
  <text x="182" y="621" text-anchor="middle" class="label-sub">二叉树 · 四种遍历</text>
  <text x="182" y="641" text-anchor="middle" class="label-sub">二叉搜索树 (BST)</text>
  <text x="182" y="661" text-anchor="middle" class="label-sub">AVL 平衡树</text>

  <rect x="315" y="575" width="225" height="108" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="427" y="600" text-anchor="middle" class="label" fill="#60a5fa" font-weight="bold">哈希表 (Hash Table)</text>
  <text x="427" y="621" text-anchor="middle" class="label-sub">哈希函数 · 键值映射</text>
  <text x="427" y="641" text-anchor="middle" class="label-sub">链地址法 · 开放寻址法</text>
  <text x="427" y="661" text-anchor="middle" class="label-sub">O(1) 平均查找</text>

  <rect x="560" y="575" width="225" height="108" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <text x="672" y="600" text-anchor="middle" class="label" fill="#f97316" font-weight="bold">堆 (Heap)</text>
  <text x="672" y="621" text-anchor="middle" class="label-sub">最大堆 · 最小堆</text>
  <text x="672" y="641" text-anchor="middle" class="label-sub">上浮 (Sift Up) · 下沉</text>
  <text x="672" y="661" text-anchor="middle" class="label-sub">优先队列底层实现</text>

  <rect x="805" y="575" width="225" height="108" rx="6" fill="#052e16" stroke="#059669" stroke-width="1.5"/>
  <text x="917" y="600" text-anchor="middle" class="label" fill="#10b981" font-weight="bold">图 (Graph)</text>
  <text x="917" y="621" text-anchor="middle" class="label-sub">有向图 · 无向图 · 带权图</text>
  <text x="917" y="641" text-anchor="middle" class="label-sub">邻接矩阵 · 邻接表</text>
  <text x="917" y="661" text-anchor="middle" class="label-sub">DFS · BFS 遍历</text>

  <!-- Layer 3→4 arrows -->
  <line x1="300" y1="700" x2="300" y2="750" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="550" y1="700" x2="550" y2="750" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="800" y1="700" x2="800" y2="750" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>

  <!-- ============================================ -->
  <!-- LAYER 4: 算法专题 -->
  <!-- ============================================ -->
  <rect x="40" y="755" width="1020" height="160" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="755" width="1020" height="32" rx="8" fill="#1e1b4b"/>
  <rect x="40" y="771" width="1020" height="16" fill="#1e1b4b"/>
  <text x="60" y="776" class="title-layer" fill="#a855f7">算法专题</text>

  <rect x="100" y="805" width="270" height="90" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="235" y="832" text-anchor="middle" class="label" fill="#10b981" font-weight="bold">查找技术</text>
  <text x="235" y="852" text-anchor="middle" class="label-sub">线性查找 (O(n))</text>
  <text x="235" y="870" text-anchor="middle" class="label-sub">二分查找 (O(log n)) · 插值查找</text>
  <text x="235" y="888" text-anchor="middle" class="label-sub">各算法适用场景与复杂度对比</text>

  <rect x="415" y="805" width="270" height="90" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="550" y="832" text-anchor="middle" class="label" fill="#f97316" font-weight="bold">排序技术</text>
  <text x="550" y="852" text-anchor="middle" class="label-sub">冒泡 · 选择 · 插入排序 (O(n²))</text>
  <text x="550" y="870" text-anchor="middle" class="label-sub">快速 · 归并 · 堆排序 (O(n log n))</text>
  <text x="550" y="888" text-anchor="middle" class="label-sub">希尔排序 · 稳定性对比</text>

  <rect x="730" y="805" width="270" height="90" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="865" y="832" text-anchor="middle" class="label" fill="#a855f7" font-weight="bold">递归 (Recursion)</text>
  <text x="865" y="852" text-anchor="middle" class="label-sub">基线条件 · 递归条件</text>
  <text x="865" y="870" text-anchor="middle" class="label-sub">斐波那契 · 汉诺塔 · 阶乘</text>
  <text x="865" y="888" text-anchor="middle" class="label-sub">尾递归 · 记忆化优化</text>

  <!-- Legend -->
  <rect x="40" y="925" width="1020" height="20" rx="4" fill="none"/>
  <text x="130" y="939" text-anchor="middle" class="label-muted">基础</text>
  <rect x="170" y="931" width="24" height="12" rx="2" fill="#7c3aed" opacity="0.6"/>
  <text x="230" y="939" text-anchor="middle" class="label-muted">线性</text>
  <rect x="280" y="931" width="24" height="12" rx="2" fill="#3b82f6" opacity="0.6"/>
  <text x="340" y="939" text-anchor="middle" class="label-muted">非线性</text>
  <rect x="400" y="931" width="24" height="12" rx="2" fill="#ea580c" opacity="0.6"/>
  <text x="460" y="939" text-anchor="middle" class="label-muted">算法专题</text>
  <rect x="540" y="931" width="24" height="12" rx="2" fill="#10b981" opacity="0.6"/>
  <text x="670" y="939" text-anchor="middle" class="label-muted">- - - 虚线箭头表示学习路径递进方向</text>

</svg>