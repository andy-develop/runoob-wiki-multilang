<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="returnGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowDown" markerWidth="12" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#a855f7"/>
    </marker>
    <marker id="arrowUp" markerWidth="12" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#4facfe"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="720" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="340" y="45" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="2">智能体（Agent）的核心组成</text>
  <line x1="220" y1="58" x2="460" y2="58" stroke="#4facfe" stroke-width="2" stroke-opacity="0.5"/>

  <!-- ========== USER ========== -->
  <g filter="url(#shadow)">
    <rect x="215" y="80" width="250" height="80" rx="16" fill="url(#userGrad)" opacity="0.15" stroke="url(#userGrad)" stroke-width="2"/>
  </g>
  <!-- User icon -->
  <circle cx="260" cy="112" r="14" fill="none" stroke="#4facfe" stroke-width="2"/>
  <circle cx="260" cy="107" r="5" fill="#4facfe"/>
  <path d="M249,122 Q260,132 271,122" fill="none" stroke="#4facfe" stroke-width="2" stroke-linecap="round"/>
  <text x="290" y="110" fill="#4facfe" font-size="18" font-weight="bold">👤 你（用户）</text>
  <text x="290" y="135" fill="#8ecdfc" font-size="13">用自然语言提出需求</text>
  <text x="290" y="152" fill="#8ecdfc" font-size="12" opacity="0.7">"帮我查一下明天的天气"</text>

  <!-- ========== ARROW 1: User → Brain ========== -->
  <line x1="340" y1="162" x2="340" y2="218" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="355" y="198" fill="#4facfe" font-size="12" font-weight="bold">说话</text>
  <!-- Animated dot -->
  <circle r="4" fill="#4facfe" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" path="M340,162 L340,218"/>
  </circle>

  <!-- ========== BRAIN ========== -->
  <g filter="url(#shadow)">
    <rect x="195" y="222" width="290" height="140" rx="18" fill="url(#brainGrad)" opacity="0.15" stroke="url(#brainGrad)" stroke-width="2"/>
  </g>
  <!-- Brain icon -->
  <text x="230" y="262" font-size="30">🧠</text>
  <text x="270" y="262" fill="#c084fc" font-size="18" font-weight="bold">大脑（大模型 LLM）</text>

  <!-- Brain steps -->
  <g>
    <circle cx="228" cy="292" r="10" fill="#a855f7" opacity="0.3"/>
    <text x="228" y="296" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">1</text>
    <text x="248" y="297" fill="#d8b4fe" font-size="13">听懂你说的话（理解意图）</text>
  </g>
  <g>
    <circle cx="228" cy="318" r="10" fill="#a855f7" opacity="0.3"/>
    <text x="228" y="322" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">2</text>
    <text x="248" y="323" fill="#d8b4fe" font-size="13">决定该用哪个技能（选择 Skill）</text>
  </g>
  <g>
    <circle cx="228" cy="344" r="10" fill="#a855f7" opacity="0.3"/>
    <text x="228" y="348" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">3</text>
    <text x="248" y="349" fill="#d8b4fe" font-size="13">把结果整理成你能听懂的话</text>
  </g>

  <!-- ========== ARROW 2: Brain → Skills ========== -->
  <line x1="340" y1="364" x2="340" y2="420" stroke="url(#arrowGrad2)" stroke-width="2.5" marker-end="url(#arrowDown)"/>
  <text x="355" y="400" fill="#f97316" font-size="12" font-weight="bold">调用</text>
  <circle r="4" fill="#f97316" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" path="M340,364 L340,420"/>
  </circle>

  <!-- ========== SKILLS ========== -->
  <g filter="url(#shadow)">
    <rect x="95" y="424" width="490" height="170" rx="18" fill="url(#skillGrad)" opacity="0.1" stroke="url(#skillGrad)" stroke-width="2"/>
  </g>
  <text x="340" y="452" text-anchor="middle" fill="#fb923c" font-size="18" font-weight="bold">🧰 技能库（Skills）</text>

  <!-- Skill cards -->
  <g>
    <rect x="115" y="466" width="135" height="44" rx="10" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="142" y="485" font-size="16">🌤</text>
    <text x="165" y="492" fill="#fdba74" font-size="12">查天气</text>
  </g>
  <g>
    <rect x="262" y="466" width="135" height="44" rx="10" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="289" y="485" font-size="16">🔍</text>
    <text x="312" y="492" fill="#fdba74" font-size="12">搜索信息</text>
  </g>
  <g>
    <rect x="409" y="466" width="135" height="44" rx="10" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="436" y="485" font-size="16">📧</text>
    <text x="459" y="492" fill="#fdba74" font-size="12">发邮件</text>
  </g>
  <g>
    <rect x="115" y="520" width="135" height="44" rx="10" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="142" y="539" font-size="16">📊</text>
    <text x="165" y="546" fill="#fdba74" font-size="12">查数据</text>
  </g>
  <g>
    <rect x="262" y="520" width="135" height="44" rx="10" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="289" y="539" font-size="16">💻</text>
    <text x="312" y="546" fill="#fdba74" font-size="12">写代码</text>
  </g>
  <g>
    <rect x="409" y="520" width="135" height="44" rx="10" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="436" y="539" font-size="16">🖼</text>
    <text x="459" y="546" fill="#fdba74" font-size="12">生成图片</text>
  </g>

  <!-- More indicator -->
  <text x="340" y="583" text-anchor="middle" fill="#fdba74" font-size="11" opacity="0.6">··· 还可以无限扩展更多技能</text>

  <!-- ========== RETURN ARROW (right side) ========== -->
  <!-- Vertical return line on the right -->
  <path d="M530,520 L530,120" fill="none" stroke="url(#returnGrad)" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrowUp)"/>
  <text x="548" y="340" fill="#22c55e" font-size="12" font-weight="bold" transform="rotate(-90,548,340)">把结果返回给你</text>
  <circle r="4" fill="#22c55e" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M530,520 L530,120"/>
  </circle>

  <!-- ========== Bottom summary ========== -->
  <rect x="120" y="620" width="440" height="72" rx="14" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
  <text x="340" y="648" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">💡 一句话理解</text>
  <text x="340" y="672" text-anchor="middle" fill="#94a3b8" font-size="13">大模型 = 大脑（负责想和说）  ·  Skills = 手脚（负责做）</text>
  <text x="340" y="688" text-anchor="middle" fill="#94a3b8" font-size="13" opacity="0.7">两者结合 = 智能体（Agent）</text>

</svg>
