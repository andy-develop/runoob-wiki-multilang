<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runoob Tutorials</title>
<style>
body { font-family: -apple-system, 'PingFang SC', 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f3ee; color: #333; }
.box { text-align: center; padding: 24px; }
.spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #5c9e6e; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.lang-links { margin-top: 24px; }
.lang-links a { display: inline-block; margin: 0 8px; padding: 12px 28px; background: #5c9e6e; color: #fff; text-decoration: none; border-radius: 8px; font-size: 15px; transition: background 0.2s; }
.lang-links a:hover { background: #4a8a5c; }
.tip { margin-top: 16px; font-size: 13px; color: #888; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div>Detecting your language...</div>
  <div class="lang-links">
    <a href="en/">English</a>
    <a href="es/">Español</a>
    <a href="ja/">日本語</a>
  </div>
  <div class="tip">Choose your language</div>
</div>
<script>
(function() {
    // 西语国家列表
    var SPANISH_COUNTRIES = ['ES','MX','AR','CO','PE','VE','CL','EC','GT','CU','BO','DO','HN','PY','SV','NI','CR','PA','UY','GQ'];
    
    // 1. 检查 localStorage 中的语言偏好
    var savedLang = localStorage.getItem('preferred_lang');
    if (savedLang === 'en' || savedLang === 'es' || savedLang === 'ja') {
        window.location.replace(savedLang + '/');
        return;
    }
    
    // 2. 检查浏览器语言
    var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    if (browserLang.startsWith('es')) {
        window.location.replace('es/');
        return;
    }
    if (browserLang.startsWith('ja')) {
        window.location.replace('ja/');
        return;
    }
    
    // 3. IP 地理位置检测
    fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var country = (data.country_code || '').toUpperCase();
            if (SPANISH_COUNTRIES.indexOf(country) >= 0) {
                window.location.replace('es/');
            } else if (country === 'JP') {
                window.location.replace('ja/');
            } else {
                window.location.replace('en/');
            }
        })
        .catch(function() {
            // IP 检测失败，默认英文
            window.location.replace('en/');
        });
    
    // 5秒后强制跳转英文（兜底）
    setTimeout(function() {
        if (document.body) {
            window.location.replace('en/');
        }
    }, 5000);
})();
</script>
</body>
</html>
