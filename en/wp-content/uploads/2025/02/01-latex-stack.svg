<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" style="width:100%;height:auto;">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <rect x="230" y="28" width="500" height="112" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">编辑器（负责写与预览，本身不排版）</text>
  <rect x="262" y="74" width="130" height="34" rx="17" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="327" y="96" text-anchor="middle" font-size="12" fill="#1e40af">Overleaf</text>
  <rect x="406" y="74" width="130" height="34" rx="17" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="471" y="96" text-anchor="middle" font-size="12" fill="#1e40af">TeXstudio</text>
  <rect x="550" y="74" width="130" height="34" rx="17" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="615" y="96" text-anchor="middle" font-size="12" fill="#1e40af">VS Code</text>
  <line x1="480" y1="140" x2="480" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="494" y="156" width="72" height="20" fill="#ffffff" opacity="0.95"/>
  <text x="530" y="170" text-anchor="middle" font-size="12" fill="#2563eb">一键编译</text>
  <rect x="70" y="196" width="820" height="380" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="90" y="224" font-size="13" font-weight="600" fill="#374151">LaTeX 发行版（TeX Live · MiKTeX · MacTeX · TinyTeX）</text>
  <rect x="90" y="240" width="780" height="100" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="130" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="#6b21a8">宏包层</text>
  <rect x="210" y="272" width="92" height="36" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="256" y="295" text-anchor="middle" font-size="12" fill="#7e22ce">ctex</text>
  <rect x="314" y="272" width="100" height="36" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="364" y="295" text-anchor="middle" font-size="12" fill="#7e22ce">amsmath</text>
  <rect x="436" y="272" width="100" height="36" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="486" y="295" text-anchor="middle" font-size="12" fill="#7e22ce">geometry</text>
  <rect x="546" y="272" width="100" height="36" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="596" y="295" text-anchor="middle" font-size="12" fill="#7e22ce">booktabs</text>
  <rect x="656" y="272" width="88" height="36" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="700" y="295" text-anchor="middle" font-size="12" fill="#7e22ce">beamer</text>
  <rect x="756" y="272" width="40" height="36" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="776" y="295" text-anchor="middle" font-size="12" fill="#7e22ce">…</text>
  <rect x="90" y="356" width="780" height="90" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="130" y="406" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">LaTeX 格式</text>
  <text x="280" y="406" font-size="13" fill="#7c2d12">一套命令与排版规则：\section、\frac、\begin{figure} ……</text>
  <rect x="90" y="462" width="780" height="96" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="130" y="515" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">TeX 引擎</text>
  <rect x="250" y="492" width="80" height="36" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1"/>
  <text x="290" y="515" text-anchor="middle" font-size="12" fill="#134e4a">TeX</text>
  <rect x="342" y="492" width="100" height="36" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1"/>
  <text x="392" y="515" text-anchor="middle" font-size="12" fill="#134e4a">pdfTeX</text>
  <rect x="454" y="492" width="90" height="36" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1"/>
  <text x="499" y="515" text-anchor="middle" font-size="12" fill="#134e4a">XeTeX</text>
  <rect x="556" y="492" width="95" height="36" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1"/>
  <text x="603" y="515" text-anchor="middle" font-size="12" fill="#134e4a">LuaTeX</text>
  <text x="480" y="625" text-anchor="middle" font-size="12" fill="#6b7280">发行版 = 引擎 + 格式 + 海量宏包的一次性打包，安装后即可直接编译文档</text>
</svg>