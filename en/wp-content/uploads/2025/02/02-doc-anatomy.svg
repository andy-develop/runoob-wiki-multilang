<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" style="width:100%;height:auto;">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: Menlo, Consolas, 'Courier New', monospace; }
  </style>
  <rect width="960" height="470" fill="#ffffff"/>
  <rect x="70" y="50" width="440" height="330" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="92" cy="74" r="5" fill="#f87171"/>
  <circle cx="112" cy="74" r="5" fill="#fbbf24"/>
  <circle cx="132" cy="74" r="5" fill="#34d399"/>
  <text x="490" y="78" text-anchor="end" font-size="11" fill="#94a3b8">hello.tex</text>
  <text x="95" y="120" font-size="13" fill="#1f2937" class="mono">\documentclass{ctexart}</text>
  <text x="95" y="150" font-size="13" fill="#1f2937" class="mono">\usepackage{geometry}</text>
  <text x="95" y="180" font-size="13" fill="#1f2937" class="mono">\title{我的文档}</text>
  <text x="95" y="210" font-size="13" fill="#1f2937" class="mono">\author{RUNOOB}</text>
  <text x="95" y="244" font-size="13" fill="#1f2937" class="mono">\begin{document}</text>
  <text x="95" y="278" font-size="13" fill="#1f2937" class="mono">正文内容……</text>
  <text x="95" y="312" font-size="13" fill="#1f2937" class="mono">\end{document}</text>
  <path d="M500 108 h12 v120 h-12" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <line x1="512" y1="168" x2="570" y2="168" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="570" y="118" width="330" height="100" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="590" y="146" font-size="14" font-weight="600" fill="#1e40af">导言区（全局设置）</text>
  <text x="590" y="170" font-size="12" fill="#374151">声明文档类、加载宏包、</text>
  <text x="590" y="188" font-size="12" fill="#374151">定义标题作者等元信息</text>
  <path d="M500 236 h12 v90 h-12" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <line x1="512" y1="296" x2="570" y2="296" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="570" y="246" width="330" height="100" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="590" y="274" font-size="14" font-weight="600" fill="#166534">正文区（实际内容）</text>
  <text x="590" y="298" font-size="12" fill="#374151">标题、章节、文字、公式，</text>
  <text x="590" y="316" font-size="12" fill="#374151">真正出现在 PDF 里的部分</text>
  <text x="480" y="432" text-anchor="middle" font-size="12" fill="#6b7280">编译只处理正文区的内容；导言区决定这些内容按什么规则排版</text>
</svg>