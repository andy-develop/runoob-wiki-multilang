<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" style="width:100%;height:auto;">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <rect x="50" y="70" width="230" height="130" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="165" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">.tex 源文件</text>
  <text x="165" y="142" text-anchor="middle" font-size="12" fill="#6b7280">纯文本，任何编辑器都能打开</text>
  <text x="165" y="162" text-anchor="middle" font-size="12" fill="#6b7280">记录内容与排版指令</text>
  <line x1="282" y1="135" x2="344" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="283" y="110" width="60" height="20" fill="#ffffff" opacity="0.95"/>
  <text x="313" y="124" text-anchor="middle" font-size="12" fill="#2563eb">运行编译</text>
  <rect x="350" y="70" width="250" height="130" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="475" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">LaTeX 编译器</text>
  <text x="475" y="142" text-anchor="middle" font-size="12" fill="#6b7280">pdfLaTeX / XeLaTeX</text>
  <text x="475" y="162" text-anchor="middle" font-size="12" fill="#6b7280">LuaLaTeX</text>
  <line x1="602" y1="135" x2="664" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="603" y="110" width="60" height="20" fill="#ffffff" opacity="0.95"/>
  <text x="633" y="124" text-anchor="middle" font-size="12" fill="#2563eb">生成</text>
  <rect x="670" y="70" width="240" height="130" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="790" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">PDF 文档</text>
  <text x="790" y="142" text-anchor="middle" font-size="12" fill="#6b7280">最终排版成品</text>
  <text x="790" y="162" text-anchor="middle" font-size="12" fill="#6b7280">显示效果处处一致</text>
  <text x="480" y="250" text-anchor="middle" font-size="12" fill="#6b7280">提示：带目录、交叉引用的文档需要编译两遍，编号与引用才会正确</text>
</svg>