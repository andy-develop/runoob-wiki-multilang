<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#28A745"/>
    </linearGradient>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#86868B" />
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#A1A1A6" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F5F5F7" />
  <circle cx="300" cy="200" r="400" fill="#E8F0FE" opacity="0.6" filter="blur(100px)" />
  <circle cx="900" cy="600" r="400" fill="#E6E6FA" opacity="0.5" filter="blur(100px)" />

  <g stroke="#86868B" stroke-width="2" fill="none">
    <path d="M 230 220 L 260 220 L 260 270 L 290 270" marker-end="url(#arrowhead)" />
    <path d="M 230 320 L 260 320 L 260 270 L 290 270" />
    <path d="M 470 270 L 520 270" marker-end="url(#arrowhead)" />
    <path d="M 660 270 L 710 270" marker-end="url(#arrowhead)" />
    <path d="M 910 270 L 960 270" marker-end="url(#arrowhead)" />
    <path d="M 590 510 L 590 350" marker-end="url(#arrowhead)" />
  </g>

  <g stroke="#A1A1A6" stroke-width="2" stroke-dasharray="6,6" fill="none">
    <path d="M 780 200 C 780 140, 400 140, 400 200" marker-end="url(#arrowhead-dashed)" />
    <path d="M 780 340 L 780 430 L 130 430 L 130 360" marker-end="url(#arrowhead-dashed)" />
  </g>

  <rect x="300" y="100" width="600" height="340" rx="32" fill="#FFFFFF" fill-opacity="0.5" stroke="#FFFFFF" stroke-width="2" filter="url(#card-shadow)" />
  <text x="600" y="145" font-size="22" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">智能体核心 (AI Agent)</text>

  <rect x="330" y="190" width="140" height="140" rx="20" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="400" y="275" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="inherit">大语言模型</text>
  <text x="400" y="300" font-size="11" font-weight="400" fill="#86868B" text-anchor="middle" font-family="inherit">规划与推理中心</text>

  <rect x="520" y="190" width="140" height="140" rx="20" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="590" y="275" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="inherit">工具调用</text>
  <text x="590" y="300" font-size="11" font-weight="400" fill="#86868B" text-anchor="middle" font-family="inherit">Tool Use / API</text>

  <rect x="710" y="190" width="140" height="140" rx="20" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="780" y="275" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="inherit">反思机制</text>
  <text x="780" y="300" font-size="11" font-weight="400" fill="#86868B" text-anchor="middle" font-family="inherit">Reflection</text>

  <rect x="50" y="185" width="180" height="70" rx="16" fill="#1D1D1F" filter="url(#card-shadow)" />
  <text x="140" y="226" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="inherit">目标输入 (Goal)</text>

  <rect x="50" y="285" width="180" height="70" rx="16" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="140" y="326" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="inherit">记忆模块 (Memory)</text>

  <rect x="970" y="235" width="180" height="70" rx="16" fill="url(#primary-gradient)" filter="url(#card-shadow)" />
  <text x="1060" y="276" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="inherit">最终响应 (Response)</text>

  <text x="600" y="485" font-size="14" font-weight="600" fill="#86868B" text-anchor="middle" font-family="inherit">外部工具与资源 (Tools)</text>
  <rect x="360" y="510" width="480" height="120" rx="24" fill="#FFFFFF" fill-opacity="0.8" stroke="#E5E5EA" filter="url(#card-shadow)" />
  
  <g transform="translate(400, 535)">
    <rect width="190" height="70" rx="12" fill="#F5F5F7" />
    <text x="95" y="35" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="inherit">知识库 (Knowledge)</text>
    <text x="95" y="55" font-size="11" fill="#86868B" text-anchor="middle" font-family="inherit">网络搜索 / 数据库</text>
  </g>

  <g transform="translate(610, 535)">
    <rect width="190" height="70" rx="12" fill="#F5F5F7" />
    <text x="95" y="35" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="inherit">外部软件 (Software)</text>
    <text x="95" y="55" font-size="11" fill="#86868B" text-anchor="middle" font-family="inherit">代码执行 / 计算器</text>
  </g>

  <rect x="540" y="145" width="120" height="24" rx="12" fill="#E8F0FE" opacity="0.8"/>
  <text x="600" y="161" font-size="11" fill="#007AFF" text-anchor="middle" font-family="inherit">迭代优化循环</text>

</svg>
