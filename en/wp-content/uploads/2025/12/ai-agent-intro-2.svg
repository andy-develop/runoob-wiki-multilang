<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    
    <linearGradient id="rect-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9F9FB"/>
    </linearGradient>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#86868B" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F5F5F7" rx="20"/>
  
  <text x="50" y="50" font-size="24" font-weight="700" fill="#1D1D1F" font-family="PingFang SC, sans-serif">核心推理逻辑：从 Prompt 到 Reasoning Loop</text>
  <text x="50" y="80" font-size="14" fill="#86868B" font-family="PingFang SC, sans-serif">普通的 One-shot 响应 vs Agent 的 Iterative 迭代</text>

  <g transform="translate(50, 130)">
    <rect width="220" height="100" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="14" font-weight="600" fill="#FF3B30">One-shot (普通 LLM)</text>
    <text x="20" y="65" font-size="13" fill="#1D1D1F">Input ➔ [LLM] ➔ Output</text>
    <text x="20" y="85" font-size="11" fill="#86868B">单次响应，不具备纠错能力</text>
  </g>

  <g transform="translate(50, 250)">
    <rect width="220" height="100" rx="16" fill="#1D1D1F" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="14" font-weight="600" fill="#34C759">Iterative (Agent 模式)</text>
    <text x="20" y="65" font-size="13" fill="#FFFFFF">ReAct: Reason + Act</text>
    <text x="20" y="85" font-size="11" fill="#A1A1A6">持续思考与工具交互直到完成</text>
  </g>

  <circle cx="650" cy="350" r="60" fill="#FFFFFF" stroke="#007AFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="345" font-size="18" font-weight="700" fill="#1D1D1F" text-anchor="middle">LLM</text>
  <text x="650" y="365" font-size="12" fill="#007AFF" text-anchor="middle">推理大脑</text>

  <g transform="translate(560, 160)">
    <rect width="180" height="70" rx="12" fill="url(#rect-grad)" stroke="#E5E5EA" filter="url(#shadow)"/>
    <text x="90" y="32" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="middle">Thought (思考)</text>
    <text x="90" y="55" font-size="11" fill="#86868B" text-anchor="middle">模型规划：该做什么？</text>
  </g>

  <g transform="translate(780, 420)">
    <rect width="180" height="70" rx="12" fill="url(#rect-grad)" stroke="#E5E5EA" filter="url(#shadow)"/>
    <text x="90" y="32" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="middle">Action (行动)</text>
    <text x="90" y="55" font-size="11" fill="#86868B" text-anchor="middle">调用工具 (如搜索、API)</text>
  </g>

  <g transform="translate(350, 420)">
    <rect width="180" height="70" rx="12" fill="url(#rect-grad)" stroke="#E5E5EA" filter="url(#shadow)"/>
    <text x="90" y="32" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="middle">Observation (观察)</text>
    <text x="90" y="55" font-size="11" fill="#86868B" text-anchor="middle">获取工具反馈的结果</text>
  </g>

  <g fill="none" stroke="#A1A1A6" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 650 290 L 650 240" />
    <path d="M 740 195 C 840 195, 870 320, 870 410" />
    <path d="M 780 455 L 540 455" />
    <path d="M 440 420 C 440 350, 520 350, 580 350" stroke-dasharray="4,4" />
  </g>

  <g transform="translate(800, 100)">
    <path d="M 0 50 L 50 50" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="55" y="20" width="120" height="60" rx="30" fill="#34C759" filter="url(#shadow)"/>
    <text x="115" y="55" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">最终答案</text>
  </g>

  <rect x="610" y="520" width="80" height="24" rx="12" fill="#E8F0FE"/>
  <text x="650" y="536" font-size="11" fill="#007AFF" text-anchor="middle" font-weight="600">Repeat 循环</text>
</svg>
