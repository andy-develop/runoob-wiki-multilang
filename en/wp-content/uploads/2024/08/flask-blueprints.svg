<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .bp-label { font-size: 14px; font-weight: 600; }
    .route-text { font-size: 11px; font-weight: 400; fill: #6b7280; }
    .desc-text { font-size: 10px; font-weight: 400; fill: #9ca3af; }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" class="title">Flask Blueprint 蓝图模块架构</text>

  <!-- Flask App -->
  <rect x="310" y="55" width="340" height="46" rx="10" fill="#2563eb" filter="url(#shadow)"/>
  <text x="480" y="83" text-anchor="middle" fill="#ffffff" class="bp-label">Flask 应用（app.py）</text>

  <!-- Branch lines -->
  <line x1="480" y1="101" x2="480" y2="118" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="160" y1="118" x2="800" y2="118" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="160" y1="118" x2="160" y2="140" stroke="#2563eb" stroke-width="2"/>
  <line x1="480" y1="118" x2="480" y2="140" stroke="#16a34a" stroke-width="2"/>
  <line x1="800" y1="118" x2="800" y2="140" stroke="#ea580c" stroke-width="2"/>

  <!-- Blueprint 1: auth -->
  <rect x="55" y="145" width="210" height="200" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="55" y="145" width="210" height="36" rx="10" fill="#2563eb"/>
  <rect x="55" y="169" width="210" height="12" fill="#2563eb"/>
  <text x="160" y="168" text-anchor="middle" fill="#ffffff" class="bp-label">auth 蓝图</text>
  <text x="160" y="200" text-anchor="middle" class="desc-text" font-weight="600" fill="#4b5563">URL 前缀：/auth</text>

  <rect x="70" y="215" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="160" y="233" text-anchor="middle" class="route-text">GET/POST /login</text>
  <rect x="70" y="250" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="160" y="268" text-anchor="middle" class="route-text">GET/POST /register</text>
  <rect x="70" y="285" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="160" y="303" text-anchor="middle" class="route-text">GET /logout</text>

  <text x="160" y="335" text-anchor="middle" class="desc-text">处理用户认证与注册</text>

  <!-- Blueprint 2: blog -->
  <rect x="375" y="145" width="210" height="200" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="375" y="145" width="210" height="36" rx="10" fill="#16a34a"/>
  <rect x="375" y="169" width="210" height="12" fill="#16a34a"/>
  <text x="480" y="168" text-anchor="middle" fill="#ffffff" class="bp-label">blog 蓝图</text>
  <text x="480" y="200" text-anchor="middle" class="desc-text" font-weight="600" fill="#4b5563">URL 前缀：无（根路径）</text>

  <rect x="390" y="215" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="480" y="233" text-anchor="middle" class="route-text">GET /</text>
  <rect x="390" y="250" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="480" y="268" text-anchor="middle" class="route-text">GET/POST /create</text>
  <rect x="390" y="285" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="480" y="303" text-anchor="middle" class="route-text">GET/POST /&lt;int:id&gt;/update</text>

  <text x="480" y="335" text-anchor="middle" class="desc-text">文章列表与 CRUD 操作</text>

  <!-- Blueprint 3: admin -->
  <rect x="695" y="145" width="210" height="200" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="695" y="145" width="210" height="36" rx="10" fill="#ea580c"/>
  <rect x="695" y="169" width="210" height="12" fill="#ea580c"/>
  <text x="800" y="168" text-anchor="middle" fill="#ffffff" class="bp-label">admin 蓝图</text>
  <text x="800" y="200" text-anchor="middle" class="desc-text" font-weight="600" fill="#4b5563">URL 前缀：/admin</text>

  <rect x="710" y="215" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="800" y="233" text-anchor="middle" class="route-text">GET /dashboard</text>
  <rect x="710" y="250" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="800" y="268" text-anchor="middle" class="route-text">GET /users</text>
  <rect x="710" y="285" width="180" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="800" y="303" text-anchor="middle" class="route-text">GET /stats</text>

  <text x="800" y="335" text-anchor="middle" class="desc-text">后台管理与数据统计</text>

  <!-- Key -->
  <rect x="300" y="375" width="500" height="80" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="320" y="398" class="desc-text" font-weight="700" fill="#374151">关键概念</text>
  <text x="320" y="416" class="route-text">app.register_blueprint(bp, url_prefix="/auth")  —— 通过 url_prefix 为蓝图所有路由添加统一前缀</text>
  <text x="320" y="434" class="route-text">url_for("auth.login")  —— 蓝图中的 endpoint 需加蓝图名前缀，支持相对引用 url_for(".login")</text>

</svg>