<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="ipArrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
    <marker id="ipArrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2980b9"/>
    </marker>
    <marker id="ipArrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="12" fill="#f8f9ff"/>

  <!-- 标题 -->
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">多模态 API 的三种图片传入方式</text>

  <!-- 面板一：base64 内联 -->
  <rect x="20" y="56" width="292" height="330" rx="12" fill="#fbfcfe" stroke="#d5dde8" stroke-width="1.5"/>
  <rect x="91" y="76" width="150" height="32" rx="16" fill="#27ae60"/>
  <text x="166" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">base64 内联</text>

  <rect x="50" y="132" width="232" height="44" rx="8" fill="#ffffff" stroke="#9fd4ae" stroke-width="1.2"/>
  <text x="166" y="159" text-anchor="middle" font-size="11.5" fill="#2c3e50">本地图片文件</text>

  <rect x="50" y="190" width="232" height="44" rx="8" fill="#ffffff" stroke="#9fd4ae" stroke-width="1.2"/>
  <text x="166" y="217" text-anchor="middle" font-size="11.5" fill="#2c3e50">编码成 base64 字符串</text>

  <rect x="50" y="248" width="232" height="44" rx="8" fill="#ffffff" stroke="#9fd4ae" stroke-width="1.2"/>
  <text x="166" y="275" text-anchor="middle" font-size="11.5" fill="#2c3e50">整段写进请求体</text>

  <g stroke="#27ae60" stroke-width="1.5">
    <line x1="166" y1="108" x2="166" y2="128" marker-end="url(#ipArrowG)"/>
    <line x1="166" y1="176" x2="166" y2="186" marker-end="url(#ipArrowG)"/>
    <line x1="166" y1="234" x2="166" y2="244" marker-end="url(#ipArrowG)"/>
  </g>

  <text x="166" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e6b3a">不依赖图床，本地图片直传</text>
  <text x="166" y="346" text-anchor="middle" font-size="10.5" fill="#7a8699">请求体大，适合一次性小图</text>

  <!-- 面板二：外部 URL -->
  <rect x="334" y="56" width="292" height="330" rx="12" fill="#fbfcfe" stroke="#d5dde8" stroke-width="1.5"/>
  <rect x="405" y="76" width="150" height="32" rx="16" fill="#2980b9"/>
  <text x="480" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">外部 URL</text>

  <rect x="364" y="132" width="232" height="44" rx="8" fill="#ffffff" stroke="#a9c8e8" stroke-width="1.2"/>
  <text x="480" y="159" text-anchor="middle" font-size="11.5" fill="#2c3e50">图片放在自己的服务器</text>

  <rect x="364" y="190" width="232" height="44" rx="8" fill="#ffffff" stroke="#a9c8e8" stroke-width="1.2"/>
  <text x="480" y="217" text-anchor="middle" font-size="11.5" fill="#2c3e50">请求里只传一个 URL</text>

  <rect x="364" y="248" width="232" height="44" rx="8" fill="#ffffff" stroke="#a9c8e8" stroke-width="1.2"/>
  <text x="480" y="275" text-anchor="middle" font-size="11.5" fill="#2c3e50">平台按 URL 拉取图片</text>

  <g stroke="#2980b9" stroke-width="1.5">
    <line x1="480" y1="108" x2="480" y2="128" marker-end="url(#ipArrowB)"/>
    <line x1="480" y1="176" x2="480" y2="186" marker-end="url(#ipArrowB)"/>
    <line x1="480" y1="234" x2="480" y2="244" marker-end="url(#ipArrowB)"/>
  </g>

  <text x="480" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a8a">请求体小，写法最简单</text>
  <text x="480" y="346" text-anchor="middle" font-size="10.5" fill="#7a8699">需保证 URL 可公开访问</text>

  <!-- 面板三：Files API -->
  <rect x="648" y="56" width="292" height="330" rx="12" fill="#fbfcfe" stroke="#d5dde8" stroke-width="1.5"/>
  <rect x="719" y="76" width="150" height="32" rx="16" fill="#8e44ad"/>
  <text x="794" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Files API</text>

  <rect x="678" y="132" width="232" height="44" rx="8" fill="#ffffff" stroke="#cba9dd" stroke-width="1.2"/>
  <text x="794" y="159" text-anchor="middle" font-size="11.5" fill="#2c3e50">先把图片上传到平台</text>

  <rect x="678" y="190" width="232" height="44" rx="8" fill="#ffffff" stroke="#cba9dd" stroke-width="1.2"/>
  <text x="794" y="217" text-anchor="middle" font-size="11.5" fill="#2c3e50">平台返回 file_id</text>

  <rect x="678" y="248" width="232" height="44" rx="8" fill="#ffffff" stroke="#cba9dd" stroke-width="1.2"/>
  <text x="794" y="275" text-anchor="middle" font-size="11.5" fill="#2c3e50">请求里只传 file_id</text>

  <g stroke="#8e44ad" stroke-width="1.5">
    <line x1="794" y1="108" x2="794" y2="128" marker-end="url(#ipArrowP)"/>
    <line x1="794" y1="176" x2="794" y2="186" marker-end="url(#ipArrowP)"/>
    <line x1="794" y1="234" x2="794" y2="244" marker-end="url(#ipArrowP)"/>
  </g>

  <text x="794" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5e2d78">免费上传，同图复用不重传</text>
  <text x="794" y="346" text-anchor="middle" font-size="10.5" fill="#7a8699">适合高频调用与批量任务</text>
</svg>
