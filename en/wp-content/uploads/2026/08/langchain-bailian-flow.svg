<svg viewBox="0 0 1000 630" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">在 LangChain 中使用阿里云百炼</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#6b7280">LangChain 框架集成阿里云百炼模型的整体流程</text>

  <!-- 开发者节点 -->
  <rect x="30" y="270" width="120" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">开发者</text>
  <text x="90" y="320" text-anchor="middle" font-size="11" fill="#64748b">大模型应用</text>

  <!-- LangChain 框架容器 -->
  <rect x="190" y="170" width="270" height="270" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="205" y="192" font-size="13" font-weight="600" fill="#334155">LangChain 框架</text>

  <rect x="205" y="205" width="240" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="325" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">ChatOpenAI / ChatTongyi</text>
  <text x="325" y="246" text-anchor="middle" font-size="10.5" fill="#6b7280">聊天模型接入类</text>

  <rect x="205" y="268" width="240" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="325" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">DashScopeEmbeddings</text>
  <text x="325" y="309" text-anchor="middle" font-size="10.5" fill="#6b7280">文本嵌入模型接入类</text>

  <rect x="205" y="331" width="240" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="325" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">DashScopeRerank</text>
  <text x="325" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">重排序模型接入类</text>

  <!-- 阿里云百炼 DashScope API 容器 -->
  <rect x="500" y="170" width="230" height="270" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="515" y="192" font-size="13" font-weight="600" fill="#0c4a6e">阿里云百炼 DashScope API</text>

  <rect x="515" y="205" width="200" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="615" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">OpenAI 兼容模式</text>
  <text x="615" y="248" text-anchor="middle" font-size="10.5" fill="#64748b">compatible-mode/v1</text>
  <text x="615" y="266" text-anchor="middle" font-size="10.5" fill="#64748b">支持部分模型</text>

  <rect x="515" y="296" width="200" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="615" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">DashScope 原生模式</text>
  <text x="615" y="339" text-anchor="middle" font-size="10.5" fill="#64748b">DashScope 原生 SDK</text>
  <text x="615" y="357" text-anchor="middle" font-size="10.5" fill="#64748b">支持全部模型</text>

  <!-- 百炼模型容器 -->
  <rect x="770" y="170" width="210" height="270" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785" y="192" font-size="13" font-weight="600" fill="#4c1d95">百炼模型</text>

  <rect x="785" y="205" width="180" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="875" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">qwen-plus 等</text>
  <text x="875" y="246" text-anchor="middle" font-size="10.5" fill="#6b7280">文本生成模型</text>

  <rect x="785" y="268" width="180" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="875" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">text-embedding-v4</text>
  <text x="875" y="309" text-anchor="middle" font-size="10.5" fill="#6b7280">文本嵌入模型</text>

  <rect x="785" y="331" width="180" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="875" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">gte-rerank-v2</text>
  <text x="875" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">重排序模型</text>

  <!-- 主流程箭头 -->
  <line x1="150" y1="305" x2="184" y2="305" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="460" y1="305" x2="494" y2="305" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="730" y1="305" x2="764" y2="305" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 箭头标注 -->
  <text x="167" y="294" text-anchor="middle" font-size="10.5" fill="#2563eb">调用</text>
  <text x="477" y="294" text-anchor="middle" font-size="10.5" fill="#2563eb">HTTP</text>
  <text x="747" y="294" text-anchor="middle" font-size="10.5" fill="#2563eb">请求</text>

  <!-- DASHSCOPE_API_KEY 环境变量节点 -->
  <rect x="175" y="500" width="300" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="325" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">DASHSCOPE_API_KEY</text>
  <text x="325" y="542" text-anchor="middle" font-size="10.5" fill="#c2410c">环境变量 · 鉴权密钥（必填）</text>

  <!-- 环境变量注入箭头（虚线，从密钥节点指向 LangChain 容器） -->
  <line x1="325" y1="500" x2="325" y2="446" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>

  <!-- 图例 -->
  <g transform="translate(20, 588)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="38" y="12" fill="#6b7280" font-size="11">主调用流程</text>
    <line x1="150" y1="8" x2="180" y2="8" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
    <text x="188" y="12" fill="#6b7280" font-size="11">环境变量注入鉴权</text>
  </g>
</svg>
