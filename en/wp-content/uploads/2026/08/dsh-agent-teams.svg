<svg viewBox="0 0 920 350" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <rect width="920" height="350" rx="12" fill="#f8f9ff"/>

  <!-- 标题 -->
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">dsh-agent-teams：队长会话拆分并调度子 Agent</text>

  <!-- 连接线 -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="460" y1="108" x2="200" y2="150"/>
    <line x1="460" y1="108" x2="460" y2="150"/>
    <line x1="460" y1="108" x2="720" y2="150"/>
    <line x1="200" y1="206" x2="460" y2="250"/>
    <line x1="460" y1="206" x2="460" y2="250"/>
    <line x1="720" y1="206" x2="460" y2="250"/>
  </g>

  <!-- 队长会话 -->
  <rect x="350" y="62" width="220" height="46" rx="10" fill="#2980b9"/>
  <text x="460" y="84" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">当前会话</text>
  <text x="460" y="101" text-anchor="middle" font-size="11.5" fill="#d0e3ff">Team Leader（队长）</text>

  <!-- 子 Agent -->
  <g fill="#e8f0ff" stroke="#2980b9" stroke-width="1.5">
    <rect x="110" y="150" width="180" height="56" rx="8"/>
    <rect x="370" y="150" width="180" height="56" rx="8"/>
    <rect x="630" y="150" width="180" height="56" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="200" y="173" font-size="13" font-weight="bold" fill="#1a3a8a">Agent A</text>
    <text x="200" y="192" font-size="11.5" fill="#3d5a8a">前端任务</text>
    <text x="460" y="173" font-size="13" font-weight="bold" fill="#1a3a8a">Agent B</text>
    <text x="460" y="192" font-size="11.5" fill="#3d5a8a">后端任务</text>
    <text x="720" y="173" font-size="13" font-weight="bold" fill="#1a3a8a">Agent C</text>
    <text x="720" y="192" font-size="11.5" fill="#3d5a8a">测试任务</text>
  </g>

  <!-- 汇总结果 -->
  <rect x="350" y="250" width="220" height="44" rx="10" fill="#e8f0ff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="460" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a8a">汇总结果</text>

  <!-- 底注 -->
  <text x="460" y="330" text-anchor="middle" font-size="11.5" fill="#7a8699">子 Agent 可续聊 · 任务带依赖关系 · 自动调度 · 实时面板</text>
</svg>
