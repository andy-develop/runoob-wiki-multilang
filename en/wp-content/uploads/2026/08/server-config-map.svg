<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">SERVER CONFIG MAP</text>

  <!-- ===== 外框：ollama serve 进程 ===== -->
  <rect x="36" y="88" width="888" height="380" rx="8" fill="none" stroke="#1c1917" stroke-width="1"/>
  <rect x="52" y="80" width="160" height="16" rx="2" fill="#faf7f2"/>
  <text x="60" y="92" fill="#1c1917" font-size="9.5" font-weight="600">ollama serve 进程</text>

  <!-- ===== 层 1：网络入口 ===== -->
  <rect x="68" y="120" width="824" height="96" rx="6" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <text x="92" y="148" fill="#1c1917" font-size="11" font-weight="600">网络入口</text>
  <text x="92" y="200" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.10em">LISTEN</text>
  <rect x="184" y="168" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="284" y="188" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_HOST</text>
  <rect x="404" y="168" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="504" y="188" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_ORIGINS</text>
  <rect x="624" y="168" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="724" y="188" fill="#57534e" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">HTTPS_PROXY 出站</text>

  <!-- ===== 层 2：请求调度 ===== -->
  <rect x="68" y="232" width="824" height="96" rx="6" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <text x="92" y="260" fill="#1c1917" font-size="11" font-weight="600">请求调度</text>
  <text x="92" y="312" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.10em">SCHEDULE</text>
  <rect x="184" y="280" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="284" y="300" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_NUM_PARALLEL</text>
  <rect x="404" y="280" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="504" y="300" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_MAX_LOADED_MODELS</text>
  <rect x="624" y="280" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.25)" stroke-width="0.8"/>
  <text x="724" y="300" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_MAX_QUEUE</text>

  <!-- ===== 层 3：模型运行 ===== -->
  <rect x="68" y="344" width="824" height="96" rx="6" fill="rgba(181,82,58,0.08)" stroke="rgba(181,82,58,0.50)" stroke-width="1"/>
  <text x="92" y="372" fill="#1c1917" font-size="11" font-weight="600">模型运行</text>
  <text x="92" y="424" fill="#b5523a" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.10em">RUNTIME</text>
  <rect x="184" y="392" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(181,82,58,0.45)" stroke-width="0.8"/>
  <text x="284" y="412" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_MODELS</text>
  <rect x="404" y="392" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(181,82,58,0.45)" stroke-width="0.8"/>
  <text x="504" y="412" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_CONTEXT_LENGTH</text>
  <rect x="624" y="392" width="200" height="32" rx="4" fill="#ffffff" stroke="rgba(181,82,58,0.45)" stroke-width="0.8"/>
  <text x="724" y="412" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">OLLAMA_KEEP_ALIVE</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="512" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">调试贯穿全局：OLLAMA_DEBUG=1 打开全部层级的详细日志</text>
</svg>
