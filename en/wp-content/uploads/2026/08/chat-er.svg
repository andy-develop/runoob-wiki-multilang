<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">DATA MODEL</text>

  <!-- ===== 关系线（先画） ===== -->
  <line x1="440" y1="200" x2="560" y2="200" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="500" y="190" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">拥有</text>

  <!-- ===== 实体：chats（聚合根，focal） ===== -->
  <rect x="200" y="112" width="240" height="176" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="200" y="112" width="240" height="40" rx="6" fill="rgba(181,82,58,0.12)" stroke="#b5523a" stroke-width="1"/>
  <rect x="212" y="126" width="44" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
  <text x="234" y="135" fill="#b5523a" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
  <text x="320" y="137" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">chats</text>
  <text x="216" y="176" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace"># id</text>
  <text x="216" y="200" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">title</text>
  <text x="216" y="224" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">created_at</text>
  <text x="216" y="256" fill="#78716c" font-size="9" text-anchor="start" font-family="'Geist', -apple-system, 'PingFang SC', sans-serif">一次独立对话 = 一条记录</text>

  <!-- ===== 实体：messages ===== -->
  <rect x="560" y="112" width="240" height="216" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="560" y="112" width="240" height="40" rx="6" fill="rgba(28,25,23,0.06)" stroke="#1c1917" stroke-width="1"/>
  <rect x="572" y="126" width="44" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="594" y="135" fill="#1c1917" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
  <text x="680" y="137" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">messages</text>
  <text x="576" y="176" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace"># id</text>
  <text x="576" y="200" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">→ chat_id</text>
  <text x="576" y="224" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">role</text>
  <text x="576" y="248" fill="#1c1917" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">content</text>
  <text x="576" y="292" fill="#78716c" font-size="9" text-anchor="start" font-family="'Geist', -apple-system, 'PingFang SC', sans-serif">按 chat_id 归组，按 id 排序即对话顺序</text>

  <!-- ===== 基数标注 ===== -->
  <text x="452" y="214" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">1</text>
  <text x="544" y="214" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">N</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="330" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">两张表就是多会话记忆的全部：切会话即切上下文</text>
</svg>
