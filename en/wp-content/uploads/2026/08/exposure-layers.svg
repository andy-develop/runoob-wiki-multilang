<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">EXPOSURE &amp; RISK LAYERS</text>

  <!-- ===== 外层：公网暴露 ===== -->
  <rect x="36" y="88" width="888" height="376" rx="8" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="52" y="80" width="220" height="16" rx="2" fill="#faf7f2"/>
  <text x="60" y="92" fill="#b5523a" font-size="9.5" font-weight="600">公网暴露 · 高风险</text>
  <text x="908" y="92" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">端口映射 / 隧道 · 必须反代加鉴权</text>

  <!-- ===== 中层：局域网 ===== -->
  <rect x="76" y="140" width="808" height="284" rx="8" fill="#f2ede4" stroke="rgba(28,25,23,0.25)" stroke-width="1"/>
  <rect x="92" y="132" width="220" height="16" rx="2" fill="#faf7f2"/>
  <text x="100" y="144" fill="#1c1917" font-size="9.5" font-weight="600">局域网 · 中风险</text>
  <text x="868" y="144" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">监听 0.0.0.0 · 防火墙白名单</text>

  <!-- ===== 内层：仅本机 ===== -->
  <rect x="116" y="192" width="728" height="192" rx="8" fill="#ffffff" stroke="rgba(28,25,23,0.40)" stroke-width="1"/>
  <rect x="132" y="184" width="220" height="16" rx="2" fill="#faf7f2"/>
  <text x="140" y="196" fill="#1c1917" font-size="9.5" font-weight="600">仅本机 · 低风险（默认）</text>
  <text x="828" y="196" fill="#57534e" font-size="8.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">监听 127.0.0.1 · 无需额外动作</text>

  <!-- ===== 内层内容 ===== -->
  <text x="480" y="238" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Ollama 服务</text>
  <text x="480" y="262" fill="#57534e" font-size="9.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">localhost:11434</text>
  <text x="480" y="290" fill="#57534e" font-size="9.5" text-anchor="middle">风险：仅限本机进程</text>
  <text x="480" y="312" fill="#57534e" font-size="9.5" text-anchor="middle">默认状态即最安全的一档</text>

  <!-- ===== 中层附加说明 ===== -->
  <text x="480" y="408" fill="#57534e" font-size="9.5" text-anchor="middle">风险：同网段任何设备可免鉴权调用与删除模型</text>

  <!-- ===== 外层附加说明 ===== -->
  <text x="480" y="436" fill="#b5523a" font-size="9.5" text-anchor="middle">风险：算力被白嫖 · 提示词与数据外泄 · 无任何访问控制</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="512" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">风险随暴露面扩大而上升，收窄暴露面永远是最有效的防护</text>
</svg>
