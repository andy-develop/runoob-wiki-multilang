<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="36" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">MULTI-MODEL ROUTER</text>

  <!-- ===== 箭头（先画） ===== -->
  <line x1="480" y1="136" x2="480" y2="176" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M412,264 L412,304 L152,304 L152,344" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="264" x2="480" y2="344" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M548,264 L548,304 L808,304 L808,344" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 箭头标签 ===== -->
  <rect x="76" y="292" width="76" height="14" rx="2" fill="#faf7f2"/>
  <text x="114" y="303" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">CHAT</text>
  <rect x="444" y="292" width="72" height="14" rx="2" fill="#faf7f2"/>
  <text x="480" y="303" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">CODING</text>
  <rect x="768" y="292" width="80" height="14" rx="2" fill="#faf7f2"/>
  <text x="808" y="303" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SEARCH</text>

  <!-- ===== 用户问题 ===== -->
  <rect x="380" y="80" width="200" height="56" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="480" y="104" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">用户问题</text>
  <text x="480" y="124" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">POST /ask</text>

  <!-- ===== 路由器（focal） ===== -->
  <rect x="340" y="176" width="280" height="88" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="480" y="208" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">路由器 · qwen3.5:4b</text>
  <text x="480" y="230" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">结构化输出分类：chat / coding / search</text>
  <text x="480" y="248" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">毫秒级小模型，只为分流不回答</text>

  <!-- ===== 分支 1：日常问答 ===== -->
  <rect x="36" y="344" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="152" y="376" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">日常问答</text>
  <text x="152" y="400" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">qwen3.5:4b</text>
  <text x="152" y="422" fill="#57534e" font-size="9" text-anchor="middle">低成本高并发主力</text>

  <!-- ===== 分支 2：编程任务 ===== -->
  <rect x="364" y="344" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="480" y="376" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">编程任务</text>
  <text x="480" y="400" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">runoob-coder / qwen3-coder</text>
  <text x="480" y="422" fill="#57534e" font-size="9" text-anchor="middle">质量优先的任务</text>

  <!-- ===== 分支 3：需要联网 ===== -->
  <rect x="692" y="344" width="232" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="808" y="376" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">需要联网</text>
  <text x="808" y="400" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">web_search 工具链</text>
  <text x="808" y="422" fill="#57534e" font-size="9" text-anchor="middle">实时信息类问题</text>

  <!-- ===== 编辑性旁注 ===== -->
  <text x="480" y="488" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Songti SC', 'SimSun', serif" text-anchor="middle">三条路径均可按需切换为 :cloud 云端模型</text>
</svg>
