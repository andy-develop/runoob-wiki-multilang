<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
  <defs>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="embGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vecGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="llmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000033"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>

  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#334155">RAG 整体架构流程</text>

  <rect x="25" y="60" width="410" height="210" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="230" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">离线索引阶段（数据准备）</text>

  <rect x="460" y="60" width="415" height="435" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="667" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">在线检索阶段（用户查询）</text>

  <g filter="url(#shadow)">
    <rect x="50" y="100" width="130" height="70" rx="8" fill="url(#docGradient)"/>
    <text x="115" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="white">文档</text>
    <text x="115" y="152" text-anchor="middle" font-size="11" fill="#e0e7ff">PDF、TXT、DOCX</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="205" y="100" width="130" height="70" rx="8" fill="url(#docGradient)"/>
    <text x="270" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="white">切分</text>
    <text x="270" y="152" text-anchor="middle" font-size="11" fill="#e0e7ff">分割成文本块</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="50" y="190" width="130" height="70" rx="8" fill="url(#embGradient)"/>
    <text x="115" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">向量化</text>
    <text x="115" y="242" text-anchor="middle" font-size="11" fill="#fce7f3">Embedding 模型</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="205" y="190" width="200" height="70" rx="8" fill="url(#vecGradient)"/>
    <text x="305" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">向量数据库</text>
    <text x="305" y="242" text-anchor="middle" font-size="11" fill="#cffafe">Chroma、Pinecone 等</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="110" width="160" height="60" rx="8" fill="#7c3aed"/>
    <text x="570" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="white">用户问题</text>
    <text x="570" y="155" text-anchor="middle" font-size="11" fill="#ddd6fe">Query</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="110" width="160" height="60" rx="8" fill="url(#embGradient)"/>
    <text x="760" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="white">问题向量化</text>
    <text x="760" y="155" text-anchor="middle" font-size="11" fill="#fce7f3">Query Embedding</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="200" width="350" height="70" rx="8" fill="url(#vecGradient)"/>
    <text x="665" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="white">相似度检索</text>
    <text x="665" y="252" text-anchor="middle" font-size="11" fill="#cffafe">找出最相关的文档片段</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="300" width="350" height="70" rx="8" fill="#8b5cf6"/>
    <text x="665" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="white">构建 Prompt</text>
    <text x="665" y="352" text-anchor="middle" font-size="11" fill="#e9d5ff">上下文 + 用户问题</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="400" width="200" height="70" rx="8" fill="url(#llmGradient)"/>
    <text x="590" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">LLM 生成</text>
    <text x="590" y="452" text-anchor="middle" font-size="11" fill="#065f46">基于上下文回答</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="400" width="120" height="70" rx="8" fill="#10b981"/>
    <text x="780" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="white">答案</text>
    <text x="780" y="452" text-anchor="middle" font-size="11" fill="#d1fae5">最终输出</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M 180 135 L 200 135" marker-end="url(#arrow)"/>
    <path d="M 270 170 L 270 185" marker-end="url(#arrow)"/>
    <path d="M 180 225 L 200 225" marker-end="url(#arrow)"/>
    <path d="M 650 140 L 675 140" marker-end="url(#arrow)"/>
    <path d="M 760 170 L 760 195" marker-end="url(#arrow)"/>
    <path d="M 665 270 L 665 295" marker-end="url(#arrow)"/>
    <path d="M 665 370 L 665 395" marker-end="url(#arrow)"/>
    <path d="M 690 435 L 715 435" marker-end="url(#arrow)"/>
  </g>

  <g stroke="#64748b" stroke-width="2" stroke-dasharray="5,3" fill="none">
    <path d="M 405 225 C 440 225 440 255 460 255" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <text x="50" y="495" font-size="10" fill="#94a3b8">RUNOOB AI 教程 - RAG 架构图</text>
</svg>