  <text x="656" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">assets/</text>
  <text x="656" y="220" text-anchor="middle" font-size="11" fill="#5b21b6" opacity="0.85">可选：模板资源</text>
