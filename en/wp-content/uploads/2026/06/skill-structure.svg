  <text x="479" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">references/</text>
  <text x="479" y="220" text-anchor="middle" font-size="11" fill="#065f46" opacity="0.85">可选：参考文档</text>
  <line x1="480" y1="114" x2="479" y2="170" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
