<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .node-label { font-size: 14px; font-weight: 600; fill: #111827; }
    .sub-label { font-size: 11px; font-weight: 400; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" class="title">Session 签名 Cookie 工作机制</text>

  <!-- Browser side -->
  <rect x="60" y="60" width="240" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="88" text-anchor="middle" class="node-label">浏览器</text>
  <rect x="85" y="100" width="190" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="180" y="120" text-anchor="middle" class="sub-label" font-weight="600">存储签名 Cookie</text>
  <text x="180" y="138" text-anchor="middle" class="sub-label">session=.eJw...（可见但不可改）</text>

  <!-- Flask Server side -->
  <rect x="660" y="60" width="240" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="780" y="88" text-anchor="middle" class="node-label">Flask 服务器</text>
  <rect x="685" y="100" width="190" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="780" y="120" text-anchor="middle" class="sub-label" font-weight="600">签名 + 验证 Cookie</text>
  <text x="780" y="138" text-anchor="middle" class="sub-label">SECRET_KEY → itsdangerous</text>

  <!-- Arrow 1: Request with cookie -->
  <path d="M 305 90 L 655 90" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="400" y="74" width="170" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="485" y="86" text-anchor="middle" class="sub-label" fill="#2563eb">请求 → 带上 Cookie</text>

  <!-- Arrow 2: Response with Set-Cookie -->
  <path d="M 655 135 L 305 135" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="420" y="119" width="150" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="495" y="131" text-anchor="middle" class="sub-label" fill="#16a34a">响应 ← 设置新 Cookie</text>

  <!-- Workflow steps -->
  <text x="480" y="215" text-anchor="middle" class="node-label">处理流程</text>

  <rect x="80" y="235" width="170" height="32" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="165" y="256" text-anchor="middle" class="sub-label">1. 读取请求中的 Cookie</text>
  <line x1="252" y1="251" x2="285" y2="251" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="290" y="235" width="200" height="32" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390" y="256" text-anchor="middle" class="sub-label">2. 验证签名，还原 Session</text>
  <line x1="492" y1="251" x2="525" y2="251" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="530" y="235" width="170" height="32" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="615" y="256" text-anchor="middle" class="sub-label">3. 业务逻辑处理</text>

  <line x1="615" y1="267" x2="615" y2="295" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="615" y1="295" x2="390" y2="295" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="290" y="280" width="200" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="390" y="301" text-anchor="middle" class="sub-label">4. 签名后写入 Set-Cookie</text>

  <!-- Note -->
  <rect x="80" y="330" width="800" height="32" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="480" y="351" text-anchor="middle" class="sub-label">Cookie 内容对用户可见（base64 编码）但无法篡改——任何修改都会导致签名验证失败，Flask 会丢弃被篡改的数据</text>

</svg>