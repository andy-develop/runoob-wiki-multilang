<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- column eyebrow -->
  <text x="144" y="40" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.18em" text-anchor="middle">SOURCE</text>
  <text x="464" y="40" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.18em" text-anchor="middle">STORE</text>

  <!-- arrows first -->
  <path d="M224 104 C280 104, 300 152, 352 172" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="224" y1="192" x2="348" y2="192" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M224 280 C280 280, 300 232, 352 212" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="592" y1="192" x2="664" y2="192" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- install label (masked) -->
  <rect x="252" y="168" width="76" height="14" rx="2" fill="#faf7f2"/>
  <text x="290" y="179" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">pi install</text>

  <!-- discover label (masked) -->
  <rect x="596" y="168" width="64" height="14" rx="2" fill="#faf7f2"/>
  <text x="628" y="179" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">自动发现</text>

  <!-- sources -->
  <rect x="64" y="80" width="160" height="48" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="144" y="100" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">npm 包</text>
  <text x="144" y="118" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">@runoob/pi-todo-kit</text>

  <rect x="64" y="168" width="160" height="48" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="144" y="188" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">git 仓库</text>
  <text x="144" y="206" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">github.com/user/repo</text>

  <rect x="64" y="256" width="160" height="48" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="144" y="276" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">本地路径</text>
  <text x="144" y="294" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">./my-extension.ts</text>

  <!-- store (focal) -->
  <rect x="356" y="152" width="232" height="80" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <text x="472" y="180" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">~/.pi/agent/</text>
  <text x="472" y="200" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">npm/ · git/ 子目录按来源存放</text>
  <text x="472" y="216" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">-l 装到项目 .pi/ 目录</text>

  <!-- result -->
  <rect x="668" y="152" width="176" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="756" y="176" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">重启后生效</text>
  <text x="756" y="196" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">extensions · skills</text>
  <text x="756" y="212" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">prompts · themes</text>

  <!-- editorial aside -->
  <text x="472" y="288" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif','Songti SC',serif" text-anchor="middle">包内四类内容统一注册，团队协作时配好 packages 过滤即可共享整套工作流</text>

  <!-- legend -->
  <line x1="32" y1="336" x2="848" y2="336" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="352" fill="#57534e" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="112" y="344" width="20" height="14" rx="3" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
  <text x="140" y="355" fill="#57534e" font-size="9">包来源</text>
  <rect x="212" y="344" width="20" height="14" rx="3" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="240" y="355" fill="#57534e" font-size="9">本地存储</text>
  <rect x="324" y="344" width="20" height="14" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="352" y="355" fill="#57534e" font-size="9">加载结果</text>
</svg>
