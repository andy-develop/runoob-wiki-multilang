<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- isolation axis -->
  <text x="836" y="52" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em" text-anchor="end">ISOLATION</text>
  <text x="836" y="66" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">强 ↑</text>

  <!-- layer 4: gondolin (top, optional security) -->
  <rect x="120" y="48" width="640" height="56" rx="6" fill="rgba(181,82,58,0.05)" stroke="rgba(181,82,58,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="152" y="72" fill="#1c1917" font-size="12" font-weight="600">Gondolin 微 VM 隔离</text>
  <text x="152" y="90" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace">micro vm · 最强隔离</text>
  <text x="728" y="80" fill="#57534e" font-size="9" text-anchor="end">可选增强</text>

  <!-- layer 3: container (optional) -->
  <rect x="120" y="112" width="640" height="56" rx="6" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="152" y="136" fill="#1c1917" font-size="12" font-weight="600">容器隔离</text>
  <text x="152" y="154" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace">docker · 文件系统与网络隔离</text>
  <text x="728" y="144" fill="#57534e" font-size="9" text-anchor="end">可选增强</text>

  <!-- layer 2: project trust -->
  <rect x="120" y="176" width="640" height="56" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="152" y="200" fill="#1c1917" font-size="12" font-weight="600">项目信任</text>
  <text x="152" y="218" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace">trust.json · 控制扩展与指令加载</text>
  <text x="728" y="208" fill="#57534e" font-size="9" text-anchor="end">默认开启询问</text>

  <!-- layer 1: process (base) -->
  <rect x="120" y="240" width="640" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="152" y="264" fill="#1c1917" font-size="12" font-weight="600">Pi Agent 进程权限</text>
  <text x="152" y="282" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace">对当前目录可读写 · 建议配合 git</text>
  <text x="728" y="272" fill="#57534e" font-size="9" text-anchor="end">基础层</text>

  <!-- editorial aside -->
  <text x="120" y="330" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif','Songti SC',serif">内层默认生效，外层按需叠加；不信任的代码请至少放到容器里运行</text>

  <!-- legend -->
  <line x1="32" y1="344" x2="848" y2="344" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="360" fill="#57534e" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="112" y="350" width="20" height="14" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="140" y="361" fill="#57534e" font-size="9">默认生效</text>
  <rect x="224" y="350" width="20" height="14" rx="3" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="252" y="361" fill="#57534e" font-size="9">可选增强层</text>
</svg>
