<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
    <marker id="arr-h" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f97316"/></marker>
  </defs>
  <style>text { font-family: "SF Mono","Fira Code","Cascadia Code","Courier New","Microsoft YaHei","SimHei",monospace; }</style>
  <rect width="820" height="360" fill="url(#bg)"/>
  <text x="410" y="28" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">链表节点结构与内存关系</text>

  <rect x="70" y="58" width="90" height="50" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="115" y="78" text-anchor="middle" fill="#e2e8f0" font-size="11">data</text>
  <text x="115" y="97" text-anchor="middle" fill="#7c3aed" font-size="14" font-weight="bold">10</text>
  <rect x="170" y="58" width="50" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="195" y="78" text-anchor="middle" fill="#94a3b8" font-size="9">next</text>
  <text x="195" y="97" text-anchor="middle" fill="#94a3b8" font-size="9">0x2B00</text>
  <text x="140" y="130" text-anchor="middle" fill="#475569" font-size="9">0x1A00</text>
  <line x1="220" y1="83" x2="240" y2="83" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="58" width="90" height="50" rx="6" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="285" y="78" text-anchor="middle" fill="#e2e8f0" font-size="11">data</text>
  <text x="285" y="97" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">20</text>
  <rect x="340" y="58" width="50" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="365" y="78" text-anchor="middle" fill="#94a3b8" font-size="9">next</text>
  <text x="365" y="97" text-anchor="middle" fill="#94a3b8" font-size="9">0x3F00</text>
  <text x="310" y="130" text-anchor="middle" fill="#475569" font-size="9">0x2B00</text>
  <line x1="390" y1="83" x2="410" y2="83" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="410" y="58" width="90" height="50" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
  <text x="455" y="78" text-anchor="middle" fill="#e2e8f0" font-size="11">data</text>
  <text x="455" y="97" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">30</text>
  <rect x="510" y="58" width="50" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="535" y="78" text-anchor="middle" fill="#94a3b8" font-size="9">next</text>
  <text x="535" y="97" text-anchor="middle" fill="#94a3b8" font-size="9">0x4E00</text>
  <text x="480" y="130" text-anchor="middle" fill="#475569" font-size="9">0x3F00</text>
  <line x1="560" y1="83" x2="580" y2="83" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="580" y="58" width="90" height="50" rx="6" fill="#1e1b4b" stroke="#ea580c" stroke-width="1.5"/>
  <text x="625" y="78" text-anchor="middle" fill="#e2e8f0" font-size="11">data</text>
  <text x="625" y="97" text-anchor="middle" fill="#ea580c" font-size="14" font-weight="bold">40</text>
  <rect x="680" y="58" width="50" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="705" y="78" text-anchor="middle" fill="#94a3b8" font-size="9">next</text>
  <text x="705" y="97" text-anchor="middle" fill="#475569" font-size="9">NULL</text>
  <text x="650" y="130" text-anchor="middle" fill="#475569" font-size="9">0x4E00</text>
  <rect x="12" y="73" width="42" height="20" rx="4" fill="#1c1917" stroke="#f97316" stroke-width="1"/>
  <text x="33" y="87" text-anchor="middle" fill="#f97316" font-size="10">head</text>
  <line x1="54" y1="83" x2="70" y2="83" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-h)"/>
  <rect x="100" y="158" width="620" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="410" y="182" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">节点结构体定义</text>
  <text x="410" y="206" text-anchor="middle" fill="#60a5fa" font-size="14" font-family="monospace">struct Node { int data; struct Node* next; };</text>
  <text x="410" y="230" text-anchor="middle" fill="#94a3b8" font-size="10">数据域（存储值）                              指针域（存放下一个节点的地址）</text>
  <rect x="130" y="262" width="560" height="38" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="410" y="282" text-anchor="middle" fill="#eab308" font-size="11">关键特征：节点在堆上独立分配 (malloc)，通过指针串联，内存可不连续</text>
  <text x="410" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">与数组的连续存储形成鲜明对比</text>
  <rect x="60" y="315" width="700" height="30" rx="4" fill="none" stroke="#334155" stroke-width="0.5"/>
  <text x="410" y="335" text-anchor="middle" fill="#475569" font-size="9">堆内存：0x1A00 (10) → 0x2B00 (20) → 0x3F00 (30) → 0x4E00 (40) → NULL</text>
</svg>