<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient>
    <marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
  </defs>
  <style>text { font-family: "SF Mono","Fira Code","Cascadia Code","Courier New","Microsoft YaHei","SimHei",monospace; }</style>
  <rect width="860" height="520" fill="url(#bg)"/>
  <text x="430" y="25" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">链表插入与删除 — 指针调整过程</text>

  <rect x="15" y="42" width="830" height="220" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="430" y="68" text-anchor="middle" fill="#f97316" font-size="13" font-weight="bold">插入操作 — 在节点 20 之后插入新节点 25</text>

  <text x="40" y="98" fill="#94a3b8" font-size="11">插入前</text>
  <rect x="40" y="108" width="52" height="48" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="66" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">10</text>
  <line x1="92" y1="132" x2="138" y2="132" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="140" y="108" width="52" height="48" rx="6" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="166" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">20</text>
  <line x1="192" y1="132" x2="238" y2="132" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="240" y="108" width="52" height="48" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
  <text x="266" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">30</text>
  <text x="130" y="175" fill="#10b981" font-size="11">新节点</text>
  <rect x="140" y="182" width="52" height="48" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text x="166" y="212" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">25</text>
  <text x="375" y="145" text-anchor="middle" fill="#475569" font-size="28">→</text>
  <text x="415" y="98" fill="#94a3b8" font-size="11">插入后</text>
  <rect x="415" y="108" width="50" height="48" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="440" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">10</text>
  <line x1="465" y1="132" x2="493" y2="132" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="495" y="108" width="50" height="48" rx="6" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1"/>
  <text x="520" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">20</text>
  <line x1="545" y1="132" x2="573" y2="132" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="575" y="108" width="50" height="48" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">25</text>
  <line x1="625" y1="132" x2="653" y2="132" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="655" y="108" width="50" height="48" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="680" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">30</text>
  <text x="430" y="255" text-anchor="middle" fill="#94a3b8" font-size="10">指针调整步骤：1) 新节点.next = 前驱.next (指向30)  2) 前驱.next = 新节点 (20指向25)</text>

  <rect x="15" y="278" width="830" height="220" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="430" y="304" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">删除操作 — 删除节点 20</text>

  <text x="40" y="334" fill="#94a3b8" font-size="11">删除前</text>
  <rect x="40" y="344" width="52" height="48" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="66" y="374" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">10</text>
  <line x1="92" y1="368" x2="138" y2="368" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="140" y="344" width="52" height="48" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="2"/>
  <text x="166" y="374" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">20</text>
  <line x1="192" y1="368" x2="238" y2="368" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="240" y="344" width="52" height="48" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="266" y="374" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">30</text>
  <line x1="292" y1="368" x2="338" y2="368" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="340" y="344" width="52" height="48" rx="6" fill="#1e1b4b" stroke="#ea580c" stroke-width="1"/>
  <text x="366" y="374" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">40</text>
  <text x="420" y="380" text-anchor="middle" fill="#475569" font-size="28">→</text>
  <text x="470" y="334" fill="#94a3b8" font-size="11">删除后 — 指针跳过 20，然后 free(20)</text>
  <rect x="460" y="344" width="50" height="48" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="485" y="374" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">10</text>
  <rect x="540" y="344" width="50" height="48" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="2" opacity="0.35"/>
  <text x="565" y="374" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold" opacity="0.35">20</text>
  <text x="565" y="410" text-anchor="middle" fill="#ef4444" font-size="10">free</text>
  <rect x="620" y="344" width="50" height="48" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="645" y="374" text-anchor="middle" fill="#e2e8f0" font-size="13">30</text>
  <line x1="670" y1="368" x2="698" y2="368" stroke="#94a3b8" stroke-width="1" marker-end="url(#aa)"/>
  <rect x="700" y="344" width="50" height="48" rx="6" fill="#1e1b4b" stroke="#ea580c" stroke-width="1"/>
  <text x="725" y="374" text-anchor="middle" fill="#e2e8f0" font-size="13">40</text>
  <path d="M 510,350 Q 555,335 575,350 Q 595,335 620,350" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <text x="565" y="338" text-anchor="middle" fill="#10b981" font-size="9">跳过 20</text>
  <text x="430" y="490" text-anchor="middle" fill="#94a3b8" font-size="10">关键：先保存待删除节点的地址 temp = cur，再执行 prev-&gt;next = cur-&gt;next，最后 free(temp)</text>
</svg>