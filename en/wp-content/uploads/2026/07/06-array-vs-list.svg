<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient></defs>
  <style>text { font-family: "SF Mono","Fira Code","Cascadia Code","Courier New","Microsoft YaHei","SimHei",monospace; }</style>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="400" y="25" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">数组 vs 链表 — 全方位对比</text>
  <rect x="30" y="45" width="360" height="355" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="72" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">数组 (Array)</text>
  <text x="45" y="90" fill="#60a5fa" font-size="11">内存布局</text>
  <text x="180" y="90" fill="#94a3b8" font-size="11">连续存储，地址相邻</text>
  <text x="45" y="124" fill="#60a5fa" font-size="11">随机访问</text>
  <text x="180" y="124" fill="#94a3b8" font-size="11">O(1) — 直接计算偏移</text>
  <text x="45" y="158" fill="#60a5fa" font-size="11">头部插入/删除</text>
  <text x="180" y="158" fill="#94a3b8" font-size="11">O(n) — 需移动所有元素</text>
  <text x="45" y="192" fill="#60a5fa" font-size="11">中间插入/删除</text>
  <text x="180" y="192" fill="#94a3b8" font-size="11">O(n) — 平均移动 n/2 个</text>
  <text x="45" y="226" fill="#60a5fa" font-size="11">空间开销</text>
  <text x="180" y="226" fill="#94a3b8" font-size="11">仅数据本身</text>
  <text x="45" y="260" fill="#60a5fa" font-size="11">缓存性能</text>
  <text x="180" y="260" fill="#94a3b8" font-size="11">高 — 空间局部性好</text>
  <text x="45" y="294" fill="#60a5fa" font-size="11">容量</text>
  <text x="180" y="294" fill="#94a3b8" font-size="11">固定 — 编译时确定</text>
  <text x="45" y="328" fill="#60a5fa" font-size="11">适用场景</text>
  <text x="180" y="328" fill="#94a3b8" font-size="11">已知规模、频繁随机访问</text>
  <rect x="410" y="45" width="360" height="355" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="590" y="72" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">链表 (Linked List)</text>
  <text x="425" y="90" fill="#a855f7" font-size="11">内存布局</text>
  <text x="560" y="90" fill="#94a3b8" font-size="11">分散存储，指针串联</text>
  <text x="425" y="124" fill="#a855f7" font-size="11">随机访问</text>
  <text x="560" y="124" fill="#94a3b8" font-size="11">O(n) — 需从头遍历</text>
  <text x="425" y="158" fill="#a855f7" font-size="11">头部插入/删除</text>
  <text x="560" y="158" fill="#94a3b8" font-size="11">O(1) — 仅调整头指针</text>
  <text x="425" y="192" fill="#a855f7" font-size="11">中间插入/删除</text>
  <text x="560" y="192" fill="#94a3b8" font-size="11">O(1) — 仅调整前后指针</text>
  <text x="425" y="226" fill="#a855f7" font-size="11">空间开销</text>
  <text x="560" y="226" fill="#94a3b8" font-size="11">数据 + 指针 (每节点 +8 字节)</text>
  <text x="425" y="260" fill="#a855f7" font-size="11">缓存性能</text>
  <text x="560" y="260" fill="#94a3b8" font-size="11">低 — 节点位置不连续</text>
  <text x="425" y="294" fill="#a855f7" font-size="11">容量</text>
  <text x="560" y="294" fill="#94a3b8" font-size="11">动态 — 运行时按需分配</text>
  <text x="425" y="328" fill="#a855f7" font-size="11">适用场景</text>
  <text x="560" y="328" fill="#94a3b8" font-size="11">频繁增删、规模不确定</text>
  <rect x="120" y="370" width="560" height="40" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="395" text-anchor="middle" fill="#eab308" font-size="11">核心结论：数组以空间换速度（连续存储→快速访问），链表以速度换灵活（指针→动态增删）</text>
</svg>