<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- arrows first -->
  <line x1="208" y1="176" x2="268" y2="176" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="268" y1="208" x2="208" y2="208" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="448" y1="192" x2="508" y2="192" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M128 152 C128 96, 240 88, 340 88 C440 88, 480 96, 504 104" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

  <!-- arrow labels (masked) -->
  <rect x="212" y="156" width="48" height="14" rx="2" fill="#faf7f2"/>
  <text x="236" y="167" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">请求</text>
  <rect x="212" y="214" width="48" height="14" rx="2" fill="#faf7f2"/>
  <text x="236" y="225" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">响应</text>
  <rect x="452" y="172" width="48" height="14" rx="2" fill="#faf7f2"/>
  <text x="476" y="183" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">推理</text>
  <rect x="268" y="60" width="96" height="14" rx="2" fill="#faf7f2"/>
  <text x="316" y="71" fill="#2563eb" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">需要联网时</text>

  <!-- pi agent -->
  <rect x="48" y="152" width="160" height="72" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="128" y="180" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">Pi Agent</text>
  <text x="128" y="198" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">终端交互 · 工具调用</text>
  <text x="128" y="212" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">/llama 切换模型</text>

  <!-- router (focal) -->
  <rect x="272" y="152" width="176" height="72" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <text x="360" y="180" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">llama.cpp 路由器</text>
  <text x="360" y="198" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">本机回环通信 · 无需鉴权</text>
  <text x="360" y="212" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">/llama download · load</text>

  <!-- local model -->
  <rect x="512" y="152" width="184" height="72" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="604" y="180" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">本地模型文件</text>
  <text x="604" y="198" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">gguf 权重 · 本地磁盘</text>
  <text x="604" y="212" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">数据不出本机</text>

  <!-- cloud (optional) -->
  <rect x="512" y="48" width="184" height="56" rx="6" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="604" y="70" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">云端提供商 API</text>
  <text x="604" y="88" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">ctrl+p 随时切换回云端</text>

  <!-- editorial aside -->
  <text x="128" y="264" fill="#78716c" font-size="14" font-style="italic" font-family="'Instrument Serif','Songti SC',serif">全程离线：代码与对话数据都留在本机</text>

  <!-- legend -->
  <line x1="32" y1="284" x2="848" y2="284" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="300" fill="#57534e" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="112" y1="296" x2="148" y2="296" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="158" y="299" fill="#57534e" font-size="9">本地链路</text>
  <line x1="240" y1="296" x2="276" y2="296" stroke="#2563eb" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
  <text x="286" y="299" fill="#57534e" font-size="9">可选云端路径</text>
</svg>
