<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" font-family="'Geist','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- center label -->
  <text x="440" y="188" fill="#57534e" font-size="12" font-weight="600" text-anchor="middle">上下文窗口</text>
  <text x="440" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">context window</text>

  <!-- cycle arrows (clockwise), drawn first -->
  <path d="M520 72 C640 88, 688 120, 728 164" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M728 220 C688 264, 640 296, 528 312" fill="none" stroke="#b5523a" stroke-width="1" marker-end="url(#arrow-accent)"/>
  <path d="M352 312 C240 296, 192 264, 152 220" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M152 164 C192 120, 240 88, 352 72" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- arrow labels (masked) -->
  <rect x="600" y="96" width="56" height="14" rx="2" fill="#faf7f2"/>
  <text x="628" y="107" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">增长</text>
  <rect x="600" y="284" width="56" height="14" rx="2" fill="#faf7f2"/>
  <text x="628" y="295" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">释放窗口</text>
  <rect x="224" y="284" width="56" height="14" rx="2" fill="#faf7f2"/>
  <text x="252" y="295" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">继续对话</text>
  <rect x="224" y="96" width="56" height="14" rx="2" fill="#faf7f2"/>
  <text x="252" y="107" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">追加消息</text>

  <!-- N: append -->
  <rect x="360" y="48" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="68" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">消息不断追加</text>
  <text x="440" y="86" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">user / assistant / tool</text>

  <!-- E: threshold -->
  <rect x="664" y="168" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="744" y="188" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">占用接近阈值</text>
  <text x="744" y="206" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">compaction.enabled</text>

  <!-- S: summarize (focal) -->
  <rect x="360" y="288" width="160" height="48" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <text x="440" y="308" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">自动生成摘要</text>
  <text x="440" y="326" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">compaction summary</text>

  <!-- W: release -->
  <rect x="56" y="168" width="160" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="136" y="188" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">折叠早期消息</text>
  <text x="136" y="206" fill="#78716c" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">early messages folded</text>

  <!-- legend -->
  <line x1="32" y1="356" x2="848" y2="356" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="32" y="372" fill="#57534e" font-size="8" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="112" y1="368" x2="148" y2="368" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="158" y="371" fill="#57534e" font-size="9">常规流转</text>
  <line x1="240" y1="368" x2="276" y2="368" stroke="#b5523a" stroke-width="1" marker-end="url(#arrow-accent)"/>
  <text x="286" y="371" fill="#57534e" font-size="9">触发压缩</text>
</svg>
