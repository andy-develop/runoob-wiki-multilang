<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="800" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Codex MCP 集成架构</text>

  <!-- Codex Core -->
  <rect x="320" y="45" width="160" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9d174d">Codex Core</text>

  <!-- Arrow to MCP -->
  <line x1="400" y1="95" x2="400" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arr1)"/>

  <!-- MCP Server -->
  <rect x="250" y="120" width="300" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3730a3">MCP Server Layer (mcp_servers)</text>

  <!-- Branch to different MCP servers -->
  <line x1="280" y1="160" x2="280" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr1)"/>
  <line x1="400" y1="160" x2="400" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr1)"/>
  <line x1="520" y1="160" x2="520" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr1)"/>

  <!-- MCP Server Boxes -->
  <!-- Filesystem -->
  <rect x="180" y="190" width="120" height="45" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">文件系统</text>
  <text x="240" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#064e3b">Filesystem</text>

  <!-- GitHub -->
  <rect x="340" y="190" width="120" height="45" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="400" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">GitHub</text>
  <text x="400" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#064e3b">仓库访问</text>

  <!-- Database -->
  <rect x="500" y="190" width="120" height="45" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="560" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">数据库</text>
  <text x="560" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#064e3b">PostgreSQL</text>

  <!-- Tools from each server -->
  <text x="240" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">read_file, write_file</text>
  <text x="400" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">create_issue, create_pr</text>
  <text x="560" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">query, execute</text>

  <!-- Arrow back to Codex -->
  <line x1="240" y1="265" x2="240" y2="290" stroke="#059669" stroke-width="1.5" marker-end="url(#arr1)"/>
  <line x1="400" y1="265" x2="400" y2="290" stroke="#059669" stroke-width="1.5" marker-end="url(#arr1)"/>
  <line x1="560" y1="265" x2="560" y2="290" stroke="#059669" stroke-width="1.5" marker-end="url(#arr1)"/>

  <!-- Tools to User -->
  <rect x="150" y="290" width="500" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Codex 工具集（统一接口）</text>

  <!-- Legend -->
  <rect x="50" y="340" width="700" height="30" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="358" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">配置位置: ~/.codex/config.toml 中的 [mcp_servers] 部分</text>
</svg>