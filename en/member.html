<script>
window.RUNOOB_CONFIG = {
  darkCssUrl: "https://www.runoob.com/wp-content/themes/runoob/dark-mode.css?v=1.125"
};

(function () {
  var t = localStorage.getItem('runoob-theme') || 'light';

  document.documentElement.setAttribute('data-theme', t);

  if (t === 'dark') {
    loadDarkCss();
  }

  function loadDarkCss() {
    if (document.getElementById('dark-theme-css')) return;

    var link = document.createElement('link');
    link.id = 'dark-theme-css';
    link.rel = 'stylesheet';
    link.href = window.RUNOOB_CONFIG.darkCssUrl;

    document.head.appendChild(link);
  }
})();
</script>

/* ===== 主题变量（核心）===== */
:root {
  --theme-bg: #ffffff;

  --theme-icon: #333;

}

.dark {
  --theme-bg: #1f2937;
  --theme-border: #374151;
  --theme-icon: #e5e7eb;
  --theme-hover: #374151;
}

/* ===== 按钮容器 ===== */
.nav-theme-toggle {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== 按钮本体 ===== */
.nav-theme-toggle button {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 28px;
  height: 28px;

  border-radius: 6px;
  border: 1px solid var(--theme-border);

  background: var(--theme-bg);
  color: var(--theme-icon);

  cursor: pointer;
  transition: all 0.2s ease;
}

/* ===== 图标大小 ===== */
.nav-theme-toggle i {
  font-size: 14px;
}

/* ===== hover 效果 ===== */
.nav-theme-toggle button:hover {
  background: var(--theme-hover);
  transform: translateY(-1px);
}

/* ===== 点击反馈 ===== */
.nav-theme-toggle button:active {
  transform: scale(0.95);
}

/* ===== 当前激活态（可选）===== */
.nav-theme-toggle button.active {
  border-color: #3b82f6;
  color: #3b82f6;
}

<script>
function del(aid) {
	var r=confirm("你真的要删除吗？");
	if(r) {
		$.post('http://www.runoob.com/wp-content/themes/runoob/option/user/userinfo.php',{action:"collarticle",opt:"del", aid:aid},function(res) {
			alert(res.msg);
			if(res.error==0) {
				location.reload();
			}
		},'json');
	}
}

$("ul.usermenu li").click(function(event) { 
	
	action = $(this).attr("class");

	if(action=="coll") {
		$("#user-coll").siblings().hide();
		$("#user-coll").show();
	} else if(action=='signout') {
		 return;
	} else {
		$.post('http://www.runoob.com/wp-content/themes/runoob/option/user/userinfo.php',{action:action},function(res) {
			if(action=="info") {
				$("#userinfo").siblings().hide();
				$("#userinfo").show();
				$("#userinfo input[name='logname']").val(res.data.logname);
				$("#userinfo input[name='email']").val(res.data.email);
				$("#userinfo input[name='nickname']").val(res.data.nickname);
				$("#userinfo input[name='url']").val(res.data.url);
				$("#userinfo input[name='qq']").val(res.data.qq);
				$("#userinfo input[name='weixin']").val(res.data.weixin);
			} else if(action=="password") {
				$("#userpass").siblings().hide();
				$("#userpass").show();
			} else if(action=="note") {
				$("#user-note").siblings().hide();
				$("#user-note").show();

				var lis = '';
				if(res.error==0) {
					 $.each(res.data, function(arrayID,group) {
				        lis += '<li class="signup"><a target="_blank" href="'+group.post_link+'">' + group.post_title  +  '</a><span>'+group.comment_date+'</span></li>';
				    });
				} else {
					lis += '<li>'+res.msg+'</li>';
				}
				$("#user-note").html(lis);
			} else {
				return;
			}
		},'json');
	}
	$(this).addClass('active');
	$(this).siblings().removeClass('active');
});

$('input[name="submit"]').click(function() {
	var action = $(this).parent().parent().find('input[name="action"]').val();
	if(action=='info.edit') {
		var nickname = $('input[name="nickname"]').val();
		var url = $('input[name="url"]').val();
		var qq = $('input[name="qq"]').val();
		var weixin = $('input[name="weixin"]').val();
		var jsondata = {action:action, nickname:nickname, url:url, qq:qq, weixin:weixin};
	} else if(action=='password.edit') {
		var passwordold = $('input[name="passwordold"]').val();
		var password = $('input[name="password"]').val();
		var password2 = $('input[name="password2"]').val();
		var jsondata = {action:action,passwordold:passwordold, password:password, password2:password2}
	}
	$.post('http://www.runoob.com/wp-content/themes/runoob/option/user/userinfo.php',jsondata,function(data) {
		alert(data.msg);
	},'json');
})


</script>
